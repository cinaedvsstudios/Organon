<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Library</title>
    
    <!-- Iframe Guard: Redirects to the hub if opened directly from its subfolder -->
    <script>
        if (window.self === window.top) {
            window.location.href = '../../index.html';
        }
    </script>
    
    <!-- External Fonts for Organon Styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           ORGANON GLOBAL BRAND STYLING TEMPLATE
           Strict Color Mappings & Total Rounded Pill Realignment
           ========================================================== */
        :root {
            --alabaster-paper: #F2ECE0;
            --stone-ochre: #E5A862;
            --water-spray: #79B4E3;
            --water-blue: #4B84BF;
            --chiseled-bronze: #896b49; 
            --burgundy: #4A1525;
            --brand-red: #9a2f4f;
            --forest-teal: #26615C;
            --bg-nightsky: #181919;
            --bg-card: #292a24; 
            --bg-input: rgba(24, 25, 25, 0.95);

            --font-headers: 'Cinzel', 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', 'Geist', system-ui, -apple-system, sans-serif;
            --font-mono: 'Geist Mono', 'Courier New', monospace;

            --light-blue: #75b2de;
            --slider-active: #9a2f4f; 
            --slider-track: #61112e;  
        }

        body {
            background-color: var(--bg-nightsky);
            color: var(--alabaster-paper);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        ::selection {
            background-color: var(--water-blue);
            color: var(--bg-nightsky);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-headers);
            color: var(--stone-ochre);
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-top: 0;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        input, select, textarea {
            background-color: var(--bg-input);
            color: #f0ebcb !important; 
            border: 1px solid var(--chiseled-bronze) !important;
            font-family: var(--font-body);
            padding: 10px 18px;
            border-radius: 9999px; 
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            font-size: 15px; 
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--water-blue) !important;
            box-shadow: 0 0 8px rgba(75, 132, 191, 0.35);
        }

        ::placeholder {
            color: var(--chiseled-bronze);
            opacity: 0.8;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--chiseled-bronze);
            border-radius: 9999px; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--water-blue);
        }

        .btn-pill {
            background-color: var(--forest-teal);
            color: var(--alabaster-paper);
            border: 1px solid var(--chiseled-bronze);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 12px 24px;
            border-radius: 9999px; 
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(38, 97, 92, 0.2);
            touch-action: manipulation;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-pill:hover {
            background-color: var(--water-blue);
            box-shadow: 0 6px 16px rgba(75, 132, 191, 0.4);
            transform: translateY(-1px);
            color: var(--alabaster-paper);
            text-shadow: 0 0 6px rgba(242, 236, 224, 0.4);
        }

        .btn-pill:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(75, 132, 191, 0.2);
            background-color: var(--water-blue);
        }

        .btn-pill:disabled {
            background-color: rgba(24, 25, 25, 0.3) !important;
            color: rgba(137, 107, 73, 0.5) !important;
            border-color: rgba(137, 107, 73, 0.2) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .btn-pill-secondary {
            background-color: transparent;
            border: 1px solid var(--chiseled-bronze);
            color: var(--stone-ochre);
        }
        .btn-pill-secondary:hover {
            background-color: rgba(229, 168, 98, 0.1);
            border-color: var(--stone-ochre);
        }

        .app-wrapper {
            width: 100%;
            max-width: 540px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            background-color: var(--bg-nightsky);
        }

        .top-sticky-panel {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #d79e5c; 
            background-image: linear-gradient(rgba(224, 163, 96, 0.7), rgba(224, 163, 96, 0.7)), url('../../Images/stonetext.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 24px 16px 16px 16px; 
            box-sizing: border-box;
            border-bottom: 1px solid var(--chiseled-bronze) !important;
            border-bottom-left-radius: 28px; 
            border-bottom-right-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: padding 0.3s ease-in-out;
        }

        .top-sticky-panel.minimized {
            padding: 8px 16px !important;
            cursor: pointer;
        }
        .top-sticky-panel.minimized .input-card-container {
            display: none !important;
        }

        .title-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(24, 25, 25, 0.9);
            color: var(--light-blue);
            font-family: var(--font-headers);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 9999px;
            border: 1px solid var(--chiseled-bronze);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            box-sizing: border-box;
            width: 100%; 
        }

        .countdown-circle-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--chiseled-bronze);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            margin-right: 12px;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.6);
            color: var(--stone-ochre);
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .countdown-circle-indicator:hover {
            border-color: var(--water-spray);
            color: var(--water-spray);
            box-shadow: 0 0 6px rgba(121, 180, 227, 0.4);
        }

        .input-card-container {
            width: 340px; 
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .search-clear-btn {
            position: absolute;
            right: 14px;
            top: 10px;
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--chiseled-bronze);
            cursor: pointer;
            display: none;
            padding: 0;
            line-height: 1;
        }
        .search-clear-btn:hover {
            color: var(--brand-red);
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--chiseled-bronze);
            border-radius: 16px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-height: 180px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 6px 0;
        }
        .autocomplete-row {
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--alabaster-paper);
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s;
        }
        .autocomplete-row:hover {
            background-color: rgba(75, 132, 191, 0.15);
            color: var(--water-spray);
        }

        .middle-scroll-panel {
            flex: 1;
            background-color: #000000; 
            padding: 16px 16px 120px 16px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 0.8rem;
        }

        .config-card {
            background-color: var(--bg-card) !important;
            border: 1px solid var(--chiseled-bronze) !important;
            border-radius: 24px;
            padding: 16px;
            box-sizing: border-box;
            position: relative;
        }

        .card-content {
            transition: all 0.3s ease;
        }
        .card-content.hidden {
            display: none !important;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        /* 3/4 and 1/4 layout for Favorites */
        .fav-preview-split {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 14px;
            align-items: stretch;
        }
        @media (max-width: 480px) {
            .fav-preview-split {
                grid-template-columns: 2fr 1fr;
            }
        }

        .category-filter-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .filter-circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--chiseled-bronze);
            background-color: rgba(24, 25, 25, 0.6);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }
        .filter-circle-btn.active {
            background-color: var(--forest-teal);
            border-color: var(--water-spray);
            box-shadow: 0 0 10px rgba(121, 180, 227, 0.25);
        }
        .filter-circle-btn:hover {
            border-color: var(--water-spray);
            transform: scale(1.05);
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Pulsing Blue Glow Animation */
        @keyframes pulseBlue {
            0% { box-shadow: 0 0 0 0 rgba(121, 180, 227, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(121, 180, 227, 0); }
            100% { box-shadow: 0 0 0 0 rgba(121, 180, 227, 0); }
        }

        .char-card {
            background-color: rgba(10, 10, 10, 0.5); /* Fully dark box */
            border: none !important; /* Removed borders */
            border-radius: 12px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.20s ease-in-out;
            position: relative;
        }
        .char-card:hover {
            background-color: rgba(75, 132, 191, 0.2);
            transform: scale(1.05);
        }
        .char-card.selected {
            background-color: rgba(75, 132, 191, 0.25);
            animation: pulseBlue 1.5s infinite;
        }
        .char-card:active {
            transform: scale(0.95);
        }

        /* Bold non-emojis */
        .char-non-emoji {
            font-weight: 700;
        }

        .char-latex-name {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--chiseled-bronze);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 2px;
        }

        .favorites-shelf {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            min-height: 42px;
            padding: 8px;
            border-radius: 14px;
            background-color: rgba(24, 25, 25, 0.5);
            border: 1px dashed rgba(137, 107, 73, 0.3) !important;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            max-height: 150px;
        }

        .fav-pill {
            background-color: var(--bg-input);
            border: 1px solid var(--chiseled-bronze) !important;
            border-radius: 9999px;
            padding: 4px 10px 4px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 32px;
        }
        .fav-pill:hover {
            border-color: var(--brand-red) !important;
        }

        .fav-remove {
            color: var(--brand-red);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 4px;
            cursor: pointer;
            border-radius: 50%;
        }
        .fav-remove:hover {
            background-color: rgba(154, 47, 79, 0.2);
        }

        /* Large Preview Box specific styles */
        #large-preview-box {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        #large-preview-box:hover {
            background-color: rgba(121, 180, 227, 0.15) !important;
            border-color: var(--water-spray) !important;
            box-shadow: 0 0 15px rgba(121, 180, 227, 0.3);
            transform: scale(1.02);
        }
        #large-preview-box:active {
            transform: scale(0.95);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 9999px;
            border: none !important;
            padding: 0;
            width: 100%;
            touch-action: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--slider-active) !important; 
            border: none !important;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--water-spray) !important;
            transform: scale(1.15);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--slider-active) !important;
            border: none !important;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        input[type="range"]::-moz-range-thumb:hover {
            background: var(--water-spray) !important;
            transform: scale(1.15);
        }

        .slider-val {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--stone-ochre);
            text-align: right;
            margin-top: -4px;
        }

        .control-group-title {
            color: var(--light-blue) !important;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid rgba(132, 104, 78, 0.15);
            padding-bottom: 6px;
        }
        .control-group-title svg {
            width: 14px;
            height: 14px;
        }

        .bottom-sticky-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 540px; 
            z-index: 110;
            background-color: #d79e5c; 
            background-image: linear-gradient(rgba(224, 163, 96, 0.75), rgba(224, 163, 96, 0.75)), url('../../Images/stonetext.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 16px 16px 20px 16px;
            box-sizing: border-box;
            display: flex;
            gap: 12px;
            justify-content: center;
            border-top: 1px solid var(--chiseled-bronze) !important;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
        }

        .bottom-sticky-panel .btn-pill {
            flex: 1;
            background-color: rgba(24, 25, 25, 0.9) !important; 
            color: var(--light-blue) !important;
            border: 1px solid var(--chiseled-bronze) !important;
            box-shadow: none !important;
            text-shadow: none !important;
            width: 100%;
        }

        .bottom-sticky-panel .btn-pill:hover {
            background-color: rgba(41, 42, 36, 0.95) !important;
            border-color: var(--water-spray) !important;
            box-shadow: 0 0 12px rgba(121, 180, 227, 0.4) !important;
        }

        .bottom-sticky-panel .btn-pill:disabled {
            background-color: rgba(24, 25, 25, 0.3) !important;
            color: rgba(137, 107, 73, 0.5) !important;
            border-color: rgba(137, 107, 73, 0.2) !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-nightsky);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(229, 168, 98, 0.1);
            border-radius: 50%;
            border-top-color: var(--stone-ochre);
            animation: spin 1s ease-in-out infinite;
        }

        .loader-title {
            font-family: var(--font-headers);
            font-size: 1.8rem;
            color: var(--stone-ochre);
            margin: 0;
            letter-spacing: 0.15em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .metadata-text {
            color: var(--chiseled-bronze);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        /* Custom Popup Overlay Modals */
        .overlay-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .modal-body-card {
            background-color: var(--bg-card);
            border: 1px solid var(--chiseled-bronze) !important;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
            position: relative; 
            z-index: 2101;
        }

        .modal-title {
            margin: 0;
            color: var(--stone-ochre) !important;
            font-size: 1.1rem;
            border-bottom: 1px dashed rgba(137, 107, 73, 0.3);
            padding-bottom: 8px;
        }
        
        .toast-container {
            position: fixed;
            bottom: 84px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 32px);
            max-width: 508px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .toast-notification {
            background-color: var(--burgundy);
            color: var(--alabaster-paper);
            border: 1px solid var(--chiseled-bronze) !important;
            padding: 10px 20px;
            border-radius: 9999px; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            background-color: var(--forest-teal);
            border-color: var(--water-spray) !important;
        }
    </style>
</head>
<body>

    <!-- PRE-FLIGHT SYSTEM ENGINE LOADER -->
    <div id="loading-overlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <div class="loader-title">CHARACTER SYSTEM</div>
        <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--water-spray);">Initializing local maps and unicode structures...</p>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-wrapper">
        
        <!-- PANEL 1: TOP STICKY UPLOAD BANNER -->
        <div class="top-sticky-panel">
            <!-- Absolute Title Pill -->
            <div class="title-pill">
                <div style="display: flex; align-items: center;">
                    <div id="countdown-circle" class="countdown-circle-indicator">5</div>
                    <span>CHAR LIBRARY</span>
                </div>
                <button type="button" id="clear-search-btn" class="btn-pill" style="padding: 4px 14px; font-size: 0.7rem; background-color: rgba(24, 25, 25, 0.6) !important; border: 1px solid var(--chiseled-bronze) !important;">Reset Search</button>
            </div>

            <!-- Global Search Card -->
            <div class="input-card-container">
                <input type="text" id="global-search-input" placeholder="Search keywords (e.g. 'arrow', 'alpha', 'smile')..." autocomplete="off">
                <span id="search-clear-x" class="search-clear-btn">&times;</span>
                
                <!-- Autocomplete Dropdown Panel -->
                <div id="autocomplete-box" class="autocomplete-dropdown hidden"></div>
            </div>
        </div>

        <!-- PANEL 2: MIDDLE SCROLLABLE PREVIEW & SETTINGS -->
        <main class="middle-scroll-panel">
            
            <div class="settings-grid">
                
                <!-- 1. Search Settings & Category Toggles (Collapsed / Minimized by default) -->
                <div class="config-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(132, 104, 78, 0.15); padding-bottom: 6px; margin-bottom: 6px;">
                        <div class="control-group-title" style="border: none; margin: 0; padding: 0;">
                            <svg fill="currentColor" viewBox="0 0 24 24" style="width:14px; height:14px; margin-right:6px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                            <span>1. Filter Settings</span>
                        </div>
                        <button type="button" id="toggle-filter-card-btn" class="btn-pill" style="padding: 3px 10px; font-size: 0.65rem; background-color: rgba(24, 25, 25, 0.6) !important;">Expand</button>
                    </div>
                    
                    <div id="filter-card-content" class="card-content hidden">
                        <label style="text-align: center; display: block; margin-top: 8px;">Include Categories</label>
                        <div class="category-filter-grid">
                            <div class="filter-circle-btn active" id="pill-emoji" data-category="emoji" title="Emojis">😀</div>
                            <div class="filter-circle-btn active" id="pill-math" data-category="math" title="Math Notation">∑</div>
                            <div class="filter-circle-btn active" id="pill-greek" data-category="greek" title="Greek / Science">Ω</div>
                            <div class="filter-circle-btn active" id="pill-ascii" data-category="ascii" title="ASCII / Retro">█</div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 14px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <label for="fuzzy-sensitivity">Fuzzy Search Sensitivity</label>
                                <span class="slider-val" id="sensitivity-val">Normal</span>
                            </div>
                            <input type="range" id="fuzzy-sensitivity" min="1" max="3" value="2">
                        </div>
                    </div>
                </div>

                <!-- 2. Favorites Shelf & Preview Split -->
                <div class="fav-preview-split">
                    <!-- Left: Favorites List -->
                    <div class="config-card" style="display: flex; flex-direction: column;">
                        <div class="control-group-title" style="justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(132, 104, 78, 0.15); padding-bottom: 6px; margin-bottom: 8px;">
                            <div style="display:flex; align-items:center;">
                                <span style="font-weight: 600; letter-spacing: 0.08em;">FAVORITES</span>
                            </div>
                            <div style="display:flex; gap:6px; align-items:center;">
                                <select id="active-list-selector" style="font-size: 0.7rem; padding: 4px 24px 4px 10px; width: auto; background-color: var(--bg-input); height: 26px; border-radius: 9999px;"></select>
                                <button type="button" id="edit-list-btn" class="btn-pill" style="padding: 3px 10px; font-size: 0.65rem; background-color: rgba(24, 25, 25, 0.6) !important;">Edit</button>
                            </div>
                        </div>
                        
                        <div id="favorites-edit-controls" class="hidden" style="margin-bottom: 8px; display: flex; gap: 8px; justify-content: flex-end; border-bottom: 1px dashed rgba(137, 107, 73, 0.2); padding-bottom: 8px;">
                            <button type="button" id="rename-list-trigger" class="btn-pill btn-pill-secondary" style="font-size: 0.65rem; padding: 4px 10px;">Rename</button>
                            <button type="button" id="delete-list-trigger" class="btn-pill btn-pill-secondary" style="font-size: 0.65rem; padding: 4px 10px; color: var(--brand-red); border-color: var(--brand-red);">Delete</button>

                        <div class="favorites-shelf" id="favorites-shelf-container" style="flex-grow: 1; margin-top: 0;">
                            <!-- Fav pills are injected here -->
                        </div>

                    <!-- Right: Large Preview -->
                    <div class="config-card" style="display: flex; align-items: center; justify-content: center; padding: 10px;">
                        <div id="large-preview-box" title="Click to copy selected character" class="char-non-emoji" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; text-shadow: 0 0 15px rgba(255,255,255,0.05); min-height: 80px; background-color: var(--bg-input); border-radius: 14px; border: 1px dashed rgba(137, 107, 73, 0.3);">
                            <!-- Large preview injected here -->
                        </div>
                    </div>
                </div>

                <!-- 3. Dynamic Results Card -->
                <div class="config-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <div class="control-group-title" style="border: none; margin: 0; padding: 0;">
                            <span style="font-weight: 600; letter-spacing: 0.08em;">3. LIBRARY (<span id="results-count">0</span>)</span>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center; position: relative;">
                            <!-- Emoji Skin Tone Selector (Hidden by default, opened by cog) -->
                            <div id="skin-tone-container" class="hidden" style="position: absolute; right: 36px; top: 0; z-index: 10;">
                                <select id="skin-tone-selector" style="font-size: 0.9rem; padding: 2px 20px 2px 8px; height: 28px; width: 110px;">
                                    <option value="">Default ✋</option>
                                    <option value="🏻">Light ✋🏻</option>
                                    <option value="🏼">Med-Light ✋🏼</option>
                                    <option value="🏽">Medium ✋🏽</option>
                                    <option value="🏾">Med-Dark ✋🏾</option>
                                    <option value="🏿">Dark ✋🏿</option>
                                </select>
                            </div>
                            <button type="button" id="lib-settings-cog" class="btn-pill btn-pill-secondary" style="padding: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;" title="Skin Tone Settings">
                                ⚙️
                            </button>
                        </div>
                    </div>
                    
                    <div class="char-grid" id="char-results-container">
                        <!-- Visual grids loaded here -->
                    </div>
                </div>
                
            </div>
        </main>

        <!-- PANEL 3: BOTTOM STICKY PILLED OPTION ACTIONS -->
        <div class="bottom-sticky-panel">
            <button type="button" class="btn-pill" id="add-selected-to-favs-btn" disabled>
                ❤️ Add to Favorites
            </button>
            <button type="button" class="btn-pill" id="new-list-trigger-btn" style="background-color: rgba(24,25,25,0.8); border: 1px solid var(--chiseled-bronze);">
                📂 New List
            </button>
        </div>

    </div>

    <!-- CUSTOM POPUP MODAL DIALOGS -->
    <div id="custom-dialog-modal" class="overlay-modal hidden">
        <div class="modal-body-card">
            <h3 class="modal-title" id="dialog-modal-title">Create New Favorites List</h3>
            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                <label for="dialog-input-field" id="dialog-input-label">Enter list name (emoji or text):</label>
                <input type="text" id="dialog-input-field" placeholder="e.g., ⭐ Game Assets">
            </div>
            <div class="flex-between" style="gap: 12px; margin-top: 16px;">
                <button type="button" id="dialog-cancel-btn" class="btn-pill btn-pill-secondary" style="flex: 1;">Cancel</button>
                <button type="button" id="dialog-confirm-btn" class="btn-pill" style="flex: 1;">Confirm</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION STACK -->
    <div id="toast-stack" class="toast-container"></div>

    <!-- CORE EXECUTION SCRIPT -->
    <script>
        // Use a defensive try/finally block to guarantee the loading screen vanishes
        // even if an error is encountered during early variable definition.
        try {
            // ==========================================================
            // SAFE LOCAL STORAGE SANDBOX FALLBACK
            // ==========================================================
            const safeStorage = {
                getItem: (key) => {
                    try {
                        return window.localStorage.getItem(key);
                    } catch (e) {
                        return safeStorage._fallbackStore[key] || null;
                    }
                },
                setItem: (key, value) => {
                    try {
                        window.localStorage.setItem(key, value);
                    } catch (e) {
                        safeStorage._fallbackStore[key] = String(value);
                    }
                },
                removeItem: (key) => {
                    try {
                        window.localStorage.removeItem(key);
                    } catch (e) {
                        delete safeStorage._fallbackStore[key];
                    }
                },
                _fallbackStore: {}
            };

            // ==========================================================
            // DYNAMIC JSON DICTIONARY LOADER
            // ==========================================================
            let CHAR_DICTIONARY = []; // Will be populated by fetch()

            // UI Bindings
            const globalSearchInput = document.getElementById("global-search-input");
            const searchClearX = document.getElementById("search-clear-x");
            const autocompleteBox = document.getElementById("autocomplete-box");
            const clearSearchBtn = document.getElementById("clear-search-btn");
            const fuzzySensitivity = document.getElementById("fuzzy-sensitivity");
            const sensitivityVal = document.getElementById("sensitivity-val");
            const filterCircleBtns = document.querySelectorAll(".filter-circle-btn");
            const resultsContainer = document.getElementById("char-results-container");
            const resultsCountSpan = document.getElementById("results-count");
            const favoritesShelf = document.getElementById("favorites-shelf-container");
            const activeListSelector = document.getElementById("active-list-selector");
            
            const toggleFilterCardBtn = document.getElementById("toggle-filter-card-btn");
            const filterCardContent = document.getElementById("filter-card-content");
            
            const libSettingsCog = document.getElementById("lib-settings-cog");
            const skinToneContainer = document.getElementById("skin-tone-container");
            const skinToneSelector = document.getElementById("skin-tone-selector");

            const editListBtn = document.getElementById("edit-list-btn");
            const favoritesEditControls = document.getElementById("favorites-edit-controls");
            const renameListTrigger = document.getElementById("rename-list-trigger");
            const deleteListTrigger = document.getElementById("delete-list-trigger");

            const addSelectedToFavsBtn = document.getElementById("add-selected-to-favs-btn");
            const newListTriggerBtn = document.getElementById("new-list-trigger-btn");
            const largePreviewBox = document.getElementById("large-preview-box");

            // Modals elements
            const customDialogModal = document.getElementById("custom-dialog-modal");
            const dialogModalTitle = document.getElementById("dialog-modal-title");
            const dialogInputLabel = document.getElementById("dialog-input-label");
            const dialogInputField = document.getElementById("dialog-input-field");
            const dialogCancelBtn = document.getElementById("dialog-cancel-btn");
            const dialogConfirmBtn = document.getElementById("dialog-confirm-btn");

            // State management
            let activeCategories = new Set(["emoji", "math", "greek", "ascii"]);
            let selectedCharacter = null;
            let recentSearches = [];
            let currentModalAction = "";
            let activeSkinTone = "";

            // Dynamic Favorites Library Multi-Lists
            let favoriteLibrary = {
                "⭐ Favorites": []
            };
            let activeListName = "⭐ Favorites";

            // Load multi-lists database safely
            const savedLists = safeStorage.getItem("organon_favorite_lists");
            if (savedLists) {
                try {
                    let parsed = JSON.parse(savedLists);
                    if (typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)) {
                        favoriteLibrary = parsed;
                    }
                } catch(e) {}
            }
            
            const savedActiveListName = safeStorage.getItem("organon_active_list_name");
            if (savedActiveListName && favoriteLibrary[savedActiveListName]) {
                activeListName = savedActiveListName;
            } else {
                activeListName = Object.keys(favoriteLibrary)[0] || "⭐ Favorites";
            }

            // Load recent searches safely
            const savedRecentSearches = safeStorage.getItem("organon_recent_searches");
            if (savedRecentSearches) {
                try {
                    let parsed = JSON.parse(savedRecentSearches);
                    if (Array.isArray(parsed)) recentSearches = parsed;
                } catch (e) {}
            }

            // Parent Window Status broadcasters
            function notifyHubStatus(text) {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({ type: 'set-status', text: text }, '*');
                }
            }

            function clearHubStatus() {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({ type: 'clear-status' }, '*');
                }
            }

            // Helper to broadcast button hover events to the parent Organon Hub Status Window
            function registerHoverDescription(selector, descriptionText) {
                const element = document.querySelector(selector);
                if (!element) return;
                element.addEventListener('mouseenter', () => notifyHubStatus(descriptionText));
                element.addEventListener('mouseleave', clearHubStatus);
            }

            // Helper to update dynamic slider track values
            function syncSliderBackground(slider) {
                const min = parseFloat(slider.min) || 0;
                const max = parseFloat(slider.max) || 100;
                const val = parseFloat(slider.value) || 0;
                const percentage = ((val - min) / (max - min)) * 100;
                slider.style.background = `linear-gradient(to right, #9a2f4f ${percentage}%, #61112e ${percentage}%)`;
            }

            // Initialize Slider Visual Tracking
            syncSliderBackground(fuzzySensitivity);
            fuzzySensitivity.addEventListener("input", () => {
                const val = parseInt(fuzzySensitivity.value);
                if (val === 1) sensitivityVal.innerText = "Exact";
                else if (val === 2) sensitivityVal.innerText = "Normal";
                else if (val === 3) sensitivityVal.innerText = "Fuzzy";
                syncSliderBackground(fuzzySensitivity);
                executeSearch();
            });

            // Toggle first settings panel card
            toggleFilterCardBtn.addEventListener("click", () => {
                if (filterCardContent.classList.contains("hidden")) {
                    filterCardContent.classList.remove("hidden");
                    toggleFilterCardBtn.innerText = "Collapse";
                } else {
                    filterCardContent.classList.add("hidden");
                    toggleFilterCardBtn.innerText = "Expand";
                }
            });

            // Toggle Library settings cog
            libSettingsCog.addEventListener("click", () => {
                if (skinToneContainer.classList.contains("hidden")) {
                    skinToneContainer.classList.remove("hidden");
                } else {
                    skinToneContainer.classList.add("hidden");
                }
            });

            skinToneSelector.addEventListener("change", () => {
                activeSkinTone = skinToneSelector.value;
                skinToneContainer.classList.add("hidden");
                executeSearch();
                renderFavorites();
                updateLargePreview();
            });

            // Reset search triggers
            clearSearchBtn.addEventListener("click", () => {
                globalSearchInput.value = "";
                searchClearX.style.display = "none";
                activeCategories = new Set(["emoji", "math", "greek", "ascii"]);
                filterCircleBtns.forEach(p => p.classList.add("active"));
                executeSearch();
            });

            // Search clear "x" inline button trigger
            searchClearX.addEventListener("click", () => {
                globalSearchInput.value = "";
                searchClearX.style.display = "none";
                executeSearch();
                globalSearchInput.focus();
            });

            // Autocomplete & Recent Search Drawer Mechanics
            globalSearchInput.addEventListener("focus", () => {
                showAutocomplete();
            });
            document.addEventListener("click", (e) => {
                if (!globalSearchInput.contains(e.target) && !autocompleteBox.contains(e.target)) {
                    autocompleteBox.classList.add("hidden");
                }
            });

            function showAutocomplete() {
                autocompleteBox.innerHTML = "";
                if (recentSearches.length === 0) {
                    autocompleteBox.classList.add("hidden");
                    return;
                }
                
                recentSearches.forEach(term => {
                    const row = document.createElement("div");
                    row.className = "autocomplete-row";
                    row.innerText = term;
                    row.addEventListener("click", () => {
                        globalSearchInput.value = term;
                        searchClearX.style.display = "block";
                        autocompleteBox.classList.add("hidden");
                        executeSearch();
                    });
                    autocompleteBox.appendChild(row);
                });
                autocompleteBox.classList.remove("hidden");
            }

            function saveSearchToHistory(term) {
                term = term.trim();
                if (term.length === 0) return;
                recentSearches = recentSearches.filter(t => t !== term);
                recentSearches.unshift(term);
                if (recentSearches.length > 10) {
                    recentSearches.pop();
                }
                safeStorage.setItem("organon_recent_searches", JSON.stringify(recentSearches));
            }

            // Bind interactive category clicks to circles
            filterCircleBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const category = btn.getAttribute("data-category");
                    if (btn.classList.contains("active")) {
                        btn.classList.remove("active");
                        activeCategories.delete(category);
                    } else {
                        btn.classList.add("active");
                        activeCategories.add(category);
                    }
                    executeSearch();
                });
            });

            // Core Search implementation
            globalSearchInput.addEventListener("input", () => {
                if (globalSearchInput.value.trim().length > 0) {
                    searchClearX.style.display = "block";
                } else {
                    searchClearX.style.display = "none";
                }
                executeSearch();
            });

            function applySkinTone(char, category) {
                if (category === "emoji" && activeSkinTone !== "") {
                    return char + activeSkinTone;
                }
                return char;
            }

            function executeSearch() {
                const query = globalSearchInput.value.trim().toLowerCase();
                const mode = parseInt(fuzzySensitivity.value); 
                resultsContainer.innerHTML = "";

                if (query.length > 0) {
                    saveSearchToHistory(query);
                }

                // Filter by categories first
                let matches = CHAR_DICTIONARY.filter(item => activeCategories.has(item.category));

                // Default Sort: Emojis first, then the rest
                const catOrder = { 'emoji': 1, 'math': 2, 'greek': 3, 'ascii': 4 };
                matches.sort((a, b) => catOrder[a.category] - catOrder[b.category]);

                if (query.length > 0) {
                    matches = matches.filter(item => {
                        const charVal = item.char;
                        const nameVal = item.name.toLowerCase();
                        const keywordsVal = item.keywords.toLowerCase();
                        const latexVal = item.latex ? item.latex.toLowerCase() : "";

                        if (mode === 1) {
                            return charVal === query || nameVal.includes(query) || latexVal === query;
                        } else if (mode === 2) {
                            return nameVal.includes(query) || keywordsVal.includes(query) || latexVal.includes(query);
                        } else {
                            // True Fuzzy Mode
                            const fuzzyMatch = (str, q) => {
                                let i = 0, j = 0;
                                while (i < str.length && j < q.length) {
                                    if (str[i] === q[j]) j++;
                                    i++;
                                }
                                return j === q.length;
                            };
                            const queryNoSpaces = query.replace(/\s+/g, '');
                            return fuzzyMatch(nameVal, queryNoSpaces) || fuzzyMatch(keywordsVal, queryNoSpaces) || fuzzyMatch(latexVal, queryNoSpaces);
                        }
                    });
                }

                resultsCountSpan.innerText = matches.length;

                if (matches.length === 0) {
                    resultsContainer.innerHTML = `
                        <div style="grid-column: 1 / -1; padding: 24px 0; text-align: center; opacity: 0.6; font-size: 0.8rem;">
                            No matching symbols found. Modify filters or use the Fuzzy setting.
                        </div>
                    `;
                    return;
                }

                const renderLimit = Math.min(matches.length, 250);

                for(let i=0; i<renderLimit; i++) {
                    const item = matches[i];
                    const card = document.createElement("div");
                    card.className = "char-card";
                    
                    if (item.category !== "emoji") {
                        card.classList.add("char-non-emoji");
                    }

                    if (selectedCharacter && selectedCharacter.char === item.char) {
                        card.classList.add("selected");
                    }
                    
                    const finalChar = applySkinTone(item.char, item.category);
                    const subLabel = item.latex ? `<div class="char-latex-name" title="${item.latex}">${item.latex}</div>` : "";
                    
                    card.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;">
                            <div>${finalChar}</div>
                            ${subLabel}
                        </div>
                    `;

                    // Handle single-click visual selection (DOES NOT COPY)
                    card.addEventListener("click", () => {
                        document.querySelectorAll(".char-card").forEach(c => c.classList.remove("selected"));
                        card.classList.add("selected");
                        selectedCharacter = { ...item, renderedChar: finalChar };
                        
                        updateLargePreview();

                        addSelectedToFavsBtn.disabled = false;
                        addSelectedToFavsBtn.innerHTML = `❤️ Add to Favorites`;
                    });

                    card.addEventListener("mouseenter", () => {
                        const latexNotice = item.latex ? ` (LaTeX: ${item.latex})` : "";
                        notifyHubStatus(`Click to select: "${finalChar}" - ${item.name}${latexNotice}`);
                    });
                    card.addEventListener("mouseleave", clearHubStatus);

                    resultsContainer.appendChild(card);
                }
            }

            // Preview box click to copy interaction
            largePreviewBox.addEventListener("click", () => {
                if (selectedCharacter) {
                    copyToClipboard(selectedCharacter.renderedChar || selectedCharacter.char);
                }
            });

            largePreviewBox.addEventListener("mouseenter", () => {
                if (selectedCharacter) {
                    notifyHubStatus(`Click to copy ${selectedCharacter.renderedChar || selectedCharacter.char} to clipboard.`);
                }
            });
            largePreviewBox.addEventListener("mouseleave", clearHubStatus);

            function updateLargePreview() {
                if (selectedCharacter) {
                    largePreviewBox.innerHTML = selectedCharacter.renderedChar || selectedCharacter.char;
                    if(selectedCharacter.category !== "emoji") {
                        largePreviewBox.classList.add("char-non-emoji");
                    } else {
                        largePreviewBox.classList.remove("char-non-emoji");
                    }
                } else {
                    largePreviewBox.innerHTML = "";
                }
            }

            // Favorites Multi-List Core Logic
            function renderActiveListSelector() {
                activeListSelector.innerHTML = "";
                Object.keys(favoriteLibrary).forEach(listName => {
                    const opt = document.createElement("option");
                    opt.value = listName;
                    opt.innerText = listName;
                    if (listName === activeListName) {
                        opt.selected = true;
                    }
                    activeListSelector.appendChild(opt);
                });
            }

            activeListSelector.addEventListener("change", () => {
                activeListName = activeListSelector.value;
                safeStorage.setItem("organon_active_list_name", activeListName);
                renderFavorites();
            });

            editListBtn.addEventListener("click", () => {
                if (favoritesEditControls.classList.contains("hidden")) {
                    favoritesEditControls.classList.remove("hidden");
                    editListBtn.innerText = "Close";
                } else {
                    favoritesEditControls.classList.add("hidden");
                    editListBtn.innerText = "Edit";
                }
            });

            addSelectedToFavsBtn.addEventListener("click", () => {
                if (!selectedCharacter) return;
                
                if (!favoriteLibrary[activeListName]) {
                    favoriteLibrary[activeListName] = [];
                }

                const activeChar = selectedCharacter.renderedChar || selectedCharacter.char;
                const exists = favoriteLibrary[activeListName].some(item => (item.renderedChar || item.char) === activeChar);
                
                if (!exists) {
                    favoriteLibrary[activeListName].push(selectedCharacter);
                    safeStorage.setItem("organon_favorite_lists", JSON.stringify(favoriteLibrary));
                    renderFavorites();
                    // Custom notification logic directly integrated so it doesn't crash if toast is missing
                    const stack = document.getElementById("toast-stack");
                    if (stack) {
                        const toast = document.createElement("div");
                        toast.className = `toast-notification toast-success`;
                        toast.innerHTML = `<span>Added "${activeChar}" to active list: ${activeListName}</span>`;
                        stack.appendChild(toast);
                        setTimeout(() => toast.classList.add("show"), 50);
                        setTimeout(() => {
                            toast.classList.remove("show");
                            setTimeout(() => {
                                if (toast.parentNode) toast.parentNode.removeChild(toast);
                            }, 300);
                        }, 3000);
                    }
                }
            });

            function renderFavorites() {
                favoritesShelf.innerHTML = "";
                const activeList = favoriteLibrary[activeListName] || [];

                if (activeList.length === 0) {
                    favoritesShelf.innerHTML = ``;
                    return;
                }

                activeList.forEach(item => {
                    const favPill = document.createElement("span");
                    favPill.className = "fav-pill";
                    
                    const finalChar = item.renderedChar || applySkinTone(item.char, item.category);

                    if (item.category !== "emoji") {
                        favPill.classList.add("char-non-emoji");
                    }

                    favPill.innerHTML = `
                        <span>${finalChar}</span>
                        <span class="fav-remove" title="Remove">&times;</span>
                    `;

                    favPill.addEventListener("click", (e) => {
                        if (e.target.classList.contains("fav-remove")) {
                            e.stopPropagation();
                            removeFavorite(item.char);
                        } else {
                            selectedCharacter = { ...item, renderedChar: finalChar };
                            updateLargePreview();
                            addSelectedToFavsBtn.disabled = false;
                            document.querySelectorAll(".char-card").forEach(c => {
                                if(c.innerText.includes(finalChar)) {
                                    c.classList.add("selected");
                                } else {
                                    c.classList.remove("selected");
                                }
                            });
                        }
                    });

                    favPill.addEventListener("mouseenter", () => {
                        notifyHubStatus(`Favorite: "${finalChar}". Click to load into preview, or tap 'x' to remove.`);
                    });
                    favPill.addEventListener("mouseleave", clearHubStatus);

                    favoritesShelf.appendChild(favPill);
                });
            }

            function removeFavorite(char) {
                if (favoriteLibrary[activeListName]) {
                    favoriteLibrary[activeListName] = favoriteLibrary[activeListName].filter(item => item.char !== char);
                    safeStorage.setItem("organon_favorite_lists", JSON.stringify(favoriteLibrary));
                    renderFavorites();
                }
            }

            newListTriggerBtn.addEventListener("click", () => {
                currentModalAction = "create";
                dialogModalTitle.innerText = "Create New Favorites List";
                dialogInputLabel.innerText = "Enter list name (emoji or text):";
                dialogInputField.value = "";
                dialogInputField.placeholder = "e.g., ⭐ Game Assets";
                customDialogModal.classList.remove("hidden");
            });

            renameListTrigger.addEventListener("click", () => {
                currentModalAction = "rename";
                dialogModalTitle.innerText = `Rename Active List (${activeListName})`;
                dialogInputLabel.innerText = "Enter new list name:";
                dialogInputField.value = activeListName;
                customDialogModal.classList.remove("hidden");
            });

            deleteListTrigger.addEventListener("click", () => {
                const listNames = Object.keys(favoriteLibrary);
                if (listNames.length <= 1) {
                    return;
                }
                
                const listToDelete = activeListName;
                delete favoriteLibrary[listToDelete];
                
                activeListName = Object.keys(favoriteLibrary)[0];
                safeStorage.setItem("organon_favorite_lists", JSON.stringify(favoriteLibrary));
                safeStorage.setItem("organon_active_list_name", activeListName);
                
                renderActiveListSelector();
                renderFavorites();
                favoritesEditControls.classList.add("hidden");
                editListBtn.innerText = "Edit";
            });

            dialogCancelBtn.addEventListener("click", () => {
                customDialogModal.classList.add("hidden");
            });

            dialogConfirmBtn.addEventListener("click", () => {
                const val = dialogInputField.value.trim();
                if (val.length === 0) {
                    return;
                }

                if (currentModalAction === "create") {
                    if (favoriteLibrary[val]) return;
                    favoriteLibrary[val] = [];
                    activeListName = val;
                } else if (currentModalAction === "rename") {
                    if (val === activeListName) {
                        customDialogModal.classList.add("hidden");
                        return;
                    }
                    if (favoriteLibrary[val]) return;
                    
                    favoriteLibrary[val] = favoriteLibrary[activeListName];
                    delete favoriteLibrary[activeListName];
                    activeListName = val;
                    favoritesEditControls.classList.add("hidden");
                    editListBtn.innerText = "Edit";
                }

                safeStorage.setItem("organon_favorite_lists", JSON.stringify(favoriteLibrary));
                safeStorage.setItem("organon_active_list_name", activeListName);
                
                renderActiveListSelector();
                renderFavorites();
                customDialogModal.classList.add("hidden");
            });

            // Clipboard Copy function
            function copyToClipboard(text) {
                const el = document.createElement('textarea');
                el.value = text;
                el.setAttribute('readonly', '');
                el.style.position = 'absolute';
                el.style.left = '-9999px';
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                
                const stack = document.getElementById("toast-stack");
                if (stack) {
                    const toast = document.createElement("div");
                    toast.className = `toast-notification toast-success`;
                    toast.innerHTML = `<span>Copied character: "${text}" to clipboard!</span>`;
                    stack.appendChild(toast);
                    setTimeout(() => toast.classList.add("show"), 50);
                    setTimeout(() => {
                        toast.classList.remove("show");
                        setTimeout(() => {
                            if (toast.parentNode) toast.parentNode.removeChild(toast);
                        }, 300);
                    }, 3000);
                }
            }

            // Register hover explanations
            registerHoverDescription('#title-banner-pill', 'Character Library — browse and copy specialized math, Greek, and retro symbols.');
            registerHoverDescription('#clear-search-btn', 'Clear search text and restore all category filter switches.');
            registerHoverDescription('#global-search-input', 'Type descriptors, names, or LaTeX tags (e.g., "alpha", "square", "locked") to search the archive.');
            registerHoverDescription('#pill-emoji', 'Toggle visibility of selected emojis inside the output viewport.');
            registerHoverDescription('#pill-math', 'Toggle visibility of specialized calculus, set-theory, and arithmetic symbols.');
            registerHoverDescription('#pill-greek', 'Toggle visibility of Greek coordinates and scientific variables.');
            registerHoverDescription('#pill-ascii', 'Toggle visibility of retro block shades, arrow vectors, and graphical lines.');
            registerHoverDescription('#fuzzy-sensitivity', 'Slide to adjust keyword sensitivity. Left is strict literal contains; Right searches loosely by keywords.');
            registerHoverDescription('#active-list-selector', 'Switch active favorites list tab.');
            registerHoverDescription('#edit-list-btn', 'Expose active list configuration commands (rename, delete).');
            registerHoverDescription('#add-selected-to-favs-btn', 'Add the selected character result to your active favorites list.');
            registerHoverDescription('#new-list-trigger-btn', 'Define and spawn a new favorites list namespace.');
            registerHoverDescription('#countdown-circle', 'Double-click to lock/unlock the top panel from auto-minimizing.');
            registerHoverDescription('#lib-settings-cog', 'Open advanced library settings, including Emoji Skin Tone modifiers.');
            registerHoverDescription('#large-preview-box', 'Click to copy selected character to clipboard.');

            // ==========================================================
            // AUTO-MINIMIZATION & TIMED LOCK CONTROL PIPELINE
            // ==========================================================
            const topStickyPanel = document.querySelector(".top-sticky-panel");
            const countdownCircle = document.getElementById("countdown-circle");

            let countdownVal = 5;
            let countdownInterval = null;
            let isPanelLocked = false;
            let isHoveringPanel = false;

            function updateCircleDisplay() {
                if (isPanelLocked) {
                    countdownCircle.innerHTML = "🔒";
                } else {
                    countdownCircle.innerHTML = countdownVal;
                }
            }

            function startCountdown() {
                if (isPanelLocked || isHoveringPanel) return;
                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    countdownVal--;
                    updateCircleDisplay();
                    if (countdownVal <= 0) {
                        clearInterval(countdownInterval);
                        minimizePanel();
                    }
                }, 1000);
            }

            function resetCountdown() {
                clearInterval(countdownInterval);
                countdownVal = 5;
                updateCircleDisplay();
            }

            function minimizePanel() {
                topStickyPanel.classList.add("minimized");
            }

            function maximizePanel() {
                topStickyPanel.classList.remove("minimized");
                resetCountdown();
            }

            // Bind interactive event handlers to panel coordinates
            topStickyPanel.addEventListener("mouseenter", () => {
                isHoveringPanel = true;
                maximizePanel();
                clearInterval(countdownInterval);
            });

            topStickyPanel.addEventListener("mouseleave", () => {
                isHoveringPanel = false;
                resetCountdown();
                startCountdown();
            });

            topStickyPanel.addEventListener("click", () => {
                if (topStickyPanel.classList.contains("minimized")) {
                    maximizePanel();
                }
            });

            countdownCircle.addEventListener("dblclick", (e) => {
                e.stopPropagation();
                e.preventDefault();
                isPanelLocked = !isPanelLocked;
                updateCircleDisplay();
                if (isPanelLocked) {
                    clearInterval(countdownInterval);
                    maximizePanel();
                } else {
                    if (!isHoveringPanel) {
                        startCountdown();
                    }
                }
            });

            // ==========================================================
            // ASYNC BOOT LOADER & FETCH PIPELINE
            // ==========================================================
            async function bootEngine() {
                try {
                    // Fetch external JSON database instead of hardcoding strings
                    const response = await fetch('char_data.json');
                    if (!response.ok) throw new Error("Failed to load char_data.json");
                    
                    CHAR_DICTIONARY = await response.json();

                    // Sort default view: Emojis first, then the rest
                    const catOrder = { 'emoji': 1, 'math': 2, 'greek': 3, 'ascii': 4 };
                    CHAR_DICTIONARY.sort((a, b) => (catOrder[a.category] || 5) - (catOrder[b.category] || 5));

                    // Initialize Search result grids & data lists now that dictionary is loaded
                    renderActiveListSelector();
                    executeSearch();
                    renderFavorites();

                } catch (error) {
                    console.error("Initialization Error:", error);
                    const container = document.getElementById("char-results-container");
                    if(container) {
                        container.innerHTML = `
                            <div style="grid-column: 1 / -1; color: var(--brand-red); padding: 20px; text-align: center; font-size: 0.85rem;">
                                <strong>Failed to load Dictionary!</strong><br><br>
                                Error: ${error.message}<br><br>
                                <span style="opacity: 0.8; font-size: 0.75rem;">If you are testing this locally without a web server (using file:// protocol), the browser's CORS policy will block the JSON fetch.</span>
                            </div>`;
                    }
                } finally {
                    // Remove loading screen safely
                    const overlay = document.getElementById("loading-overlay");
                    if (overlay) {
                        overlay.style.opacity = "0";
                        setTimeout(() => {
                            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                        }, 300);
                    }
                    // Engage UI minimizing timer
                    startCountdown();
                }
            }

            // Execute boot sequence immediately
            bootEngine();

        } catch (error) {
            console.error("Critical Execution Error:", error);
            const container = document.getElementById("char-results-container");
            if(container) {
                container.innerHTML = `<div style="grid-column: 1 / -1; color: var(--brand-red); padding: 20px; text-align: center;">Script initialization failed: ${error.message}</div>`;
            }
            // Fallback loader removal in case of total failure
            const overlay = document.getElementById("loading-overlay");
            if (overlay) {
                overlay.style.opacity = "0";
                setTimeout(() => {
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                }, 300);
            }
        }
    </script>
</body>
</html>
