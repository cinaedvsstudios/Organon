name: Apply ImgAutoCut v1.02 source update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run ImgAutoCut v1.02 source updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/imgautocut_20260809_update.py

      - name: Validate JavaScript and expected UI
        shell: bash
        run: |
          node --check tools/imgautocut/app.js
          grep -q 'id="smart-filter"' tools/imgautocut/index.html
          grep -q 'id="manager-sort"' tools/imgautocut/index.html
          grep -q 'id="zoom-modal"' tools/imgautocut/index.html
          grep -q 'smartFilterTinyIslands' tools/imgautocut/app.js
          grep -q 'renderZoomCanvas' tools/imgautocut/app.js

      - name: Commit source and remove temporary updater
        shell: bash
        run: |
          rm -f .github/imgautocut_20260809_update.py .github/workflows/imgautocut-20260809-update.yml .github/.imgautocut-20260809-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ImgAutoCut smart filtering sorting and zoom inspector'
          git push origin main
