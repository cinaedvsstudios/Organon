name: Onda Phase 3 canonical mobile migration

on:
  push:
    branches:
      - onda-phase3-mobile-library

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onda-phase3-mobile-library
          fetch-depth: 0

      - name: Migrate Phase 3 into canonical Onda sources
        run: python3 .github/onda-phase3-migrate.py

      - name: Validate canonical JavaScript
        run: node --check tools/Onda/js/app-core.js

      - name: Verify correction files stay absent
        run: |
          test ! -e tools/Onda/css/final-ui-fixes.css
          test ! -e tools/Onda/css/onda-v3-5.css
          test ! -e tools/Onda/js/onda-v3-5.js
          test ! -e tools/Onda/js/layout-enhancements.js
          ! grep -R "stopImmediatePropagation\|OndaV37" tools/Onda/js/app-core.js tools/Onda/index.html

      - name: Commit only the canonical Phase 3 result
        run: |
          rm -f .github/onda-phase3-migrate.py .github/workflows/onda-phase3-migrate.yml
          git config user.name "cinaedvsstudios"
          git config user.email "cinaedvsstudios@gmail.com"
          git add tools/Onda/js/app-core.js tools/Onda/css/responsive.css tools/Onda/index.html
          git add -u .github/onda-phase3-migrate.py .github/workflows/onda-phase3-migrate.yml
          git commit -m "Phase 3: improve Onda mobile Library and long filenames"
          git push origin HEAD:onda-phase3-mobile-library
