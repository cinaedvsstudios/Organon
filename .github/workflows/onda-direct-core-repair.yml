name: One-time Onda direct core repair

on:
  push:
    branches:
      - fix/onda-cloud-sync-core-20260701
    paths:
      - .github/workflows/onda-direct-core-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onda-cloud-sync-core-20260701
          fetch-depth: 0

      - name: Apply direct source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('tools/Onda')
          index_path = root / 'index.html'
          css_path = root / 'css' / 'responsive.css'
          controls_path = root / 'css' / 'controls.css'
          core_paths = [root / 'js' / 'app-core.js', root / 'js' / '00-app-core.js']

          def exactly_one_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_function(text, signature, replacement):
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError(f'Missing function: {signature}')
              open_brace = text.find('{', start)
              depth = 0
              in_single = in_double = in_template = False
              escaped = False
              i = open_brace
              while i < len(text):
                  ch = text[i]
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif in_single:
                      if ch == "'": in_single = False
                  elif in_double:
                      if ch == '"': in_double = False
                  elif in_template:
                      if ch == '`': in_template = False
                  else:
                      if ch == "'": in_single = True
                      elif ch == '"': in_double = True
                      elif ch == '`': in_template = True
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:start] + replacement + text[i+1:]
                  i += 1
              raise RuntimeError(f'Unclosed function: {signature}')

          # 1. Delete the old speed-cycle control from the static player source.
          index = index_path.read_text(encoding='utf-8')
          index, count = re.subn(r'\n\s*<button class="utility-btn speed-glyph" data-tooltip="Cycle Speed" id="btn-speed-cycle">🚀</button>', '', index, count=1)
          if count != 1:
              raise RuntimeError(f'Speed button markup: expected one match, found {count}')
          index_path.write_text(index, encoding='utf-8')

          for core_path in core_paths:
              text = core_path.read_text(encoding='utf-8')

              text, count = re.subn(r'\n\s*// Custom Play Speed cycles[^\n]*\n\s*const speedCycles = \[[^\]]*\];\n\s*let currentSpeedIdx = 0;\n', '\n', text, count=1)
              if count != 1:
                  raise RuntimeError(f'{core_path.name}: speed cycle state expected one match, found {count}')

              text, count = re.subn(r'\n\s*const btnSpeedCycle = document\.getElementById\(\'btn-speed-cycle\'\);\n', '\n', text, count=1)
              if count != 1:
                  raise RuntimeError(f'{core_path.name}: speed button reference expected one match, found {count}')

              text, count = re.subn(r'\n\s*btnSpeedCycle\.addEventListener\(\'click\', \(\) => \{.*?\n\s*\}\);\n', '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{core_path.name}: speed listener expected one match, found {count}')

              text, count = re.subn(r'\n\s*if \(btnSpeedCycle\) btnSpeedCycle\.innerText = `🚀\$\{val\.toFixed\(1\)\.replace\(\'\.0\', \'\'\)\}`;\n', '\n', text, count=1)
              if count != 1:
                  raise RuntimeError(f'{core_path.name}: speed text rewrite expected one match, found {count}')

              # 2. Restore real Library Select toggle behaviour.
              select_replacement = '''function toggleLibrarySelectMode(force = null) {
            const next = typeof force === 'boolean' ? force : !isLibrarySelectMode;
            isLibrarySelectMode = next;
            if (!next) selectedLibraryIds.clear();
            setLibraryActionPanel('select');
            updateBulkActionUI();
            renderLibraryManager();
        }'''
              text = replace_function(text, 'function toggleLibrarySelectMode(force = null)', select_replacement)

              # 3. Guard asynchronous track loading. A later selection invalidates every earlier load.
              text = exactly_one_replace(text, '        let currentFile = null;\n', '        let currentFile = null;\n        let trackLoadRequestId = 0;\n', f'{core_path.name}: track-load request state')
              load_start = 'async function loadTrack(file)'
              position = text.find(load_start)
              if position < 0:
                  raise RuntimeError(f'{core_path.name}: missing {load_start}')
              function_end_anchor = text.find('\n        function ', position + len(load_start))
              if function_end_anchor < 0:
                  raise RuntimeError(f'{core_path.name}: cannot find end of loadTrack')
              segment = text[position:function_end_anchor]
              segment, count = re.subn(
                  r'(async function loadTrack\(file\)\s*\{\n)(\s*)currentFile = file;',
                  r'\1\2const requestId = ++trackLoadRequestId;\n\2currentFile = file;\n\2if (localAudio.src && localAudio.src.startsWith(\'blob:\')) URL.revokeObjectURL(localAudio.src);\n\2localAudio.removeAttribute(\'src\');',
                  segment,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'{core_path.name}: cannot initialise load request')
              lines = segment.splitlines(True)
              guarded = []
              for line in lines:
                  guarded.append(line)
                  if 'await ' in line and 'requestId !== trackLoadRequestId' not in line:
                      indent = re.match(r'\s*', line).group(0)
                      guarded.append(f'{indent}if (requestId !== trackLoadRequestId) return;\n')
              segment = ''.join(guarded)
              text = text[:position] + segment + text[function_end_anchor:]

              # 4. Remove playlist editing inline JavaScript if it exists in this source copy.
              text, inline_count = re.subn(
                  r'\s+onclick="openPlaylistEditModal\([^\"]*\)"',
                  ' data-onda-edit-playlist="current"',
                  text,
              )
              if inline_count:
                  hook = "        document.addEventListener('click', (event) => {\n            const editButton = event.target.closest('[data-onda-edit-playlist=\"current\"]');\n            if (!editButton) return;\n            event.preventDefault();\n            if (activePlaylistView) openPlaylistEditModal(activePlaylistView);\n        });\n\n"
                  insertion = text.find('        // --- 8. DIRECT INLINE DISPLAY NAME TYPE-OVER')
                  if insertion < 0:
                      raise RuntimeError(f'{core_path.name}: cannot place playlist edit listener')
                  text = text[:insertion] + hook + text[insertion:]

              # 5. Fix the confirmed nested playlist-edit row markup.
              text = text.replace('<div class="library-row-main">\n                        <div class="library-row-main playlist-edit-row-main">', '<div class="library-row-main playlist-edit-row-main">')
              text = text.replace('''                        </div>
                        <div class="library-row-buttons">''', '''                        <div class="library-row-buttons">''')
              text = text.replace('''                        </div>
                    </div>`;''', '''                        </div>`;''')

              core_path.write_text(text, encoding='utf-8')

          # 6. Remove the mobile pseudo-icons which duplicate the real action-button icons.
          css = css_path.read_text(encoding='utf-8')
          for token in ('btn-play-playlist::after', 'btn-shuffle-playlist::after', 'btn-edit-playlist::after', 'btn-onda-row-play::before', 'btn-history-info::before', 'btn-onda-add-playlist::before'):
              pattern = re.compile(r'\n(?:[^{}]*' + re.escape(token) + r'[^{}]*)\{[^{}]*\}\n', re.S)
              css, count = pattern.subn('\n', css, count=1)
              if count != 1:
                  raise RuntimeError(f'responsive.css: pseudo-icon {token} expected one match, found {count}')

          css = css.replace('font-size: 0;\n  height: 34px;', 'font-size: 1.05rem;\n  height: 34px;', 1)
          css = css.replace('font-size: 0;\n    height: 42px;', 'font-size: 1.08rem;\n    height: 42px;', 1)
          css_path.write_text(css, encoding='utf-8')

          controls = controls_path.read_text(encoding='utf-8')
          controls, _ = re.subn(r'\n/\* Playback-speed cycling is intentionally removed from the UI\. The normal speed slider remains in Settings\. \*/\n#btn-speed-cycle \{\n  display: none;\n\}\n', '\n', controls, count=1)
          controls_path.write_text(controls, encoding='utf-8')
          PY

      - name: Static checks
        run: |
          node --check tools/Onda/js/app-core.js
          node --check tools/Onda/js/00-app-core.js
          node --check tools/Onda/js/cloud-sync.js
          node --check tools/Onda/js/layout-enhancements.js
          node --check tools/Onda/netlify/functions/onda-sync.js
          ! grep -R "btn-speed-cycle\|btnSpeedCycle\|speedCycles\|currentSpeedIdx" -n tools/Onda/index.html tools/Onda/js/app-core.js tools/Onda/js/00-app-core.js
          ! grep -R "onclick=\"openPlaylistEditModal" -n tools/Onda/js/app-core.js tools/Onda/js/00-app-core.js

      - name: Commit direct source repairs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/onda-direct-core-repair.yml
          git add tools/Onda/index.html tools/Onda/js/app-core.js tools/Onda/js/00-app-core.js tools/Onda/css/responsive.css tools/Onda/css/controls.css .github/workflows/onda-direct-core-repair.yml
          git commit -m "Apply Onda direct core repairs"
          git push origin HEAD:fix/onda-cloud-sync-core-20260701
