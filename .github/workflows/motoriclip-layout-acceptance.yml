name: MotoriClip responsive layout acceptance
on:
  pull_request:
    paths:
      - 'tools/audio-timeline/advanced.html'
      - 'tools/audio-timeline/tests/layout-acceptance.browser.mjs'
      - '.github/workflows/motoriclip-layout-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tools/audio-timeline/tests/layout-acceptance.browser.mjs
  reset-portable-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/audio-timeline/tests/project-portable.browser.mjs
      - run: node tools/audio-timeline/tests/project-recovery.browser.mjs
