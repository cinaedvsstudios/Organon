name: Apply Onda v3.7 source update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run Onda v3.7 source updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed Onda v3.7 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Missing expected source block in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {found}: {old[:100]!r}')
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # Actual app-shell fix: the player is already the first non-shrinking flex item.
          # It must not also be sticky, because sticky top:0 can overlay the workspace tabs
          # when Android changes the visual viewport during zoom/address-bar/focus changes.
          replace_exact(
              'tools/Onda/css/layout.css',
              '  position: sticky;\n  top: 0;\n  z-index: 100;\n',
              '  position: relative;\n  z-index: 100;\n',
              1,
          )

          # Force the new shell CSS and JS to be fetched and load the media-session module.
          p = Path('tools/Onda/js/layout-enhancements.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const V36_STYLESHEET_ID = 'onda-v3-6-styles';", "const V37_STYLESHEET_ID = 'onda-v3-7-styles';")
          text = text.replace("const V36_SCRIPT_ID = 'onda-v3-6-script';", "const V37_SCRIPT_ID = 'onda-v3-7-script';\n    const MEDIA_SESSION_SCRIPT_ID = 'onda-media-session-script';")
          text = text.replace('function ensureResponsiveStylesheetVersion() {', 'function ensureCoreStylesheetVersions() {')
          old_block = """        const stylesheet = Array.from(document.querySelectorAll('link[rel=\"stylesheet\"]'))
            .find((link) => /(?:^|\\/)css\\/responsive\\.css(?:[?#]|$)/.test(link.getAttribute('href') || ''));
        if (stylesheet && stylesheet.getAttribute('href') !== 'css/responsive.css?v=3.6') {
            stylesheet.setAttribute('href', 'css/responsive.css?v=3.6');
        }
"""
          new_block = """        const stylesheets = Array.from(document.querySelectorAll('link[rel=\"stylesheet\"]'));
        const versioned = {
            'layout.css': 'css/layout.css?v=3.7',
            'responsive.css': 'css/responsive.css?v=3.7'
        };
        Object.entries(versioned).forEach(([fileName, href]) => {
            const stylesheet = stylesheets.find((link) => new RegExp(`(?:^|/)css/${fileName.replace('.', '\\\\.')}(?:[?#]|$)`).test(link.getAttribute('href') || ''));
            if (stylesheet && stylesheet.getAttribute('href') !== href) stylesheet.setAttribute('href', href);
        });
"""
          if old_block not in text:
              raise SystemExit('Expected responsive cache block not found in layout-enhancements.js')
          text = text.replace(old_block, new_block)
          text = text.replace("stylesheet.href = 'css/final-ui-fixes.css?v=3.6';", "stylesheet.href = 'css/final-ui-fixes.css?v=3.7';")
          text = text.replace('function ensureV36Assets() {', 'function ensureV37Assets() {')
          text = text.replace('V36_STYLESHEET_ID', 'V37_STYLESHEET_ID')
          text = text.replace('V36_SCRIPT_ID', 'V37_SCRIPT_ID')
          text = text.replace("stylesheet.href = 'css/onda-v3-5.css?v=3.6';", "stylesheet.href = 'css/onda-v3-5.css?v=3.7';")
          text = text.replace('window.OndaV36?.refreshMarquees?.()', 'window.OndaV37?.refreshMarquees?.()')
          text = text.replace("script.src = 'js/onda-v3-5.js?v=3.6';", "script.src = 'js/onda-v3-5.js?v=3.7';")
          text = text.replace("safeToast('Onda v3.6 failed to load.')", "safeToast('Onda v3.7 failed to load.')")
          text = text.replace('ensureResponsiveStylesheetVersion();', 'ensureCoreStylesheetVersions();')
          text = text.replace('ensureV36Assets();', 'ensureV37Assets();')
          marker = """            document.head.appendChild(script);
        }
    }

    function applySavedLayoutMode() {
"""
          insertion = """            document.head.appendChild(script);
        }

        if (!document.getElementById(MEDIA_SESSION_SCRIPT_ID)) {
            const mediaScript = document.createElement('script');
            mediaScript.id = MEDIA_SESSION_SCRIPT_ID;
            mediaScript.src = 'js/media-session.js?v=3.7';
            mediaScript.async = false;
            mediaScript.addEventListener('error', () => console.warn('Onda background media controls failed to load.'));
            document.head.appendChild(mediaScript);
        }
    }

    function applySavedLayoutMode() {
"""
          if marker not in text:
              raise SystemExit('Expected asset-loader marker not found in layout-enhancements.js')
          text = text.replace(marker, insertion, 1)
          p.write_text(text, encoding='utf-8')

          # Runtime build marker / toast.
          p = Path('tools/Onda/js/onda-v3-5.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/* Onda v3.6 mobile layout, marquee, repeat, and shuffle corrections. */', '/* Onda v3.7 mobile layout, marquee, repeat, shuffle, and background-media corrections. */')
          text = text.replace("const VERSION = 'v3.6';", "const VERSION = 'v3.7';")
          text = text.replace('window.OndaV36', 'window.OndaV37')
          text = text.replace('Onda v3.5', 'Onda v3.7')
          text = text.replace('ondaV35', 'ondaV37')
          p.write_text(text, encoding='utf-8')

          # Cache-bust the entry page itself for the files that matter to this update.
          p = Path('tools/Onda/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('href="css/layout.css"', 'href="css/layout.css?v=3.7"')
          text = text.replace('href="css/responsive.css"', 'href="css/responsive.css?v=3.7"')
          text = text.replace('src="js/app-core.js"', 'src="js/app-core.js?v=3.7"')
          text = text.replace('src="js/layout-enhancements.js"', 'src="js/layout-enhancements.js?v=3.7"')
          p.write_text(text, encoding='utf-8')
          PY

          cat > tools/Onda/js/media-session.js <<'JS'
          /* Onda Android/background playback integration. Uses the existing Onda audio engine. */
          (function () {
              'use strict';

              const supported = 'mediaSession' in navigator && typeof window.MediaMetadata === 'function';
              if (!supported) {
                  window.OndaMediaSession = { supported: false };
                  return;
              }

              const boundAudio = new WeakSet();
              let lastActiveAudio = null;
              let lastMetadataKey = '';

              function getActiveAudioElement() {
                  try { return activeAudio || null; } catch (error) { return null; }
              }

              function getCurrentTrackMeta() {
                  try {
                      if (!currentFile?.name || !virtualLibrary) return null;
                      return virtualLibrary[currentFile.name] || null;
                  } catch (error) {
                      return null;
                  }
              }

              function currentPlaylistName() {
                  try {
                      return typeof getCurrentPlaybackPlaylistName === 'function'
                          ? getCurrentPlaybackPlaylistName()
                          : '';
                  } catch (error) {
                      return '';
                  }
              }

              function resolveArtwork(meta) {
                  let source = '';
                  try {
                      if (typeof getTrackArtwork === 'function') source = getTrackArtwork(meta) || '';
                  } catch (error) {}
                  if (!source && meta) source = meta.imageUrl || meta.artwork || meta.coverUrl || '';
                  if (!source || typeof source !== 'string') return [];
                  try { source = new URL(source, document.baseURI).href; } catch (error) {}
                  return [{ src: source }];
              }

              function metadataKey(meta) {
                  if (!meta) return '';
                  return [
                      meta.id || '',
                      meta.nickname || '',
                      meta.title || '',
                      meta.fileName || '',
                      meta.artist || '',
                      meta.imageUrl || '',
                      currentPlaylistName()
                  ].join('\u001f');
              }

              function syncMetadata(force = false) {
                  const meta = getCurrentTrackMeta();
                  if (!meta) return;
                  const key = metadataKey(meta);
                  if (!force && key === lastMetadataKey) return;
                  lastMetadataKey = key;

                  let title = meta.nickname || meta.title || meta.fileName || 'Onda';
                  try {
                      if (typeof getDisplayTitle === 'function') title = getDisplayTitle(meta) || title;
                  } catch (error) {}

                  navigator.mediaSession.metadata = new MediaMetadata({
                      title,
                      artist: meta.artist || meta.albumArtist || '',
                      album: currentPlaylistName() || meta.album || 'Onda',
                      artwork: resolveArtwork(meta)
                  });
              }

              function syncPlaybackState() {
                  const audio = getActiveAudioElement();
                  try {
                      navigator.mediaSession.playbackState = audio && !audio.paused ? 'playing' : 'paused';
                  } catch (error) {}
              }

              function syncPosition() {
                  const audio = getActiveAudioElement();
                  if (!audio || typeof navigator.mediaSession.setPositionState !== 'function') return;
                  const duration = Number(audio.duration);
                  const position = Number(audio.currentTime);
                  const playbackRate = Number(audio.playbackRate) || 1;
                  if (!Number.isFinite(duration) || duration <= 0 || !Number.isFinite(position)) return;
                  try {
                      navigator.mediaSession.setPositionState({
                          duration,
                          playbackRate: playbackRate > 0 ? playbackRate : 1,
                          position: Math.min(duration, Math.max(0, position))
                      });
                  } catch (error) {}
              }

              function bindAudioElement(audio) {
                  if (!audio || typeof audio.addEventListener !== 'function' || boundAudio.has(audio)) return;
                  boundAudio.add(audio);
                  audio.setAttribute?.('playsinline', '');
                  ['play', 'pause', 'loadedmetadata', 'durationchange', 'ratechange', 'seeked'].forEach((eventName) => {
                      audio.addEventListener(eventName, () => {
                          if (audio !== getActiveAudioElement()) return;
                          syncMetadata();
                          syncPlaybackState();
                          syncPosition();
                      });
                  });
                  audio.addEventListener('timeupdate', () => {
                      if (audio === getActiveAudioElement()) syncPosition();
                  });
              }

              function bindCurrentAudio() {
                  try { bindAudioElement(localAudio); } catch (error) {}
                  try { bindAudioElement(streamAudio); } catch (error) {}
                  try { bindAudioElement(window.OndaMidi?.audio); } catch (error) {}

                  const audio = getActiveAudioElement();
                  bindAudioElement(audio);
                  if (audio !== lastActiveAudio) {
                      lastActiveAudio = audio;
                      lastMetadataKey = '';
                      syncMetadata(true);
                  } else {
                      syncMetadata();
                  }
                  syncPlaybackState();
                  syncPosition();
              }

              function playFromSystem() {
                  try {
                      const result = typeof playAudio === 'function' ? playAudio() : getActiveAudioElement()?.play();
                      if (result?.catch) result.catch(() => {});
                  } catch (error) {}
              }

              function pauseFromSystem() {
                  try {
                      if (typeof pauseAudio === 'function') pauseAudio();
                      else getActiveAudioElement()?.pause();
                  } catch (error) {}
              }

              function previousFromSystem() {
                  try {
                      if (typeof skipToPreviousTrack === 'function') skipToPreviousTrack();
                  } catch (error) {}
              }

              function nextFromSystem() {
                  const button = document.getElementById('btn-next');
                  if (button) {
                      button.click();
                      return;
                  }
                  try {
                      if (typeof skipToNextTrack === 'function') skipToNextTrack();
                  } catch (error) {}
              }

              function seekBy(delta) {
                  const audio = getActiveAudioElement();
                  if (!audio || !Number.isFinite(audio.currentTime)) return;
                  const duration = Number(audio.duration);
                  const next = audio.currentTime + delta;
                  audio.currentTime = Number.isFinite(duration)
                      ? Math.min(duration, Math.max(0, next))
                      : Math.max(0, next);
                  syncPosition();
              }

              const handlers = {
                  play: playFromSystem,
                  pause: pauseFromSystem,
                  previoustrack: previousFromSystem,
                  nexttrack: nextFromSystem,
                  stop: () => {
                      pauseFromSystem();
                      const audio = getActiveAudioElement();
                      if (audio) {
                          try { audio.currentTime = 0; } catch (error) {}
                      }
                      syncPosition();
                  },
                  seekbackward: (details) => seekBy(-(Number(details?.seekOffset) || 10)),
                  seekforward: (details) => seekBy(Number(details?.seekOffset) || 10),
                  seekto: (details) => {
                      const audio = getActiveAudioElement();
                      const seekTime = Number(details?.seekTime);
                      if (!audio || !Number.isFinite(seekTime)) return;
                      try {
                          if (details?.fastSeek && typeof audio.fastSeek === 'function') audio.fastSeek(seekTime);
                          else audio.currentTime = seekTime;
                      } catch (error) {}
                      syncPosition();
                  }
              };

              Object.entries(handlers).forEach(([action, handler]) => {
                  try { navigator.mediaSession.setActionHandler(action, handler); } catch (error) {}
              });

              const nowPlaying = document.getElementById('now-playing');
              if (nowPlaying && typeof MutationObserver === 'function') {
                  new MutationObserver(() => syncMetadata(true)).observe(nowPlaying, {
                      childList: true,
                      characterData: true,
                      subtree: true
                  });
              }

              document.addEventListener('visibilitychange', () => {
                  // Deliberately do not pause when hidden. On return, refresh WebAudio if Chrome suspended it.
                  if (!document.hidden) {
                      try {
                          const audio = getActiveAudioElement();
                          if (audio && !audio.paused && audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
                      } catch (error) {}
                  }
                  bindCurrentAudio();
              });

              window.setInterval(bindCurrentAudio, 1000);
              bindCurrentAudio();

              window.OndaMediaSession = {
                  supported: true,
                  refresh: () => bindCurrentAudio()
              };
          })();
          JS

          # Force this exact entry page to request the versioned runtime immediately.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/Onda/index.html')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('href="css/layout.css"', 'href="css/layout.css?v=3.7"'),
              ('href="css/layout.css?v=3.6"', 'href="css/layout.css?v=3.7"'),
              ('href="css/responsive.css"', 'href="css/responsive.css?v=3.7"'),
              ('href="css/responsive.css?v=3.6"', 'href="css/responsive.css?v=3.7"'),
              ('src="js/app-core.js"', 'src="js/app-core.js?v=3.7"'),
              ('src="js/app-core.js?v=3.6"', 'src="js/app-core.js?v=3.7"'),
              ('src="js/layout-enhancements.js"', 'src="js/layout-enhancements.js?v=3.7"'),
              ('src="js/layout-enhancements.js?v=3.6"', 'src="js/layout-enhancements.js?v=3.7"'),
          ]:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

          node --check tools/Onda/js/layout-enhancements.js
          node --check tools/Onda/js/onda-v3-5.js
          node --check tools/Onda/js/media-session.js
          grep -q "position: relative;" tools/Onda/css/layout.css
          grep -q "const VERSION = 'v3.7'" tools/Onda/js/onda-v3-5.js
          grep -q "media-session.js?v=3.7" tools/Onda/js/layout-enhancements.js

          rm -f .github/workflows/onda-v3-7-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/Onda .github/workflows/onda-v3-7-update.yml
          git commit -m 'Apply Onda v3.7 mobile layout and background playback'
          git push origin main
