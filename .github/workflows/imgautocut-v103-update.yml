name: Apply ImgAutoCut v1.03 source update

on:
  push:
    paths:
      - '.github/imgautocut_v103_update.py'
      - '.github/.imgautocut-v103-trigger'
      - '.github/workflows/imgautocut-v103-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source edits
        run: python .github/imgautocut_v103_update.py
      - name: Validate JavaScript
        run: node --check tools/imgautocut/app.js
      - name: Verify expected version
        run: |
          grep -q 'V1.03' tools/imgautocut/index.html
          grep -q 'zoom-select-box' tools/imgautocut/index.html
          grep -q 'ledger-propagate' tools/imgautocut/index.html
      - name: Remove temporary updater files
        run: rm -f .github/imgautocut_v103_update.py .github/.imgautocut-v103-trigger .github/workflows/imgautocut-v103-update.yml
      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ImgAutoCut zoom multi-selection and ledger propagation'
          git push
