name: Onda Phase 2 source migration

on:
  push:
    branches:
      - onda-phase2-runtime-cleanup

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onda-phase2-runtime-cleanup
          fetch-depth: 0

      - name: Migrate correction behavior into canonical sources
        run: python3 .github/onda-phase2-migrate.py

      - name: Validate JavaScript syntax
        run: |
          node --check tools/Onda/js/app-core.js
          node --check tools/Onda/js/media-session.js

      - name: Commit canonical Phase 2 sources
        run: |
          git config user.name "cinaedvsstudios"
          git config user.email "cinaedvsstudios@gmail.com"
          git add -A
          git commit -m "Phase 2: move Onda runtime corrections into canonical sources"
          git push origin HEAD:onda-phase2-runtime-cleanup
