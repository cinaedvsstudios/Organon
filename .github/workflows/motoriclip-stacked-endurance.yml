name: MotoriClip stacked endurance QA
on:
  pull_request:
    paths:
      - 'tools/audio-timeline/tests/long-export-memory.browser.mjs'
      - 'tools/audio-timeline/tests/repeated-export-memory.browser.mjs'
      - '.github/workflows/motoriclip-stacked-endurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stacked-export-endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.scenario == '4k' && 255 || matrix.scenario == '1080p' && 195 || 65 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [1080p, 4k, repeat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose packaged FFmpeg and ffprobe on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - run: |
          node --check tools/audio-timeline/tests/long-export-memory.browser.mjs
          node --check tools/audio-timeline/tests/repeated-export-memory.browser.mjs
      - name: Run real stacked fixed-frame export and memory profiling
        if: matrix.scenario != 'repeat'
        env:
          MOTORICLIP_STACKED_ENDURANCE: ${{ matrix.scenario }}
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Cancel and retry four exports on the same editor engine
        if: matrix.scenario == 'repeat'
        env:
          MOTORICLIP_STACKED_REPEAT: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/repeated-export-memory.browser.mjs
