name: Trigger Onda v3.7 updater

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.title == 'Trigger Onda v3.7 source update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute reviewed updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/onda-v3-7-update.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('Updater run block not found')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              'rm -f .github/workflows/onda-v3-7-update.yml',
              'rm -f .github/workflows/onda-v3-7-update.yml .github/workflows/onda-v3-7-pr-trigger.yml'
          )
          script = script.replace(
              'git add tools/Onda .github/workflows/onda-v3-7-update.yml',
              'git add tools/Onda .github/workflows/onda-v3-7-update.yml .github/workflows/onda-v3-7-pr-trigger.yml'
          )
          Path('/tmp/onda-v3-7-updater.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/onda-v3-7-updater.sh
