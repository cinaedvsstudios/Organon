name: Apply Multi Edit source update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run Multi Edit batch save RGB preview updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source edits
        run: python3 .github/multi_edit_update.py
      - name: Validate JavaScript
        run: |
          node --check tools/multi-edit/multi-edit-output.js
          node --check tools/multi-edit/multi-edit.js
          node --check tools/multi-edit/multi-edit-erase.js
      - name: Validate expected changes
        run: |
          grep -q 'data-preview-bg="checker"' tools/multi-edit/index.html
          grep -q 'id="red"' tools/multi-edit/index.html
          grep -q 'showDirectoryPicker' tools/multi-edit/multi-edit-output.js
          grep -q 'index-v3.html?v=0.04' tools.json
      - name: Commit source update and remove temporary updater
        run: |
          rm -f .github/workflows/multi-edit-20260808-update.yml .github/.multi-edit-20260808-trigger .github/multi_edit_update.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/multi-edit/index.html tools/multi-edit/multi-edit-output.js tools/multi-edit/index-v3.html tools.json .github/workflows/multi-edit-20260808-update.yml .github/.multi-edit-20260808-trigger .github/multi_edit_update.py
          git commit -m 'Update Multi Edit batch save RGB grading and transparency preview'
          git push origin main
