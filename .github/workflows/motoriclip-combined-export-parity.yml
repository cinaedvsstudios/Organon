name: MotoriClip combined export pixel parity
on:
  pull_request:
    paths:
      - 'tools/audio-timeline/tests/combined-export-parity.browser.mjs'
      - 'tools/audio-timeline/js/**'
      - '.github/workflows/motoriclip-combined-export-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-export-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose packaged FFmpeg and ffprobe on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - run: node --check tools/audio-timeline/tests/combined-export-parity.browser.mjs
      - run: node tools/audio-timeline/tests/combined-export-parity.browser.mjs
