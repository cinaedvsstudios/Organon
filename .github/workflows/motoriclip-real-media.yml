name: MotoriClip real-media export QA

on:
  push:
    branches:
      - main
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  pull_request:
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoriclip-real-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mist-fog-visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out independent Mist-Fog Bank visual evidence
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chrome browser and encoded-media parity tools
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose packaged FFmpeg and ffprobe on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Verify independent fog, native parameters and saved project
        run: node --test tools/audio-timeline/tests/mist-fog-bank-v1.test.mjs
      - name: Capture real Chrome Mist-Fog Bank PNG and alpha/source comparisons
        run: node tools/audio-timeline/tests/mist-fog-bank-v1.browser.mjs
      - name: Decode real Mist-Fog Bank H264 frames and compare with exact Chrome preview
        env:
          MOTORICLIP_EFFECT_PRESET: mist-fog-bank
        run: node tools/audio-timeline/tests/animated-overlay-export.browser.mjs

