  cross-browser-ui:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Firefox and packaged FFmpeg binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Test editor routing and capability handling in Firefox and WebKit
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/cross-browser.browser.mjs'
      - name: Expose packaged FFmpeg and prepare synthetic media fixtures
        timeout-minutes: 2
        run: |
          set -eu
          node -e "const fs=require('fs');for(const [name,path] of [['ffmpeg',require('ffmpeg-static')],['ffprobe',require('@ffprobe-installer/ffprobe').path]]){const target='/usr/local/bin/'+name;fs.rmSync(target,{force:true});fs.copyFileSync(path,target);fs.chmodSync(target,0o755);}"
          mkdir -p tools/audio-timeline/tests/fixtures
          chown pwuser:pwuser tools/audio-timeline/tests/fixtures
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          su pwuser -s /bin/sh -c 'ffmpeg -version >/dev/null && ffprobe -version >/dev/null'
      - name: Decode, render and inspect an actual Firefox WebM export
        timeout-minutes: 7
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=firefox node tools/audio-timeline/tests/real-export.browser.mjs'
      - name: Diagnose isolated WebKit fixed-frame encoding without treating crashes as passes
        timeout-minutes: 2
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/webkit-export-diagnostic.browser.mjs'
      - name: Validate full WebKit fixed-frame WebM audio and multitrack output
        timeout-minutes: 5
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=webkit node tools/audio-timeline/tests/real-export.browser.mjs'
