name: MotoriClip real-media export QA

on:
  push:
    branches:
      - main
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  pull_request:
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoriclip-real-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transition-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and pinned media fixtures binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose packaged FFmpeg and ffprobe on the runner PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Verify visual alpha envelopes and undo history
        run: node --test tools/audio-timeline/tests/visual-transitions.test.mjs
      - name: Verify keyframe interpolation, real colour adjustment and speed source clocks
        run: node --test tools/audio-timeline/tests/visual-clip-adjustments.test.mjs
      - name: Verify edge-constrained movement and multi-track snapping
        run: node --test tools/audio-timeline/tests/lane-collision.test.mjs tools/audio-timeline/tests/clip-snap.test.mjs
      - name: Verify shared Orgavox clip-level Web Audio and true Lo-Fi bitcrusher DSP
        run: node --test tools/audio-timeline/tests/orgavox-audio-chain.test.mjs tools/audio-timeline/tests/orgavox-lofi-dsp.test.mjs
      - name: Verify non-destructive clip-only trimmed export planning
        run: node --test tools/audio-timeline/tests/clip-segment-export.test.mjs
      - name: Verify WAV-only PCM encoder headers, sample values and clipping
        run: node --test tools/audio-timeline/tests/wav-audio-export.test.mjs
      - name: Verify secure persistent media handles and permission-safe relinking
        run: node --test tools/audio-timeline/tests/media-handle-store.test.mjs
      - name: Verify bounded project recovery metadata, keyframes and editor settings
        run: node --test tools/audio-timeline/tests/project-recovery.test.mjs
      - name: Verify editable title designs and time-deterministic animations
        run: node --test tools/audio-timeline/tests/text-template-renderer.test.mjs
      - name: Validate all forty-one selected visual effects and paired edit invariants in Node
        run: node --test tools/audio-timeline/tests/paired-visual-effects.test.mjs tools/audio-timeline/tests/phase8d-visual-effects.test.mjs tools/audio-timeline/tests/phase8e-visual-effects.test.mjs tools/audio-timeline/tests/phase8f-visual-effects.test.mjs tools/audio-timeline/tests/phase8g-visual-effects.test.mjs tools/audio-timeline/tests/phase8h-visual-effects.test.mjs tools/audio-timeline/tests/phase8i-visual-effects.test.mjs tools/audio-timeline/tests/phase8j-visual-effects.test.mjs tools/audio-timeline/tests/phase8k-visual-effects.test.mjs tools/audio-timeline/tests/phase8l-visual-effects.test.mjs tools/audio-timeline/tests/phase8m-visual-effects.test.mjs tools/audio-timeline/tests/phase8n-visual-effects.test.mjs tools/audio-timeline/tests/phase8o-visual-effects.test.mjs
      - name: Verify Chrome compositor pixels and A/B inspector schematic
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/visual-transitions.browser.mjs
      - name: Validate SpiralBlockWipe original GLSL against independent WebGL pixel oracle
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/spiralblockwipe.browser.mjs
      - name: Verify original Hologram GLSL pixels, parameters and deterministic visuals in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/hologram.browser.mjs
      - name: Validate original CellDissolve Voronoi shader against independent pixel oracle
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/celldissolve.browser.mjs
      - name: Verify original Vortex GLSL against separately compiled reference shader
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vortex.browser.mjs
      - name: Validate original Crumple paper-folding GLSL against independent reference framebuffer
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/crumple.browser.mjs
      - name: Validate LiquidFill GLSL meniscus, slosh, bubbles and refraction against independent reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/liquidfill.browser.mjs
      - name: Validate HeatHaze four-octave refractive shader against independent GPU reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/heathaze.browser.mjs
      - name: Validate original rolling textured Sphere GLSL against independent GPU reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/sphere.browser.mjs
      - name: Validate original RingsWipe alternating annular GLSL against independently compiled reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/ringswipe.browser.mjs
      - name: Validate original Snapshot camera flash and falling photo GLSL against reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/snapshot.browser.mjs
      - name: Validate original ColorPanelWipe GLSL panels and RGBA controls against independent GPU oracle
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/colorpanelwipe.browser.mjs
      - name: Validate original Gallery perspective GLSL against independent ray-projection GPU reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/gallery.browser.mjs
      - name: Validate original VhsTracking rolling snow/tearing GLSL against independent GPU oracle
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vhstracking.browser.mjs
      - name: Validate original CardSwipe pivot and falling-card GLSL against independent GPU reference
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/cardswipe.browser.mjs
      - name: Validate original CameraShake 10-tap jolts/blur GLSL against independent GPU oracle
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/camerashake.browser.mjs
      - name: Validate original SmokeDissolve evolving billows GLSL against independent GPU oracle
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/smokedissolve.browser.mjs
      - name: Validate original SplatterWipe spiky impact GLSL against independent signed-distance GPU oracle
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/splatterwipe.browser.mjs
      - name: Validate original BloomDissolve highlight glow GLSL with independent GPU pixel oracle
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/bloomdissolve.browser.mjs
      - name: Validate original BokehDissolve focus/aperture GLSL with independently compiled GPU oracle
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/bokehdissolve.browser.mjs
      - name: Validate original LightRays highlight shafts against independent GLSL GPU pixel reference
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/lightrays.browser.mjs
      - name: Verify real Chrome pixels for all forty-one selected A/B transition effects
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/paired-visual-effects.browser.mjs
      - name: Verify real two-video pairing with all forty-one available effects
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/paired-transitions.browser.mjs
      - name: Verify compact editor dialogs, tracks, transitions and header in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/editor-ui.browser.mjs
      - name: Verify project recovery with media file handles and offline manual relinking
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/project-recovery.browser.mjs
      - name: Verify portable project Save/Open, generated overlays and missing media
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/project-portable.browser.mjs

  export-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation and pinned media binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Put packaged FFmpeg and ffprobe on the runner PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){const binary=dep==='ffmpeg-static'?require(dep):require(dep).path;fs.symlinkSync(binary,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Check Chromium and FFmpeg
        run: |
          set -euo pipefail
          google-chrome --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run existing MotoriClip regression suites
        run: node --test tools/audio-timeline/tests/*.test.mjs
      - name: Generate real MP4 inputs, export in Chromium, and verify media
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/real-export.browser.mjs
      - name: Compare real encoded MP4 animated effect frames with live preview pixels and reverse seek
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/animated-overlay-export.browser.mjs
      - name: Verify original SpiralBlockWipe GLSL MP4 export pixels against preview
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/spiralblockwipe-export.browser.mjs
      - name: Verify original Hologram GLSL decoded MP4 frames against preview
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/hologram-export.browser.mjs
      - name: Verify original CellDissolve H264 export pixels against live preview
        timeout-minutes: 8
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/celldissolve-export.browser.mjs
      - name: Validate decoded real MP4 Vortex export against live GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vortex-export.browser.mjs
      - name: Verify decoded H264 Crumple export matches GPU preview frames
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/crumple-export.browser.mjs
      - name: Verify decoded LiquidFill H264 MP4 export against live GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/liquidfill-export.browser.mjs
      - name: Verify decoded real HeatHaze H264 MP4 export against original GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/heathaze-export.browser.mjs
      - name: Verify decoded real H264 Sphere export matches 3D GPU preview frames
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/sphere-export.browser.mjs
      - name: Verify decoded H264 RingsWipe MP4 frames match original GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/ringswipe-export.browser.mjs
      - name: Verify decoded original Snapshot H264 MP4 export against GPU preview frames
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/snapshot-export.browser.mjs
      - name: Verify original ColorPanelWipe H264 export pixels against actual GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/colorpanelwipe-export.browser.mjs
      - name: Verify actual decoded H264 Gallery export against original 3D GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/gallery-export.browser.mjs
      - name: Verify decoded original VhsTracking H264 export matches live GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vhstracking-export.browser.mjs
      - name: Verify decoded real CardSwipe H264 MP4 export pixels against GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/cardswipe-export.browser.mjs
      - name: Verify decoded real CameraShake H264 MP4 export frames match GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/camerashake-export.browser.mjs
      - name: Verify decoded real SmokeDissolve H264 export against original GPU preview
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/smokedissolve-export.browser.mjs
      - name: Verify real decoded SplatterWipe H264 export parity with GPU preview
        timeout-minutes: 12
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/splatterwipe-export.browser.mjs
      - name: Verify decoded real BloomDissolve H264 MP4 export against GPU preview pixels
        timeout-minutes: 12
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/bloomdissolve-export.browser.mjs
      - name: Verify decoded real BokehDissolve H264 export frames against GPU preview
        timeout-minutes: 12
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/bokehdissolve-export.browser.mjs
      - name: Verify decoded real LightRays H264 export frames against GPU preview
        timeout-minutes: 12
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/lightrays-export.browser.mjs
      - name: Stress-test 720p/1080p, multiple frame rates, clip counts and cancellation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/extended-export.browser.mjs
      - name: Exercise desktop and mobile editor UI in real Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/editor-ui.browser.mjs
      - name: Verify first visual fades in Chrome canvas and inspector schematic
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/visual-transitions.browser.mjs
      - name: Verify real variable-frame-rate input and overlapping transparent layers
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vfr-overlap.browser.mjs
      - name: Profile longer moving-footage 1080p and 25-clip 720p exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Verify near-limit 60s 1080p and 120s 720p real-media exports with memory profiling
        timeout-minutes: 18
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MOTORICLIP_LONGFORM: '1'
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Verify 120-second 1080p MP4 and context-close Chrome memory recovery
        timeout-minutes: 22
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MOTORICLIP_FULLHD120: '1'
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Measure repeated exports and post-GC Chrome memory recovery
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/repeated-export-memory.browser.mjs
      - name: Verify synthetic portrait MOV and rotated MP4 camera-like exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/portrait-phone-like.browser.mjs


  cross-browser-ui:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Firefox and packaged FFmpeg binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Test editor routing and capability handling in Firefox and WebKit
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/cross-browser.browser.mjs'
      - name: Expose packaged FFmpeg and prepare synthetic media fixtures
        timeout-minutes: 2
        run: |
          set -eu
          node -e "const fs=require('fs');for(const [name,path] of [['ffmpeg',require('ffmpeg-static')],['ffprobe',require('@ffprobe-installer/ffprobe').path]]){const target='/usr/local/bin/'+name;fs.rmSync(target,{force:true});fs.copyFileSync(path,target);fs.chmodSync(target,0o755);}"
          mkdir -p tools/audio-timeline/tests/fixtures
          chown pwuser:pwuser tools/audio-timeline/tests/fixtures
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          su pwuser -s /bin/sh -c 'ffmpeg -version >/dev/null && ffprobe -version >/dev/null'
      - name: Decode, render and inspect an actual Firefox WebM export
        timeout-minutes: 7
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=firefox node tools/audio-timeline/tests/real-export.browser.mjs'
      - name: Diagnose isolated WebKit fixed-frame encoding without treating crashes as passes
        timeout-minutes: 2
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/webkit-export-diagnostic.browser.mjs'
      - name: Validate full WebKit fixed-frame WebM audio and multitrack output
        timeout-minutes: 5
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=webkit node tools/audio-timeline/tests/real-export.browser.mjs'
