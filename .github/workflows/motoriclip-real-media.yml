name: MotoriClip real-media export QA

on:
  push:
    branches:
      - main
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  pull_request:
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoriclip-real-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transition-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and pinned media fixtures binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose packaged FFmpeg and ffprobe on the runner PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Verify visual alpha envelopes and undo history
        run: node --test tools/audio-timeline/tests/visual-transitions.test.mjs
      - name: Validate nine extra visual effects and paired edit invariants in Node
        run: node --test tools/audio-timeline/tests/paired-visual-effects.test.mjs tools/audio-timeline/tests/phase8d-visual-effects.test.mjs tools/audio-timeline/tests/phase8e-visual-effects.test.mjs
      - name: Verify Chrome compositor pixels and A/B inspector schematic
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/visual-transitions.browser.mjs
      - name: Verify real Chrome pixels for nine new A/B transition effects
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/paired-visual-effects.browser.mjs
      - name: Verify real two-video pairing with all ten available effects
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/paired-transitions.browser.mjs

  export-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation and pinned media binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Put packaged FFmpeg and ffprobe on the runner PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){const binary=dep==='ffmpeg-static'?require(dep):require(dep).path;fs.symlinkSync(binary,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Check Chromium and FFmpeg
        run: |
          set -euo pipefail
          google-chrome --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run existing MotoriClip regression suites
        run: node --test tools/audio-timeline/tests/*.test.mjs
      - name: Generate real MP4 inputs, export in Chromium, and verify media
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/real-export.browser.mjs
      - name: Stress-test 720p/1080p, multiple frame rates, clip counts and cancellation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/extended-export.browser.mjs
      - name: Exercise desktop and mobile editor UI in real Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/editor-ui.browser.mjs
      - name: Verify first visual fades in Chrome canvas and inspector schematic
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/visual-transitions.browser.mjs
      - name: Verify real variable-frame-rate input and overlapping transparent layers
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vfr-overlap.browser.mjs
      - name: Profile longer moving-footage 1080p and 25-clip 720p exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Verify near-limit 60s 1080p and 120s 720p real-media exports with memory profiling
        timeout-minutes: 18
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MOTORICLIP_LONGFORM: '1'
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Verify 120-second 1080p MP4 and context-close Chrome memory recovery
        timeout-minutes: 14
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MOTORICLIP_FULLHD120: '1'
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Measure repeated exports and post-GC Chrome memory recovery
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/repeated-export-memory.browser.mjs
      - name: Verify synthetic portrait MOV and rotated MP4 camera-like exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/portrait-phone-like.browser.mjs


  cross-browser-ui:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Firefox/WebKit with matching Playwright library
        run: npm install --no-save playwright-core@1.56.1
      - name: Test editor routing and capability handling in Firefox and WebKit
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/cross-browser.browser.mjs'
      - name: Install FFmpeg and prepare synthetic media fixtures
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            apt-get update -qq
            apt-get install -y ffmpeg
          fi
          mkdir -p tools/audio-timeline/tests/fixtures
          chown pwuser:pwuser tools/audio-timeline/tests/fixtures
          command -v ffmpeg
          command -v ffprobe
      - name: Decode, render and inspect an actual Firefox WebM export
        timeout-minutes: 7
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=firefox node tools/audio-timeline/tests/real-export.browser.mjs'
      - name: Diagnose isolated WebKit fixed-frame encoding without treating crashes as passes
        timeout-minutes: 2
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser node tools/audio-timeline/tests/webkit-export-diagnostic.browser.mjs'
      - name: Validate full WebKit fixed-frame WebM audio and multitrack output
        timeout-minutes: 5
        run: su pwuser -s /bin/sh -c 'HOME=/home/pwuser MOTORICLIP_BROWSER=webkit node tools/audio-timeline/tests/real-export.browser.mjs'
