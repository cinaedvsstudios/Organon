name: MotoriClip real-media export QA

on:
  push:
    branches:
      - main
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  pull_request:
    paths:
      - 'tools/audio-timeline/**'
      - '.github/workflows/motoriclip-real-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoriclip-real-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation dependency
        run: npm install --no-save playwright-core@1.56.1
      - name: Install FFmpeg and ffprobe
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Check Chromium and FFmpeg
        run: |
          set -euo pipefail
          google-chrome --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run existing MotoriClip regression suites
        run: node --test tools/audio-timeline/tests/*.test.mjs
      - name: Generate real MP4 inputs, export in Chromium, and verify media
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/real-export.browser.mjs
      - name: Stress-test 720p/1080p, multiple frame rates, clip counts and cancellation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/extended-export.browser.mjs
      - name: Exercise desktop and mobile editor UI in real Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/editor-ui.browser.mjs
      - name: Verify real variable-frame-rate input and overlapping transparent layers
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/vfr-overlap.browser.mjs
      - name: Profile longer moving-footage 1080p and 25-clip 720p exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/long-export-memory.browser.mjs
      - name: Measure repeated exports and post-GC Chrome memory recovery
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/repeated-export-memory.browser.mjs
      - name: Verify synthetic portrait MOV and rotated MP4 camera-like exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/portrait-phone-like.browser.mjs


  cross-browser-ui:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Firefox/WebKit with matching Playwright library
        run: npm install --no-save playwright-core@1.56.1
      - name: Test editor routing and capability handling in Firefox and WebKit
        run: node tools/audio-timeline/tests/cross-browser.browser.mjs
