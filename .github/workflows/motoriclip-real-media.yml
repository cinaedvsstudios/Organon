  export-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Organon source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation and pinned media binaries
        timeout-minutes: 6
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Put packaged FFmpeg and ffprobe on the runner PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){const binary=dep==='ffmpeg-static'?require(dep):require(dep).path;fs.symlinkSync(binary,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Check Chromium and FFmpeg
        run: |
          set -euo pipefail
          google-chrome --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run existing MotoriClip regression suites
        run: node --test tools/audio-timeline/tests/*.test.mjs
      - name: Generate real MP4 inputs, export in Chromium, and verify media
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/audio-timeline/tests/real-export.browser.mjs
      - name: Compare real encoded MP4 animated effect frames with live preview pixels and reverse seek
        timeout-minutes: 8
