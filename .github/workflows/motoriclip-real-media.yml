      - name: Verify visual alpha envelopes and undo history
        run: node --test tools/audio-timeline/tests/visual-transitions.test.mjs
      - name: Verify keyframe interpolation, real colour adjustment and speed source clocks
        run: node --test tools/audio-timeline/tests/visual-clip-adjustments.test.mjs
      - name: Verify edge-constrained movement and multi-track snapping
        run: node --test tools/audio-timeline/tests/lane-collision.test.mjs tools/audio-timeline/tests/clip-snap.test.mjs
      - name: Verify shared Orgavox clip-level Web Audio and true Lo-Fi bitcrusher DSP
        run: node --test tools/audio-timeline/tests/orgavox-audio-chain.test.mjs tools/audio-timeline/tests/orgavox-lofi-dsp.test.mjs
      - name: Verify non-destructive clip-only trimmed export planning
        run: node --test tools/audio-timeline/tests/clip-segment-export.test.mjs
      - name: Verify WAV-only PCM encoder headers, sample values and clipping
        run: node --test tools/audio-timeline/tests/wav-audio-export.test.mjs
      - name: Verify secure persistent media handles and permission-safe relinking
