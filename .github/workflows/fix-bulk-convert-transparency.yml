name: Fix Bulk Convert Transparency

on:
  push:
    paths:
      - '.github/workflows/fix-bulk-convert-transparency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch transparency handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/bulk-convert/index.html')
          text = path.read_text(encoding='utf-8')

          old_format = """        // Toggle Quality Slider based on format
          outputFormatSel.addEventListener('change', (e) => {
              if (e.target.value === 'image/png') {
                  qualityContainer.style.visibility = 'hidden';
              } else {
                  qualityContainer.style.visibility = 'visible';
              }
          });
"""
          new_format = """        function syncBackgroundControlsForFormat() {
              const jpegOutput = outputFormatSel.value === 'image/jpeg';
              filesData.forEach((fileItem) => {
                  const transparencyCapable = /\\.(png|gif|webp|svg)$/i.test(fileItem.originalName);
                  if (jpegOutput && transparencyCapable) {
                      fileItem.bgFillColor = fileItem.bgFillColor || '#FFFFFF';
                  } else if (!jpegOutput) {
                      fileItem.bgFillColor = null;
                  }
              });
              renderFileList();
          }

          // Toggle Quality Slider and JPEG background controls based on format
          outputFormatSel.addEventListener('change', (e) => {
              if (e.target.value === 'image/png') {
                  qualityContainer.style.visibility = 'hidden';
              } else {
                  qualityContainer.style.visibility = 'visible';
              }
              syncBackgroundControlsForFormat();
          });
"""

          old_queue = "bgFillColor: isTransparent ? '#FFFFFF' : null,"
          new_queue = "bgFillColor: isTransparent && outputFormatSel.value === 'image/jpeg' ? '#FFFFFF' : null,"

          old_canvas = """                        canvas.width = img.width;
                          canvas.height = img.height;
                          
                          if (fileData.bgFillColor) {
                              ctx.fillStyle = fileData.bgFillColor;
                              ctx.fillRect(0, 0, canvas.width, canvas.height);
                          } else if (format === 'image/jpeg') {
                              ctx.fillStyle = '#FFFFFF';
                              ctx.fillRect(0, 0, canvas.width, canvas.height);
                          }
                          
                          ctx.drawImage(img, 0, 0);
"""
          new_canvas = """                        canvas.width = img.width;
                          canvas.height = img.height;
                          ctx.clearRect(0, 0, canvas.width, canvas.height);
                          
                          if (format === 'image/jpeg') {
                              ctx.fillStyle = fileData.bgFillColor || '#FFFFFF';
                              ctx.fillRect(0, 0, canvas.width, canvas.height);
                          }
                          
                          ctx.drawImage(img, 0, 0);
"""

          replacements = [
              (old_format, new_format, 'format change handler'),
              (old_queue, new_queue, 'queue background default'),
              (old_canvas, new_canvas, 'canvas conversion block'),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Expected {label} was not found; refusing partial patch.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F "ctx.clearRect(0, 0, canvas.width, canvas.height);" tools/bulk-convert/index.html
          grep -F "if (format === 'image/jpeg')" tools/bulk-convert/index.html
          grep -F "isTransparent && outputFormatSel.value === 'image/jpeg'" tools/bulk-convert/index.html
          ! grep -F "bgFillColor: isTransparent ? '#FFFFFF' : null" tools/bulk-convert/index.html

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bulk-convert-transparency.yml
          git add tools/bulk-convert/index.html
          git commit -m "Preserve transparency in Bulk Convert WebP output"
          git push
