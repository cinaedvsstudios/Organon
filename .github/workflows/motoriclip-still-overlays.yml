name: MotoriClip independent still-overlay QA
on:
  pull_request:
    paths:
      - 'tools/audio-timeline/js/overlay-preset-library.mjs'
      - 'tools/audio-timeline/tests/still-overlay-quality.browser.mjs'
      - '.github/workflows/motoriclip-still-overlays.yml'
  push:
    branches: [main]
    paths:
      - 'tools/audio-timeline/js/overlay-preset-library.mjs'
      - 'tools/audio-timeline/tests/still-overlay-quality.browser.mjs'
      - '.github/workflows/motoriclip-still-overlays.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vignette-still-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chrome harness and media tools
        run: npm install --no-save playwright-core@1.56.1 ffmpeg-static@5.3.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Expose FFmpeg and ffprobe
        run: |
          mkdir -p "$RUNNER_TEMP/motoriclip-media-tools"
          node -e "const fs=require('fs');const dir=process.env.RUNNER_TEMP+'/motoriclip-media-tools';for(const [name,dep] of [['ffmpeg','ffmpeg-static'],['ffprobe','@ffprobe-installer/ffprobe']]){fs.symlinkSync(dep==='ffmpeg-static'?require(dep):require(dep).path,dir+'/'+name);}"
          echo "$RUNNER_TEMP/motoriclip-media-tools" >> "$GITHUB_PATH"
      - name: Qualify Vignette as a genuine still overlay with decoded H264 parity
        env:
          MOTORICLIP_STILL_PRESET: vignette
        run: node tools/audio-timeline/tests/still-overlay-quality.browser.mjs
