<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Riser</title>
<style>
html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; background: #000; }
iframe { display: block; }
</style>
</head>
<body>
<iframe id="tool-frame" src="index-v2.html" title="Bubble Riser"></iframe>
<script>
(() => {
  'use strict';

  const frame = document.getElementById('tool-frame');
  const SETTINGS_KEY = 'organon_bubble_riser_settings_v4';
  let hubMobileStateBeforeWide = null;

  function forwardToHub(data) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(data, '*');
    }
  }

  function setHubMobileState(enabled) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.document.body.classList.toggle('force-mobile-view', enabled);
        window.parent.localStorage.setItem('organon_force_mobile_view', enabled ? 'true' : 'false');
      }
    } catch (_) {}
  }

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || !event.data) return;

    if (event.data.type === 'set-workspace-mode') {
      if (event.data.mode === 'wide') {
        try {
          hubMobileStateBeforeWide = window.parent.document.body.classList.contains('force-mobile-view');
        } catch (_) {
          hubMobileStateBeforeWide = null;
        }
        setHubMobileState(false);
      } else if (event.data.mode === 'compact' && hubMobileStateBeforeWide !== null) {
        setHubMobileState(hubMobileStateBeforeWide);
      }
      return;
    }

    if (event.data.type === 'set-status' || event.data.type === 'clear-status') {
      forwardToHub(event.data);
    }
  });

  function injectWideLayout(doc) {
    const app = doc.querySelector('.app-wrapper');
    const top = doc.querySelector('.top-sticky-panel');
    const title = top?.querySelector('.title-pill');
    const topControls = top?.querySelector('.panel-content-hide');
    const main = doc.querySelector('.middle-scroll-panel');
    const canvasCard = main?.querySelector('.config-card');
    const canvas = doc.getElementById('bubble-canvas');
    const bottomDock = doc.querySelector('.bottom-sticky-panel');
    const workspaceButton = doc.getElementById('workspace-button');

    if (!app || !top || !title || !topControls || !main || !canvasCard || !canvas || !bottomDock || !workspaceButton) return;

    canvasCard.classList.add('bubble-canvas-card');

    const controlsCard = doc.createElement('section');
    controlsCard.className = 'bubble-controls-card';
    controlsCard.setAttribute('aria-label', 'Bubble Riser controls');

    const controlsAnchor = doc.createComment('bubble-controls-anchor');
    main.insertBefore(controlsAnchor, canvasCard.nextSibling);

    const controlCards = () => Array.from(main.querySelectorAll(':scope > .config-card')).filter((card) => card !== canvasCard);

    function moveForWide() {
      if (controlsCard.parentElement !== main) main.insertBefore(controlsCard, canvasCard);
      controlsCard.appendChild(topControls);
      controlCards().forEach((card) => controlsCard.appendChild(card));
      app.classList.add('bubble-wide-layout');
      bottomDock.classList.add('bubble-wide-dock');
      hideDockSoon();
    }

    function moveForCompact() {
      if (topControls.parentElement !== top) top.appendChild(topControls);
      Array.from(controlsCard.querySelectorAll('.config-card')).forEach((card) => {
        main.insertBefore(card, controlsAnchor);
      });
      controlsCard.remove();
      app.classList.remove('bubble-wide-layout');
      bottomDock.classList.remove('bubble-wide-dock');
      hideDockSoon();
    }

    function updateLayout() {
      window.setTimeout(() => {
        const active = app.classList.contains('workspace-wide');
        if (active) moveForWide();
        else moveForCompact();
      }, 0);
    }

    const injectedStyle = doc.createElement('style');
    injectedStyle.textContent = `
      .app-wrapper.workspace-wide {
        max-width: 1440px !important;
        height: 100dvh !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
      }

      .app-wrapper.workspace-wide .top-sticky-panel {
        position: relative !important;
        flex: 0 0 auto !important;
        padding: 8px 16px !important;
      }

      .app-wrapper.workspace-wide .middle-scroll-panel {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        display: grid !important;
        grid-template-columns: minmax(440px, .92fr) minmax(520px, 1.28fr) !important;
        align-items: stretch !important;
        gap: 18px !important;
        padding: 18px clamp(18px, 2.4vw, 36px) 70px !important;
        overflow: hidden !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card {
        grid-column: 1 !important;
        grid-row: 1 !important;
        display: block !important;
        min-height: 0 !important;
        height: 100% !important;
        overflow-y: auto !important;
        overscroll-behavior: contain !important;
        scrollbar-gutter: stable !important;
        padding: 16px !important;
        border: 1px solid var(--chiseled-bronze) !important;
        border-radius: 18px !important;
        background: var(--bg-card) !important;
        box-shadow: 0 6px 18px rgba(0,0,0,.28) !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card .config-card {
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card .config-card + .config-card {
        margin-top: 16px !important;
        padding-top: 16px !important;
        border-top: 1px dashed rgba(137,107,73,.72) !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card .panel-content-hide {
        display: block !important;
        width: 100% !important;
        margin: 0 0 16px !important;
        padding: 0 0 16px !important;
        border-bottom: 1px dashed rgba(137,107,73,.72) !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card .top-note,
      .app-wrapper.workspace-wide .bubble-controls-card .control-field label {
        color: var(--alabaster-paper) !important;
      }

      .app-wrapper.workspace-wide .bubble-controls-card .range-list {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        column-gap: 18px !important;
        row-gap: 12px !important;
      }

      .app-wrapper.workspace-wide .bubble-canvas-card {
        grid-column: 2 !important;
        grid-row: 1 !important;
        order: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        min-height: 0 !important;
        height: 100% !important;
      }

      .app-wrapper.workspace-wide .bubble-canvas-card .canvas-stage {
        flex: 1 1 auto !important;
        min-height: 0 !important;
      }

      .app-wrapper.workspace-wide .bubble-canvas-card #bubble-canvas {
        width: 100% !important;
        max-height: 100% !important;
      }

      .bottom-sticky-panel {
        justify-content: center !important;
        padding: 10px 14px 14px !important;
        transition: transform .28s ease !important;
      }

      .bottom-sticky-panel .local-status {
        display: none !important;
      }

      .bottom-sticky-panel .btn-pill {
        width: min(520px, 100%) !important;
        min-height: 42px !important;
      }

      .bottom-sticky-panel.bubble-wide-dock {
        max-width: 1440px !important;
      }

      .bottom-sticky-panel.bubble-dock-hidden {
        transform: translate(-50%, calc(100% - 8px)) !important;
      }

      .bottom-sticky-panel::before {
        content: '' !important;
        position: absolute !important;
        top: 0 !important;
        left: 50% !important;
        width: 78px !important;
        height: 8px !important;
        transform: translateX(-50%) !important;
        border-radius: 0 0 999px 999px !important;
        background: rgba(24,25,25,.78) !important;
        pointer-events: none !important;
      }

      @media (max-width: 859px) {
        .app-wrapper.workspace-wide .middle-scroll-panel {
          display: grid !important;
          grid-template-columns: 1fr !important;
          height: auto !important;
          overflow: visible !important;
        }

        .app-wrapper.workspace-wide .bubble-controls-card,
        .app-wrapper.workspace-wide .bubble-canvas-card {
          grid-column: 1 !important;
          grid-row: auto !important;
          height: auto !important;
          overflow: visible !important;
        }
      }
    `;
    doc.head.appendChild(injectedStyle);

    let dockTimer = null;
    function showDock() {
      clearTimeout(dockTimer);
      bottomDock.classList.remove('bubble-dock-hidden');
    }

    function hideDockSoon() {
      clearTimeout(dockTimer);
      dockTimer = window.setTimeout(() => bottomDock.classList.add('bubble-dock-hidden'), 2500);
    }

    bottomDock.addEventListener('mouseenter', showDock);
    bottomDock.addEventListener('mouseleave', hideDockSoon);
    doc.addEventListener('mousemove', (event) => {
      if (event.clientY > doc.defaultView.innerHeight - 32) showDock();
    });
    doc.addEventListener('touchstart', (event) => {
      if (event.touches[0] && event.touches[0].clientY > doc.defaultView.innerHeight - 55) showDock();
    }, { passive: true });

    function restoreSettings() {
      try {
        const saved = JSON.parse(doc.defaultView.localStorage.getItem(SETTINGS_KEY));
        if (!saved || typeof saved !== 'object') return;
        for (const id of Object.keys(saved)) {
          const input = doc.getElementById(id);
          if (input && saved[id] !== undefined) input.value = String(saved[id]);
        }
        ['res', 'format', 'fps'].forEach((id) => doc.getElementById(id)?.dispatchEvent(new Event('change', { bubbles: true })));
        ['duration','amount','min-size','max-size','speed','direction','volatility','opacity','rim','glow','highlight'].forEach((id) => {
          doc.getElementById(id)?.dispatchEvent(new Event('input', { bubbles: true }));
        });
      } catch (_) {}
    }

    function saveSettings() {
      const ids = ['res','format','duration','fps','amount','min-size','max-size','speed','direction','volatility','opacity','rim','glow','highlight'];
      const saved = {};
      ids.forEach((id) => {
        const input = doc.getElementById(id);
        if (input) saved[id] = input.value;
      });
      try { doc.defaultView.localStorage.setItem(SETTINGS_KEY, JSON.stringify(saved)); } catch (_) {}
    }

    ['res','format','duration','fps','amount','min-size','max-size','speed','direction','volatility','opacity','rim','glow','highlight'].forEach((id) => {
      const input = doc.getElementById(id);
      if (!input) return;
      input.addEventListener('input', saveSettings);
      input.addEventListener('change', saveSettings);
    });

    restoreSettings();

    workspaceButton.addEventListener('click', updateLayout);
    window.setTimeout(updateLayout, 0);
    hideDockSoon();
  }

  frame.addEventListener('load', () => {
    try {
      injectWideLayout(frame.contentDocument);
    } catch (error) {
      console.error('Bubble Riser layout wrapper could not initialise.', error);
    }
  });
})();
</script>
</body>
</html>
