<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Riser Build 2026.06.30.0118</title>
<style>
html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#000}
iframe{display:block}
</style>
</head>
<body>
<iframe id="bubble-riser-frame" src="index-v2.html?build=20260630-0118" title="Bubble Riser"></iframe>
<script>
(() => {
  'use strict';
  const BUILD = 'BUILD 2026.06.30.0118';
  const SETTINGS_KEY = 'organon_bubble_riser_build_20260630_0118';
  const frame = document.getElementById('bubble-riser-frame');

  function forwardToHub(data) {
    if (window.parent && window.parent !== window) window.parent.postMessage(data, '*');
  }

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || !event.data) return;
    if (event.data.type === 'set-status' || event.data.type === 'clear-status') forwardToHub(event.data);
  });

  function install(doc) {
    const app = doc.getElementById('app');
    const top = doc.getElementById('top');
    const main = doc.querySelector('.main');
    const controls = doc.querySelector('.controls-wrap');
    const canvasCard = doc.querySelector('.canvas-card');
    const topControls = doc.querySelector('.top-controls');
    const wideButton = doc.getElementById('wide');
    const titleLeft = doc.querySelector('.title-left');
    const dock = doc.getElementById('dock');
    if (!app || !top || !main || !controls || !canvasCard || !topControls || !wideButton || !titleLeft || !dock) return;

    const buildBadge = doc.createElement('span');
    buildBadge.className = 'bubble-build-badge';
    buildBadge.textContent = BUILD;
    titleLeft.appendChild(buildBadge);

    const style = doc.createElement('style');
    style.textContent = `
      .bubble-build-badge {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 3px 7px;
        border: 1px solid rgba(224,163,96,.7);
        border-radius: 999px;
        color: var(--ochre);
        background: rgba(224,163,96,.10);
        font: 700 .55rem var(--mono);
        letter-spacing: .04em;
        white-space: nowrap;
      }

      @media (min-width: 860px) {
        .app.wide {
          height: 100dvh !important;
          min-height: 0 !important;
          max-width: 1440px !important;
          display: flex !important;
          flex-direction: column !important;
          overflow: hidden !important;
        }
        .app.wide .top {
          position: relative !important;
          flex: 0 0 auto !important;
          padding: 8px 16px !important;
        }
        .app.wide .main {
          flex: 1 1 auto !important;
          min-height: 0 !important;
          display: grid !important;
          grid-template-columns: minmax(440px,.92fr) minmax(520px,1.28fr) !important;
          align-items: stretch !important;
          gap: 18px !important;
          padding: 18px clamp(18px,2.4vw,36px) 70px !important;
          overflow: hidden !important;
        }
        .app.wide .controls-wrap {
          display: block !important;
          grid-column: 1 !important;
          grid-row: 1 !important;
          min-height: 0 !important;
          height: 100% !important;
          overflow-y: auto !important;
          overscroll-behavior: contain !important;
          scrollbar-gutter: stable !important;
          padding: 16px !important;
          border: 1px solid var(--bronze) !important;
          border-radius: 18px !important;
          background: var(--card) !important;
          box-shadow: 0 6px 18px rgba(0,0,0,.28) !important;
        }
        .app.wide .controls-wrap .top-controls {
          display: block !important;
          margin: 0 0 16px !important;
          padding: 0 0 16px !important;
          border-bottom: 1px dashed rgba(137,107,73,.72) !important;
        }
        .app.wide .controls-wrap .top-controls .top-note,
        .app.wide .controls-wrap .top-controls .field label { color: var(--paper) !important; }
        .app.wide .controls-wrap .card {
          padding: 0 !important;
          border: 0 !important;
          border-radius: 0 !important;
          background: transparent !important;
          box-shadow: none !important;
        }
        .app.wide .controls-wrap .card + .card {
          margin-top: 16px !important;
          padding-top: 16px !important;
          border-top: 1px dashed rgba(137,107,73,.72) !important;
        }
        .app.wide .controls-wrap .ranges {
          grid-template-columns: repeat(2,minmax(0,1fr)) !important;
          column-gap: 18px !important;
          row-gap: 12px !important;
        }
        .app.wide .controls-wrap .help { grid-column: 1 / -1 !important; }
        .app.wide .canvas-card {
          grid-column: 2 !important;
          grid-row: 1 !important;
          order: 0 !important;
          display: flex !important;
          flex-direction: column !important;
          min-height: 0 !important;
          height: 100% !important;
        }
        .app.wide .canvas-card .stage { flex: 1 1 auto !important; min-height: 0 !important; }
        .app.wide .canvas-card canvas { width: 100% !important; max-height: 100% !important; }
      }

      .dock { justify-content: center !important; }
      .dock .local-status { display: none !important; }
      .dock .export { width: min(520px,100%) !important; }
      .dock::after {
        content: '${BUILD}' !important;
        position: absolute !important;
        right: 18px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        color: rgba(24,25,25,.72) !important;
        font: 700 .54rem var(--mono) !important;
        letter-spacing: .04em !important;
        pointer-events: none !important;
      }
      @media (max-width: 650px) { .bubble-build-badge, .dock::after { display: none !important; } }
    `;
    doc.head.appendChild(style);

    function moveControlsToWide() {
      if (topControls.parentElement !== controls) controls.prepend(topControls);
    }
    function moveControlsToCompact() {
      if (topControls.parentElement !== top) top.appendChild(topControls);
    }

    wideButton.addEventListener('click', () => {
      setTimeout(() => {
        if (app.classList.contains('wide')) moveControlsToWide();
        else moveControlsToCompact();
      }, 0);
    });

    const ids = ['res','format','duration','fps','amount','min','max','speed','direction','volatility','opacity','rim','glow','highlight'];
    function save() {
      const values = {};
      ids.forEach((id) => {
        const input = doc.getElementById(id);
        if (input) values[id] = input.value;
      });
      try { doc.defaultView.localStorage.setItem(SETTINGS_KEY, JSON.stringify(values)); } catch (_) {}
    }
    function restore() {
      try {
        const values = JSON.parse(doc.defaultView.localStorage.getItem(SETTINGS_KEY));
        if (!values || typeof values !== 'object') return;
        ids.forEach((id) => {
          const input = doc.getElementById(id);
          if (input && values[id] !== undefined) input.value = String(values[id]);
        });
        ['res','format','fps'].forEach((id) => doc.getElementById(id)?.dispatchEvent(new Event('change', { bubbles: true })));
        ['duration','amount','min','max','speed','direction','volatility','opacity','rim','glow','highlight'].forEach((id) => doc.getElementById(id)?.dispatchEvent(new Event('input', { bubbles: true })));
      } catch (_) {}
    }
    ids.forEach((id) => {
      const input = doc.getElementById(id);
      if (!input) return;
      input.addEventListener('input', save);
      input.addEventListener('change', save);
    });
    restore();
  }

  frame.addEventListener('load', () => {
    try { install(frame.contentDocument); }
    catch (error) { console.error('Bubble Riser build wrapper failed.', error); }
  });
})();
</script>
</body>
</html>
