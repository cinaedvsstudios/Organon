<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Riser</title>
<style>
html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#000}
iframe{display:block}
</style>
</head>
<body>
<iframe id="bubble-riser-frame" src="index-v5.html?build=20260630-0427" title="Bubble Riser"></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('bubble-riser-frame');
  let previousMobile = null;

  function outerWorkspace(full) {
    try {
      const host = window.top;
      if (!host || host === window) return;
      const body = host.document.body;
      const basin = host.document.querySelector('.basin-content-wrapper');
      const basinFrame = host.document.getElementById('basin-frame');

      if (full) {
        previousMobile = body.classList.contains('force-mobile-view');
        body.classList.remove('force-mobile-view');
        host.localStorage.setItem('organon_force_mobile_view', 'false');

        // These inline overrides are deliberate: they guarantee the tool gets a real
        // desktop viewport even if the hub's saved mobile rule has not reflowed yet.
        if (basin) {
          basin.style.width = '100%';
          basin.style.maxWidth = 'none';
          basin.style.alignSelf = 'stretch';
        }
        if (basinFrame) {
          basinFrame.style.width = '100%';
          basinFrame.style.maxWidth = 'none';
          basinFrame.style.margin = '0';
        }
      } else {
        if (basin) {
          basin.style.width = '';
          basin.style.maxWidth = '';
          basin.style.alignSelf = '';
        }
        if (basinFrame) {
          basinFrame.style.width = '';
          basinFrame.style.maxWidth = '';
          basinFrame.style.margin = '';
        }
        const restoreMobile = previousMobile === null ? true : previousMobile;
        body.classList.toggle('force-mobile-view', restoreMobile);
        host.localStorage.setItem('organon_force_mobile_view', restoreMobile ? 'true' : 'false');
        if (typeof host.applyForceMobileViewSetting === 'function') host.applyForceMobileViewSetting();
      }

      host.dispatchEvent(new Event('resize'));
      window.dispatchEvent(new Event('resize'));
      frame.contentWindow?.dispatchEvent(new Event('resize'));
    } catch (error) {
      console.error('Bubble Riser could not change the outer Organon workspace.', error);
    }
  }

  function forwardStatus(event) {
    if (window.top && window.top !== window && event.data) {
      window.top.postMessage(event.data, '*');
    }
  }

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || !event.data) return;
    if (event.data.type === 'set-status' || event.data.type === 'clear-status') forwardStatus(event);
  });

  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    const app = doc.getElementById('app');
    const fullButton = doc.getElementById('wide');
    if (!app || !fullButton) return;

    // Capture phase runs before Bubble Riser changes its own layout.
    fullButton.addEventListener('click', () => {
      outerWorkspace(!app.classList.contains('wide'));
    }, true);
  });
})();
</script>
</body>
</html>
