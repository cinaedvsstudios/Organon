<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e201c">
  <meta name="description" content="Capsularius is Organon's local-first desktop workspace for selected folders and project assets.">
  <title>Capsularius</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600,700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/capsularius.css">
  <link rel="stylesheet" href="./css/step2.css">
  <link rel="stylesheet" href="./css/window-pills.css">
  <link rel="stylesheet" href="./css/folder-drop.css">
  <link rel="stylesheet" href="./css/folder-tree.css">
  <link rel="stylesheet" href="./css/capsularius-ui.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-zone"><h1>Capsularius</h1><span class="app-badge">v0.35.1 — Settings &amp; Layout Fix</span></div>
    <div id="window-pills" class="window-pills" aria-label="Open folder windows"></div>
    <nav class="header-actions" aria-label="Capsularius controls">
      <button class="header-button primary" id="mount-folder-button" type="button">📂 Mount Folder</button>
      <button class="header-button" id="tile-windows-button" type="button">▦ Tile Windows</button>
      <button class="header-button" id="new-window-button" type="button">＋ New Window</button>
      <button class="header-button" id="settings-button" type="button">⚙️ Settings</button>
    </nav>
  </header>
  <main id="workspace-viewport" aria-label="Capsularius workspace">
    <div id="workspace-world" aria-label="Folder window canvas"></div>
    <div id="workspace-empty-state" class="workspace-empty-state" hidden><span class="empty-state-icon">📁</span><strong>No folder windows are open</strong><span>Mount a folder or drop one from Explorer into a window to begin.</span></div>
  </main>
  <div id="toast-layer" class="toast-layer" aria-live="polite" aria-atomic="false"></div>
  <div id="dialog-layer" class="dialog-layer" aria-live="assertive"></div>
  <menu id="context-menu" class="context-menu" hidden aria-label="File actions"></menu>
  <template id="mount-label-template"><div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true"><p class="eyebrow">Mounted root folder</p><h2>Name this mounted drive</h2><p class="modal-description">The browser supplied the root name “<strong data-mount-raw-name></strong>”. Choose the display name Capsularius should show in its folder tree.</p><label class="single-field"><span>Display name</span><input data-mount-label-input type="text" maxlength="72" autocomplete="off"></label><p class="form-error" data-mount-label-error hidden></p><div class="modal-actions"><button class="action-button primary" type="button" data-mount-label-confirm>Mount drive</button><button class="action-button" type="button" data-mount-label-cancel>Cancel</button></div></section></div></template>
  <template id="library-dialog-template"><div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true"><div class="modal-title-row"><div><p class="eyebrow">Library location</p><h2>Add folder to Library</h2></div><button class="icon-button" type="button" data-library-cancel>×</button></div><p class="modal-description" data-library-location></p><div class="form-grid"><label><span>Name</span><input data-library-name type="text" maxlength="72"></label><label><span>Emoji</span><input data-library-emoji type="text" maxlength="4"></label><label class="full-width"><span>Colour</span><select data-library-colour><option value="#e0a360">Sandstone</option><option value="#4b84bf">Water blue</option><option value="#449e92">Teal</option><option value="#9a2f4f">Ruby</option><option value="#d27d6c">Coral</option><option value="#896b49">Bronze</option></select></label></div><div class="modal-actions"><button class="action-button primary" type="button" data-library-confirm>Add to Library</button><button class="action-button" type="button" data-library-cancel>Cancel</button></div></section></div></template>
  <template id="rename-dialog-template"><div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true"><p class="eyebrow">Capsularius</p><h2 data-rename-title>Rename item</h2><p class="modal-description">Old name: <strong data-rename-old-name></strong></p><label class="single-field"><span>New name</span><input data-rename-input type="text" maxlength="220"></label><p class="form-error" data-rename-error hidden></p><div class="modal-actions"><button class="action-button primary" type="button" data-rename-confirm>Confirm Rename</button><button class="action-button" type="button" data-rename-cancel>Cancel</button></div></section></div></template>
  <template id="conflict-dialog-template"><div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true"><p class="eyebrow">Name conflict</p><h2>An item already exists</h2><p class="modal-description">“<strong data-conflict-name></strong>” already exists in the destination.</p><p class="modal-description" data-conflict-detail></p><div class="modal-actions"><button class="action-button primary" type="button" data-conflict-replace>Replace</button><button class="action-button" type="button" data-conflict-rename>Rename</button><button class="action-button" type="button" data-conflict-cancel>Cancel</button></div></section></div></template>
  <template id="operation-confirm-template"><section class="toast operation-toast" role="dialog"><div class="operation-copy"><span class="operation-badge" data-operation-badge></span><span class="toast-message" data-operation-message></span><span class="operation-detail" data-operation-detail></span></div><div class="toast-actions"><button class="action-button primary" type="button" data-operation-confirm>Confirm</button><button class="action-button" type="button" data-operation-cancel>Cancel</button></div></section></template>
  <template id="operation-progress-template"><section class="toast operation-toast" role="status"><div class="operation-copy"><span class="spinner"></span><span class="toast-message" data-progress-message></span></div><div class="toast-actions"><button class="action-button" type="button" data-progress-cancel>Cancel</button></div></section></template>
  <template id="toast-template"><section class="toast" role="status"><span class="toast-symbol" data-toast-symbol></span><span class="toast-message" data-toast-message></span></section></template>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
