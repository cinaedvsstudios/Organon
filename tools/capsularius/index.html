<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e201c">
  <meta name="description" content="Capsularius is Organon's local-first desktop workspace for selected folders and project assets.">
  <title>Organon Capsularius</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/capsularius.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-zone">
      <h1>Organon</h1>
      <span class="app-badge">Capsularius · v0.10 Step 1</span>
    </div>

    <nav class="header-actions" aria-label="Capsularius controls">
      <button class="header-button" id="open-library-button" type="button">▣ Library</button>
      <button class="header-button" id="open-recents-button" type="button">◷ Recents</button>
      <button class="header-button primary" id="mount-folder-button" type="button">＋ Mount Folder</button>
      <button class="header-button" id="new-window-button" type="button">＋ New Window</button>
    </nav>
  </header>

  <main id="workspace-viewport" aria-label="Capsularius workspace">
    <div id="workspace-world" aria-label="Folder window canvas"></div>
    <div id="workspace-empty-state" class="workspace-empty-state" hidden>
      <span class="empty-state-icon">▣</span>
      <strong>No folder windows are open</strong>
      <span>Mount a folder, open Library, or open Recents to begin.</span>
    </div>
  </main>

  <div id="toast-layer" class="toast-layer" aria-live="polite" aria-atomic="false"></div>
  <div id="dialog-layer" class="dialog-layer" aria-live="assertive"></div>

  <template id="library-dialog-template">
    <div class="modal-backdrop" data-modal-backdrop>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="library-dialog-title">
        <div class="modal-title-row">
          <div>
            <p class="eyebrow">Library location</p>
            <h2 id="library-dialog-title">Add folder to Library</h2>
          </div>
          <button class="icon-button" type="button" data-library-cancel aria-label="Close dialog">×</button>
        </div>
        <p class="modal-description" data-library-location></p>
        <div class="form-grid">
          <label>
            <span>Name</span>
            <input data-library-name type="text" maxlength="72" autocomplete="off">
          </label>
          <label>
            <span>Emoji</span>
            <input data-library-emoji type="text" maxlength="4" autocomplete="off">
          </label>
          <label class="full-width">
            <span>Colour</span>
            <select data-library-colour>
              <option value="#e0a360">Sandstone</option>
              <option value="#4b84bf">Water blue</option>
              <option value="#449e92">Teal</option>
              <option value="#9a2f4f">Ruby</option>
              <option value="#d27d6c">Coral</option>
              <option value="#896b49">Bronze</option>
            </select>
          </label>
        </div>
        <div class="modal-actions">
          <button class="action-button primary" type="button" data-library-confirm>Add to Library</button>
          <button class="action-button" type="button" data-library-cancel>Cancel</button>
        </div>
      </section>
    </div>
  </template>

  <template id="toast-template">
    <section class="toast" role="status">
      <span class="toast-symbol" data-toast-symbol></span>
      <span class="toast-message" data-toast-message></span>
    </section>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
