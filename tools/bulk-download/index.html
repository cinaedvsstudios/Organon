<style>

.9);color:#75b2de;font-family:var(--head);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:10px 18px;border-radius:999px;border:1px solid var(--bronze);box-shadow:0 2px 8px #000}.title-left{display:flex;align-items:center;min-width:0}.title-left span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.circle{width:22px;height:22px;border-radius:50%;border:1px solid var(--bronze);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;margin-right:12px;cursor:pointer;background:rgba(0,0,0,.6);color:var(--ochre)}.inputbox{width:340px;max-width:100%;display:flex;flex-direction:column;gap:8px}.main{padding:16px 16px 124px;background:#000;display:flex;flex-direction:column;gap:16px;font-size:.8rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.queue{background:var(--card);border:1px solid var(--bronze);border-radius:24px;padding:16px}.queue{grid-column:1/-1}.gtitle{color:#75b2de;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(132,104,78,.18);padding-bottom:6px}.row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.flex{display:flex;align-items:center;justify-content:space-between}.check{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border:1px solid rgba(137,107,73,.55);border-radius:999px;background:rgba(0,0,0,.25);cursor:pointer;user-select:none}.check input{width:16px;height:16px;min-width:16px;padding:0;accent-color:var(--red)}.check span{font-size:.72rem}.muted{opacity:.48}.btn{background:var(--teal);color:var(--paper);border:1px solid var(--bronze);border-radius:999px;padding:10px 16px;font-weight:700;font-size:.75rem;letter-spacing:.045em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.2s;white-space:nowrap}.btn:hover{background:var(--blue);box-shadow:0 0 12px rgba(121,180,227,.35);transform:translateY(-1px)}.btn:disabled{background:rgba(24,25,25,.3)!important;color:rgba(137,107,73,.5)!important;border-color:rgba(137,107,73,.22)!important;cursor:not-allowed!important;box-shadow:none!important;transform:none!important}.secondary{background:transparent;color:var(--ochre)}.queue-head{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid rgba(137,107,73,.3);padding-bottom:8px;margin-bottom:12px}.meta{color:var(--bronze);font-family:var(--mono);font-size:.8rem}.qlist{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}.qrow{display:flex;flex-direction:column;gap:4px;background:rgba(24,25,25,.5);border:1px solid rgba(137,107,73,.2);border-radius:16px;padding:8px 14px}.qindex{color:var(--ochre);font-family:var(--mono);font-weight:600}.qurl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;font-size:.75rem}.qfile{color:rgba(242,236,224,.72);font-size:.64rem;font-family:var(--mono);padding-left:24px;word-break:break-all}.badge{font-size:.7rem;text-transform:uppercase;font-weight:700;letter-spacing:.05em;padding:4px 12px;border-radius:999px;white-space:nowrap}.pending{background:rgba(137,107,73,.25);color:var(--ochre)}.fetching{background:rgba(75,132,191,.25);color:var(--spray)}.success{background:rgba(38,97,92,.25);color:var(--spray)}.failed{background:var(--burg);color:#ff9e9e;border:1px solid rgba(255,158,158,.3)}.fallback{background:none;border:0;color:var(--spray);text-decoration:underline;font-size:.65rem;cursor:pointer;padding:0;margin-left:4px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:110;width:100%;max-width:540px;background-color:#d79e5c;background-image:linear-gradient(rgba(224,163,96,.75),rgba(224,163,96,.75)),url('../../images/stonetext.jpg');background-size:cover;padding:16px 16px 20px;display:flex;gap:12px;border-top:1px solid var(--bronze);border-top-left-radius:28px;border-top-right-radius:28px}.bottom .btn{flex:1;min-width:0;background:rgba(24,25,25,.9)!important;color:#75b2de!important;font-size:.72rem;padding:10px 12px}.toastbox{position:fixed;right:16px;bottom:96px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}.toast{opacity:0;transform:translateY(8px);display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:18px;background:rgba(74,21,37,.96);color:#ffdddd;border:1px solid rgba(255,158,158,.35);box-shadow:0 6px 18px #000;font-size:.75rem;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.toast.ok{background:rgba(38,97,92,.96);color:var(--paper);border-color:rgba(121,180,227,.35)}.loader{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:.5s}.spin{width:50px;height:50px;border:3px solid rgba(229,168,98,.1);border-top-color:var(--ochre);border-radius:50%;animation:spin 1s linear infinite}.loader h1{font-family:var(--head);color:var(--ochre);letter-spacing:.15em;margin:0}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}@media(max-width:480px){.grid{grid-template-columns:1fr}.queue-head{flex-direction:column;align-items:stretch}.bottom{gap:8px;padding-inline:10px}.bottom .btn{font-size:.62rem;padding-inline:8px}}

<body>
<div id="loading" class="loader"><div class="spin"></div><h1>BULK DOWNLOAD SYSTEM</h1><p style="font-family:var(--mono);font-size:.8rem;color:var(--spray)">Initializing sandbox download layers...</p></div>
<div class="app">
  <div class="top">
    <div class="title"><div class="title-left"><div id="countdown-circle" class="circle">5</div><span>BULK DOWNLOADER</span></div><button id="clear-btn" class="btn" style="padding:4px 14px;font-size:.7rem;background:rgba(24,25,25,.6)!important">Clear Queue</button></div>
    <div class="inputbox"><textarea id="urlInput" placeholder="Paste image URLs here (one per line, space/comma separated)...&#10;https://example.com/asset_1.png&#10;https://example.com/asset_2.jpg"></textarea><div class="flex" style="gap:10px"><button id="paste-action-btn" class="btn" style="flex:1">Paste Clipboard</button><div id="error-count-badge" class="btn" style="flex:1;background:var(--burg)!important;color:#ff9e9e!important;cursor:default">Errors: 0</div></div></div>
  </div>
  <main class="main"><div class="grid">
    <div class="card"><div class="gtitle">1. Naming &amp; Speed</div><div id="generated-name-controls"><div class="row"><label for="prefix-input">Filename Prefix</label><input id="prefix-input" type="text" placeholder="image_"></div><div class="row"><label for="index-input">Starting Counter</label><input id="index-input" type="number" value="1" min="1"></div></div><label class="check" for="original-filenames-input"><input id="original-filenames-input" type="checkbox"><span>Use original filenames</span></label><div class="row" style="margin-top:10px"><div class="flex"><label for="concurrency-delay">Fetch Interval</label><span id="delay-val" style="font-family:var(--mono);color:var(--ochre)">0.2s</span></div><input id="concurrency-delay" type="range" min="0" max="30" value="2"></div></div>
    <div class="card"><div class="gtitle">2. CORS Proxy Bypass <span id="cors-info-trigger" style="cursor:pointer;color:#75b2de;font-size:.95rem" title="What is CORS?">ℹ️</span></div><div class="row"><label for="proxy-input">CORS Proxy URL (Optional)</label><input id="proxy-input" type="text" placeholder="https://cors-anywhere.herokuapp.com/"><span style="font-size:.65rem;opacity:.7;line-height:1.3">If images fail with CORS blocks, specify a proxy path.</span></div></div>
    <div class="queue"><div class="queue-head"><div><h3 style="font-size:.95rem;margin:0;color:#75b2de">Parsed Download Queue</h3><span id="queue-count" class="meta">0 items loaded</span></div><div class="flex" style="gap:8px"><button id="clear-success-btn" class="btn secondary" style="font-size:.65rem;padding:6px 12px" disabled>Clear Succeeded</button><button id="clear-failed-btn" class="btn secondary" style="font-size:.65rem;padding:6px 12px" disabled>Clear Failed</button></div></div><div id="queue-items-container" class="qlist"><div style="padding:20px 0;text-align:center;opacity:.6;font-size:.75rem">Ready to parse. Enter image URLs in the sticky banner above.</div></div></div>
  </div></main>
  <div class="bottom"><button id="start-btn" class="btn" disabled>Download ZIP Bundle</button><button id="drive-btn" class="btn" disabled>Download Files to Drive</button></div>
</div>
<div id="toast-stack" class="toastbox"></div>
<script>
window.addEventListener('DOMContentLoaded',()=>{const o=document.getElementById('loading');setTimeout(()=>{o.style.opacity='0';setTimeout(()=>o.remove(),500)},650)});
const urlInput=document.getElementById('urlInput'),clearBtn=document.getElementById('clear-btn'),startBtn=document.getElementById('start-btn'),driveBtn=document.getElementById('drive-btn'),queueContainer=document.getElementById('queue-items-container'),queueCount=document.getElementById('queue-count'),prefixInput=document.getElementById('prefix-input'),indexInput=document.getElementById('index-input'),generatedNameControls=document.getElementById('generated-name-controls'),originalFilenamesInput=document.getElementById('original-filenames-input'),delaySlider=document.getElementById('concurrency-delay'),delayVal=document.getElementById('delay-val'),proxyInput=document.getElementById('proxy-input'),pasteActionBtn=document.getElementById('paste-action-btn'),errorCountBadge=document.getElementById('error-count-badge'),corsInfoTrigger=document.getElementById('cors-info-trigger'),clearSuccessBtn=document.getElementById('clear-success-btn'),clearFailedBtn=document.getElementById('clear-failed-btn');
let urlQueueList=[],itemStatusCache={},failedDownloadsCount=0,isProcessing=false;
function setHubStatus(text){if(window.parent&&window.parent.postMessage)window.parent.postMessage({type:'set-status',text},'*')}function clearHubStatus(){if(window.parent&&window.parent.postMessage)window.parent.postMessage({type:'clear-status'},'*')}function hover(sel,text){const e=document.querySelector(sel);if(!e)return;e.addEventListener('mouseenter',()=>setHubStatus(text));e.addEventListener('mouseleave',clearHubStatus)}
hover('#urlInput','Enter raw text containing image links. Smart separators parse them automatically.');hover('#paste-action-btn','Read system clipboard text directly to populate the download queue.');hover('#error-count-badge','Displays a live tally of blocked or failed assets in the current run.');hover('#clear-btn','Reset and completely empty the active download queue list.');hover('#prefix-input','Specify a prefix string for generated filenames.');hover('#index-input','Configure the initial index sequence count for generated filenames.');hover('#original-filenames-input','Use the filename from each source URL instead of generating numbered filenames.');hover('#concurrency-delay','Configure a stagger interval between link requests.');hover('#proxy-input','Redirect links through a CORS proxy if direct fetching is blocked.');hover('#clear-success-btn','Remove successfully compiled image rows from the queue.');hover('#clear-failed-btn','Remove failed and CORS blocked image rows from the queue.');hover('#start-btn','Fetch all healthy resources, compress them into one ZIP package, and download it.');hover('#drive-btn','Choose a local folder and save each fetched file directly to disk using the browser file-system API.');hover('#countdown-circle','Double-click to lock or unlock the top panel.');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(msg,type='success'){const box=document.getElementById('toast-stack'),t=document.createElement('div');t.className=`toast ${type==='success'?'ok':''}`;t.innerHTML=`<span>${esc(msg)}</span>`;box.appendChild(t);setTimeout(()=>t.classList.add('show'),40);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4000)}
function syncSlider(){const min=+delaySlider.min||0,max=+delaySlider.max||100,val=+delaySlider.value||0,p=((val-min)/(max-min))*100;delaySlider.style.background=`linear-gradient(to right,#9a2f4f ${p}%,#61112e ${p}%)`;delayVal.textContent=`${(+delaySlider.value/10).toFixed(1)}s`}function updateNamingMode(){const use=originalFilenamesInput.checked;generatedNameControls.classList.toggle('muted',use);prefixInput.disabled=use;indexInput.disabled=use;renderPredictedFilenames()}
function parseUrls(force=false){const raw=urlInput.value,parts=raw.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean),out=[];parts.forEach(x=>{if(!x.includes('.'))return;let u=x;if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u);out.push(u)}catch(e){}});urlQueueList=out;if(force||(raw&&out.length&&!raw.includes('\n')))urlInput.value=out.join('\n');renderQueue()}
function extFromBlob(b){const t=(b&&b.type||'').toLowerCase().split(';')[0];return({'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','image/avif':'avif','image/bmp':'bmp','image/tiff':'tif'}[t]||'jpg')}function getExt(url,b=null){try{const p=decodeURIComponent(new URL(url).pathname||''),m=p.match(/\.([a-zA-Z0-9]{2,5})$/);if(m)return m[1].toLowerCase()}catch(e){}return extFromBlob(b)}function cleanName(n){return String(n||'').trim().replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\s+/g,' ').replace(/^\.+/,'').slice(0,160)||'image.jpg'}
function originalName(url,b,i){try{const raw=decodeURIComponent((new URL(url).pathname||'').split('/').filter(Boolean).pop()||'');if(raw&&raw.includes('.'))return cleanName(raw);if(raw)return cleanName(`${raw}.${extFromBlob(b)}`)}catch(e){}return cleanName(`image_${String(i+1).padStart(3,'0')}.${getExt(url,b)}`)}function generatedName(url,b,i){const prefix=prefixInput.value.trim()||'image_',start=parseInt(indexInput.value,10)||1;return cleanName(`${prefix}${String(start+i).padStart(3,'0')}.${getExt(url,b)}`)}function fileName(url,b,i,used){const base=originalFilenamesInput.checked?originalName(url,b,i):generatedName(url,b,i),dot=base.lastIndexOf('.'),stem=dot>0?base.slice(0,dot):base,ex=dot>0?base.slice(dot):'';let n=base,c=2;while(used.has(n.toLowerCase()))n=`${stem}_${c++}${ex}`;used.add(n.toLowerCase());return n}function predicted(url,i){return originalFilenamesInput.checked?originalName(url,null,i):generatedName(url,null,i)}
function renderPredictedFilenames(){urlQueueList.forEach((u,i)=>{const n=document.getElementById(`queue-file-${i}`);if(n&&(!itemStatusCache[i]||itemStatusCache[i].status==='pending'))n.textContent=`Filename: ${predicted(u,i)}`})}
function renderQueue(){queueContainer.innerHTML='';itemStatusCache={};failedDownloadsCount=0;errorCountBadge.textContent='Errors: 0';clearSuccessBtn.disabled=true;clearFailedBtn.disabled=true;if(!urlQueueList.length){queueContainer.innerHTML='<div style="padding:20px 0;text-align:center;opacity:.6;font-size:.75rem">Ready to parse. Enter image URLs in the sticky banner above.</div>';queueCount.textContent='0 items loaded';startBtn.disabled=true;driveBtn.disabled=true;return}queueCount.textContent=`${urlQueueList.length} items loaded`;startBtn.disabled=false;driveBtn.disabled=false;urlQueueList.forEach((u,i)=>{const r=document.createElement('div');r.className='qrow';r.id=`queue-row-${i}`;r.innerHTML=`<div class="flex" style="width:100%;gap:12px"><span class="qindex">#${i+1}</span><span class="qurl" title="${esc(u)}">${esc(u)}</span><span class="badge pending" id="status-${i}">Pending</span></div><div id="queue-file-${i}" class="qfile">Filename: ${esc(predicted(u,i))}</div><div id="error-reason-${i}" class="hidden" style="color:#ff9e9e;font-size:.65rem;margin-top:4px;font-family:var(--mono);padding-left:24px;word-break:break-all"></div>`;queueContainer.appendChild(r);itemStatusCache[i]={status:'pending',reason:''}})}
function buttons(dis){isProcessing=dis;startBtn.disabled=dis||!urlQueueList.length;driveBtn.disabled=dis||!urlQueueList.length;clearBtn.disabled=dis;pasteActionBtn.disabled=dis}function setStatus(i,cls,text){const b=document.getElementById(`status-${i}`);if(b){b.textContent=text;b.className=`badge ${cls}`}}function fail(i,url,e){const reason=e&&e.message&&e.message.includes('Failed to fetch')?'CORS Security Block / Access Denied':(e&&e.message?e.message:'CORS Block / Network Error');setStatus(i,'failed','✗ Blocked');itemStatusCache[i]={status:'failed',reason};failedDownloadsCount++;errorCountBadge.textContent=`Errors: ${failedDownloadsCount}`;clearFailedBtn.disabled=false;const d=document.getElementById(`error-reason-${i}`);if(d){d.classList.remove('hidden');d.innerHTML=`Reason: ${esc(reason)} | `;const btn=document.createElement('button');btn.className='fallback';btn.type='button';btn.textContent='Direct Open';btn.onclick=e=>{e.preventDefault();e.stopPropagation();const w=window.open(url,'_blank');if(w)w.focus()};d.appendChild(btn)}}
async function fetchItem(url){const proxy=proxyInput.value.trim(),res=await fetch(proxy?`${proxy}${url}`:url);if(!res.ok)throw new Error(`HTTP Error Code ${res.status}`);const b=await res.blob();if(!b||!b.size)throw new Error('Empty file response');return b}
async function processQueue(mode){if(isProcessing||!urlQueueList.length)return;if(mode==='drive'&&typeof window.showDirectoryPicker!=='function'){notify('This browser does not support folder saving. Use Chrome or Edge on HTTPS.','error');return}if(mode==='zip'&&typeof JSZip==='undefined'){notify('JSZip did not load, so ZIP packaging is unavailable.','error');return}buttons(true);failedDownloadsCount=0;errorCountBadge.textContent='Errors: 0';clearSuccessBtn.disabled=true;clearFailedBtn.disabled=true;const delay=(parseInt(delaySlider.value,10)||0)*100,used=new Set();let dir=null,zip=null,ok=0;try{if(mode==='drive'){driveBtn.textContent='Choose Folder...';dir=await window.showDirectoryPicker({mode:'readwrite'});setHubStatus('Bulk Downloader: folder selected, saving files directly to drive.')}else{zip=new JSZip();setHubStatus('Bulk Downloader: fetching files for ZIP package.')}for(let i=0;i<urlQueueList.length;i++){const url=urlQueueList[i];if(i&&delay)await new Promise(r=>setTimeout(r,delay));setStatus(i,'fetching','Fetching...');if(mode==='zip')startBtn.textContent=`ZIP ${i+1}/${urlQueueList.length}`;else driveBtn.textContent=`Drive ${i+1}/${urlQueueList.length}`;try{const blob=await fetchItem(url),name=fileName(url,blob,i,used),node=document.getElementById(`queue-file-${i}`);if(node)node.textContent=`Filename: ${name}`;if(mode==='drive'){const fh=await dir.getFileHandle(name,{create:true}),wr=await fh.createWritable();await wr.write(blob);await wr.close()}else zip.file(name,blob);setStatus(i,'success','✓ Success');itemStatusCache[i]={status:'success',reason:''};ok++;clearSuccessBtn.disabled=false}catch(e){fail(i,url,e)}}if(!ok){notify('All downloads were blocked by security headers. Try using a CORS proxy.','error');return}if(mode==='zip'){startBtn.textContent='Packaging ZIP...';const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='packaged_assets.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);notify(`Packaged & downloaded ${ok} images!`);setHubStatus(`Bulk Downloader: packaged ${ok} files into a ZIP.`)}else{notify(`Saved ${ok} files to the selected folder.`);setHubStatus(`Bulk Downloader: saved ${ok} files directly to drive.`)}}catch(e){if(e&&e.name==='AbortError')notify('Folder selection cancelled. Nothing was saved to drive.','error');else notify(e&&e.message?e.message:'Download run failed.','error')}finally{buttons(false);startBtn.textContent='Download ZIP Bundle';driveBtn.textContent='Download Files to Drive';setTimeout(clearHubStatus,1800)}}
urlInput.addEventListener('input',()=>parseUrls());clearBtn.addEventListener('click',()=>{urlInput.value='';parseUrls();notify('Download queue reset.')});pasteActionBtn.addEventListener('click',async()=>{try{const t=await navigator.clipboard.readText();if(t&&t.trim()){urlInput.value=t;parseUrls(true);notify('Pasted and formatted clipboard links.')}else notify('Clipboard is empty or inaccessible.','error')}catch(e){notify('Auto-paste blocked by browser. Please paste using Ctrl+V / Cmd+V directly.','error')}});corsInfoTrigger.addEventListener('click',()=>notify('CORS is a browser block. If a site blocks direct image fetching, route the URL through a proxy or open it directly.'));
clearSuccessBtn.addEventListener('click',()=>{urlQueueList=urlQueueList.filter((u,i)=>!itemStatusCache[i]||itemStatusCache[i].status!=='success');urlInput.value=urlQueueList.join('\n');parseUrls(false);notify('Removed successful downloads from queue.')});clearFailedBtn.addEventListener('click',()=>{urlQueueList=urlQueueList.filter((u,i)=>!itemStatusCache[i]||itemStatusCache[i].status!=='failed');urlInput.value=urlQueueList.join('\n');parseUrls(false);notify('Removed failed downloads from queue.')});originalFilenamesInput.addEventListener('change',updateNamingMode);prefixInput.addEventListener('input',renderPredictedFilenames);indexInput.addEventListener('input',renderPredictedFilenames);delaySlider.addEventListener('input',syncSlider);startBtn.addEventListener('click',()=>processQueue('zip'));driveBtn.addEventListener('click',()=>processQueue('drive'));
const topStickyPanel=document.querySelector('.top'),countdownCircle=document.getElementById('countdown-circle');let countdownVal=5,countdownInterval=null,isPanelLocked=false,isHoveringPanel=false;function updateCircle(){countdownCircle.textContent=isPanelLocked?'🔒':countdownVal}function resetCountdown(){clearInterval(countdownInterval);countdownVal=5;updateCircle()}function maximize(){topStickyPanel.classList.remove('minimized');resetCountdown()}function startCountdown(){if(isPanelLocked||isHoveringPanel)return;clearInterval(countdownInterval);countdownInterval=setInterval(()=>{countdownVal--;updateCircle();if(countdownVal<=0){clearInterval(countdownInterval);topStickyPanel.classList.add('minimized')}},1000)}topStickyPanel.addEventListener('mouseenter',()=>{isHoveringPanel=true;maximize();clearInterval(countdownInterval)});topStickyPanel.addEventListener('mouseleave',()=>{isHoveringPanel=false;resetCountdown();startCountdown()});topStickyPanel.addEventListener('click',()=>{if(topStickyPanel.classList.contains('minimized'))maximize()});countdownCircle.addEventListener('dblclick',e=>{e.stopPropagation();e.preventDefault();isPanelLocked=!isPanelLocked;updateCircle();if(isPanelLocked){clearInterval(countdownInterval);maximize()}else if(!isHoveringPanel)startCountdown()});
syncSlider();updateNamingMode();startCountdown();
</script>
</body>
