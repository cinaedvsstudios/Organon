<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Palm Cards Presenter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Main Container */
    .app-wrapper {
      width: 100%;
      height: 100%;
      max-width: 600px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      position: relative;
    }

    @media (min-width: 601px) {
      .app-wrapper {
        height: 92vh;
        border-radius: 16px;
        border: 1px solid #2a2a2a;
      }
    }

    header {
      background-color: #1e1e1e;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 {
      font-size: 1.2rem;
      color: #ff6b00;
    }
    .header-btns {
      display: flex;
      gap: 8px;
    }
    button {
      background-color: #ff6b00;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:active {
      opacity: 0.8;
    }
    button.secondary {
      background-color: #2a2a2a;
      color: #ccc;
    }
    button.danger {
      background-color: #d9534f;
      color: #fff;
    }
    .icon-btn {
      padding: 10px;
      font-size: 1.1rem;
    }

    .container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .speech-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .speech-title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .speech-meta {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }

    /* Modals */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      z-index: 30;
      padding: 25px;
      flex-direction: column;
      border-radius: inherit;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
    }
    input[type="text"], textarea {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    textarea {
      flex: 1;
      resize: none;
    }

    /* Settings */
    .setting-row {
      margin-bottom: 20px;
    }
    .setting-label {
      font-size: 0.95rem;
      color: #ddd;
      margin-bottom: 8px;
      display: block;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ff6b00;
    }
    .preview-box {
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      color: #ffffff;
      white-space: pre-wrap;
      line-height: 1.4;
      max-height: 140px;
      overflow-y: auto;
    }

    /* Presenter View */
    #presenter-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #000;
      z-index: 20;
      flex-direction: column;
      border-radius: inherit;
      overflow: hidden;
    }
    #presenter-screen.active {
      display: flex;
    }
    .presenter-header {
      padding: 12px 20px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    
    /* Top Counter with Arrows */
    .counter-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-arrow {
      background: none;
      color: #ff6b00;
      font-size: 1.5rem;
      padding: 5px 15px;
      border-radius: 8px;
    }
    .nav-arrow:active {
      background: #222;
    }
    .card-counter {
      color: #ff6b00;
      font-weight: bold;
      font-size: 1.1rem;
      min-width: 50px;
      text-align: center;
    }
    
    .card-viewport {
      flex: 1;
      padding: 25px 25px 10px 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .card-content {
      font-size: 1.8rem;
      line-height: 1.5;
      color: #ffffff;
      white-space: pre-wrap;
      width: 100%;
      text-align: left;
      margin: auto 0;
      padding-bottom: 30px;
    }
    
    .presenter-controls {
      /* Added a thick black border at the bottom to bump controls above Android Nav buttons */
      padding: 15px 20px;
      background: #111;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #222;
      border-bottom: 35px solid #000;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <header>
      <h1>Palm Cards</h1>
      <div class="header-btns">
        <button class="secondary icon-btn" onclick="toggleFullScreen()" title="Full Screen">⛶</button>
        <button class="secondary icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
        <button onclick="openModal()">+ Add</button>
      </div>
    </header>

    <div class="container" id="speech-list">
      <!-- Speech list rendered here -->
    </div>

    <!-- Add/Edit Speech Modal -->
    <div class="modal" id="speech-modal">
      <h2 id="modal-title" style="margin-bottom: 15px; color:#ff6b00;">New Speech</h2>
      <input type="text" id="speech-title-input" placeholder="Title (e.g. Zalando Interview)">
      <textarea id="speech-text-input" placeholder="Paste script here. Separate with 1) 2) or double line breaks..."></textarea>
      <div style="display: flex; gap: 10px;">
        <button class="secondary" style="flex: 1;" onclick="closeView()">Cancel</button>
        <button style="flex: 1;" onclick="saveSpeech()">Save</button>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
      <h2 style="margin-bottom: 20px; color:#ff6b00;">App Settings</h2>
      
      <div class="setting-row">
        <label class="setting-label">Card Text Size: <span id="fontsize-value">1.8rem</span></label>
        <input type="range" id="fontsize-slider" min="1.2" max="3.2" step="0.2" value="1.8" oninput="updateFontSize(this.value)">
      </div>

      <div class="setting-row">
        <label class="setting-label">Display Preview:</label>
        <div class="preview-box" id="fontsize-preview">Sample cue card text. This is how your presentation notes will appear during your speech.</div>
      </div>

      <div class="setting-row" style="margin-top: 10px;">
        <button class="danger" style="width: 100%; padding: 12px;" onclick="clearAllData()">Clear All Speeches</button>
      </div>

      <div style="margin-top: auto; padding-top: 15px; display: flex;">
        <button style="flex: 1;" onclick="closeView()">Done</button>
      </div>
    </div>

    <!-- Presenter Screen -->
    <div id="presenter-screen">
      <div class="presenter-header">
        <button class="secondary" onclick="closeView()">Exit</button>
        <div class="counter-wrapper">
          <button class="nav-arrow" onclick="prevCard()">&#8592;</button>
          <div class="card-counter" id="card-counter">1 / 1</div>
          <button class="nav-arrow" onclick="nextCard()">&#8594;</button>
        </div>
        <div style="display:flex; gap:5px;">
          <button class="secondary icon-btn" onclick="toggleFullScreen()">⛶</button>
        </div>
      </div>
      <div class="card-viewport" id="card-viewport">
        <div class="card-content" id="card-content"></div>
      </div>
      <div class="presenter-controls">
        <button class="secondary" onclick="prevCard()">&larr; Prev Card</button>
        <button onclick="nextCard()">Next Card &rarr;</button>
      </div>
    </div>
  </div>

  <script>
    let speeches = JSON.parse(localStorage.getItem('palm_speeches') || '[]');
    let cardFontSize = localStorage.getItem('palm_fontsize') || '1.8';
    let currentSpeech = null;
    let currentCardIndex = 0;
    let editingIndex = null;

    // --- Android Back Button Handling (Hash Routing) ---
    window.addEventListener('hashchange', () => {
      if (!location.hash) {
        // If hash is cleared (user pressed back), close all screens
        document.getElementById('speech-modal').classList.remove('active');
        document.getElementById('settings-modal').classList.remove('active');
        document.getElementById('presenter-screen').classList.remove('active');
        editingIndex = null;
      }
    });

    function navigateTo(hashName) {
      location.hash = hashName;
    }

    function closeView() {
      if (location.hash) {
        history.back(); // Triggers hashchange to close screens naturally
      }
    }
    // ---------------------------------------------------

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    function initSettings() {
      document.getElementById('fontsize-slider').value = cardFontSize;
      document.getElementById('fontsize-value').innerText = cardFontSize + 'rem';
      document.getElementById('card-content').style.fontSize = cardFontSize + 'rem';
      document.getElementById('fontsize-preview').style.fontSize = cardFontSize + 'rem';
    }

    function updateFontSize(val) {
      cardFontSize = val;
      document.getElementById('fontsize-value').innerText = val + 'rem';
      document.getElementById('card-content').style.fontSize = val + 'rem';
      document.getElementById('fontsize-preview').style.fontSize = val + 'rem';
      localStorage.setItem('palm_fontsize', val);
    }

    function clearAllData() {
      if (confirm('Are you sure you want to delete ALL saved speeches? This cannot be undone.')) {
        speeches = [];
        saveToStorage();
        renderList();
        closeView();
      }
    }

    function saveToStorage() {
      localStorage.setItem('palm_speeches', JSON.stringify(speeches));
    }

    function renderList() {
      const container = document.getElementById('speech-list');
      if (speeches.length === 0) {
        container.innerHTML = '<p style="color:#666; text-align:center; margin-top:40px;">No speeches saved yet. Click "+ Add" to begin.</p>';
        return;
      }
      container.innerHTML = speeches.map((speech, index) => `
        <div class="speech-card">
          <div>
            <div class="speech-title">${speech.title}</div>
            <div class="speech-meta">${speech.cards.length} cards</div>
          </div>
          <div class="actions">
            <button class="secondary" onclick="editSpeech(${index})">Edit</button>
            <button onclick="playSpeech(${index})">Play</button>
            <button class="danger" onclick="deleteSpeech(${index})">X</button>
          </div>
        </div>
      `).join('');
    }

    function openModal() {
      editingIndex = null;
      document.getElementById('modal-title').innerText = 'New Speech';
      document.getElementById('speech-title-input').value = '';
      document.getElementById('speech-text-input').value = '';
      document.getElementById('speech-modal').classList.add('active');
      navigateTo('add');
    }

    function editSpeech(index) {
      editingIndex = index;
      document.getElementById('modal-title').innerText = 'Edit Speech';
      document.getElementById('speech-title-input').value = speeches[index].title;
      document.getElementById('speech-text-input').value = speeches[index].cards.join('\n\n\n');
      document.getElementById('speech-modal').classList.add('active');
      navigateTo('edit');
    }

    function openSettings() {
      document.getElementById('settings-modal').classList.add('active');
      navigateTo('settings');
    }

    function parseTextToCards(rawText) {
      const numberRegex = /(?:\r?\n|^|\s)(?:\d+[\.\)]|Slide\s+\d+:?)\s*/g;
      let chunks = rawText.split(numberRegex).map(c => c.trim()).filter(c => c.length > 0);
      if (chunks.length <= 1) {
        chunks = rawText.split(/\n\s*\n/).map(c => c.trim()).filter(c => c.length > 0);
      }
      return chunks.length > 0 ? chunks : [rawText];
    }

    function saveSpeech() {
      const title = document.getElementById('speech-title-input').value.trim() || 'Untitled Speech';
      const rawText = document.getElementById('speech-text-input').value.trim();

      if (!rawText) return;

      const cards = parseTextToCards(rawText);

      if (editingIndex !== null) {
        speeches[editingIndex] = { title, cards };
      } else {
        speeches.push({ title, cards });
      }
      
      saveToStorage();
      renderList();
      closeView();
    }

    function deleteSpeech(index) {
      if (confirm('Delete this speech?')) {
        speeches.splice(index, 1);
        saveToStorage();
        renderList();
      }
    }

    function playSpeech(index) {
      currentSpeech = speeches[index];
      currentCardIndex = 0;
      updatePresenter();
      document.getElementById('presenter-screen').classList.add('active');
      navigateTo('play');
    }

    function updatePresenter() {
      if (!currentSpeech) return;
      document.getElementById('card-content').innerText = currentSpeech.cards[currentCardIndex];
      document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${currentSpeech.cards.length}`;
      document.getElementById('card-viewport').scrollTop = 0;
    }

    function nextCard() {
      if (currentSpeech && currentCardIndex < currentSpeech.cards.length - 1) {
        currentCardIndex++;
        updatePresenter();
      }
    }

    function prevCard() {
      if (currentSpeech && currentCardIndex > 0) {
        currentCardIndex--;
        updatePresenter();
      }
    }

    // Touch Swipe Logic
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
    const viewport = document.getElementById('card-viewport');

    viewport.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    viewport.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }

    // Init
    initSettings();
    renderList();
  </script>
</body>
</html>
