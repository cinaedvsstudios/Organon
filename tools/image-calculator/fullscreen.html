<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organon Image Calculator — Fullscreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./image-calculator-shell.css?v=0.01">
  <script defer src="./image-calculator-palette.js?v=0.01"></script>
  <script defer src="./image-calculator-shell.js?v=0.02"></script>
</head>
<body data-mode="wide">
  <div class="shell">
    <header class="shellbar">
      <div class="shell-title">Image Calculator <span>Preview · tools · settings</span></div>
      <div class="shell-actions">
        <button class="shell-button" id="browserFullscreen" type="button">⛶ Browser fullscreen</button>
        <button class="shell-button primary" id="returnCompact" type="button">Return to compact</button>
      </div>
    </header>
    <iframe class="app-frame" id="legacyApp" src="./index.html?embedded=wide-v3" title="Image Calculator fullscreen editor"></iframe>
  </div>

</html>
