<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organon - Animation Maker</title>
</head>
<body>
<script>
(() => {
  'use strict';
  const request = new XMLHttpRequest();
  request.open('GET', './legacy.html?build=20260720-frame-actions-1', false);
  request.send(null);
  if ((request.status < 200 || request.status >= 300) && request.status !== 0) {
    document.body.innerHTML = '<p style="color:white;background:#1e201c;padding:20px;font-family:sans-serif">Animation Maker could not be loaded.</p>';
    return;
  }

  let html = request.responseText;
  const patches = [
    [
      '<link rel="stylesheet" href="../animation-maker/enhancements.css">',
      '<link rel="stylesheet" href="../animation-maker/enhancements.css"><link rel="stylesheet" href="../animation-maker/frame-skip-actions.css?build=20260720-3"><link rel="stylesheet" href="../animation-maker/frame-export-controls.css?build=20260720-1">'
    ],
    [
      '<div class="sequence-bottom-actions"><button type="button" class="mini-action" id="reorder-clips-btn" hidden>REORDER CLIPS</button></div>',
      '<div class="sequence-bottom-actions"><button type="button" class="mini-action" id="reorder-clips-btn" hidden>REORDER CLIPS</button><button type="button" class="mini-action" id="restore-skipped-frames-btn" hidden disabled>RESTORE ALL FRAMES</button></div>'
    ],
    [
      '<label class="input-group"><span>Output Format</span><select id="opt-format"><option value="gif" selected>GIF (Animated)</option></select></label><p class="help-text">Animated WebP is recommended for smaller files. GIF remains available for compatibility.</p><hr>',
      '<label class="input-group"><span>Output Format</span><select id="opt-format"><option value="gif" selected>GIF (Animated)</option></select></label><p class="help-text">Animated WebP is recommended for smaller files. GIF remains available for compatibility.</p><div class="frame-export-settings"><label class="input-group"><span>Frame Format</span><select id="frame-format"><option value="same" selected>Same as output</option><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option><option value="gif">GIF</option></select></label><label class="input-group"><span>Frame Names</span><input type="text" id="frame-name" value="animation-export" placeholder="frame"></label></div><p class="help-text">Frames are numbered automatically as 01, 02, 03 and so on.</p><hr>'
    ],
    [
      '<div class="frame-skip-box" id="frame-skip-container" hidden><label class="slider-container"><span class="slider-label-row emphasised"><span>Frame Skip (Drop Frames)</span><span id="val-skip">Keep All</span></span><input type="range" id="adj-skip" min="1" max="10" step="1" value="1"></label><p class="help-text">Videos generate many frames. Increase this to drop intermediate frames and reduce final file size.</p></div>',
      '<div class="frame-skip-box" id="frame-skip-container" hidden><label class="slider-container"><span class="slider-label-row emphasised"><span>Frame Skip (Drop Frames)</span><span class="frame-skip-controls"><span id="val-skip">Keep All</span><button type="button" class="frame-skip-delete-btn" id="delete-skipped-frames-btn" disabled>DELETE FRAMES</button></span></span><input type="range" id="adj-skip" min="1" max="10" step="1" value="1"></label><p class="help-text">Videos generate many frames. Choose a keep interval, then delete the intermediate frames. Restore remains available beneath the sequence.</p></div><div class="frame-calculator-box" id="frame-calculator"><div class="frame-calculator-title">Frame Calculator</div><div class="frame-calculator-grid"><label><span>Total number of frames</span><input type="number" id="calc-total-frames" min="0" step="1" value="0"></label><label><span>Frame Skip</span><input type="number" id="calc-frame-skip" min="1" max="10" step="1" value="1"></label><label><span>Animation length</span><span class="frame-calculator-unit"><input type="number" id="calc-animation-length" min="0.01" step="0.01" value="0.00"><b>seconds</b></span></label><label><span>Frame Duration</span><span class="frame-calculator-unit"><input type="number" id="calc-frame-duration" min="40" max="1000" step="10" value="200"><b>MS</b></span></label><label class="frame-calculator-fps"><span>FPS</span><input type="text" id="calc-fps" value="5.00" readonly aria-readonly="true" tabindex="-1"></label></div><p class="help-text">Change any editable box to update the matching sliders. FPS is calculated automatically from Frame Duration.</p></div>'
    ],
    [
      '<footer class="bottom-sticky-panel"><button type="button" class="btn-pill-trigger" id="zip-btn" disabled>DOWNLOAD FRAMES ZIP</button><button type="button" class="btn-pill-trigger primary-trigger" id="compile-btn" disabled>MAKE &amp; SAVE ANIMATION</button></footer>',
      '<footer class="bottom-sticky-panel"><button type="button" class="btn-pill-trigger" id="zip-btn" disabled>DOWNLOAD FRAMES ZIP</button><button type="button" class="btn-pill-trigger" id="download-files-btn" disabled>DOWNLOAD FILES</button><button type="button" class="btn-pill-trigger primary-trigger" id="compile-btn" disabled>MAKE &amp; SAVE ANIMATION</button></footer>'
    ],
    [
      '<script src="../animation-maker/app-v3.js"></' + 'script>',
      '<script src="../animation-maker/frame-export-bridge-loader.js?build=20260720-1"></' + 'script><script src="../animation-maker/frame-calculator.js?build=20260720-3"></' + 'script><script src="../animation-maker/frame-export-controls.js?build=20260720-1"></' + 'script>'
    ]
  ];

  for (const [needle, replacement] of patches) {
    if (!html.includes(needle)) {
      console.error('Animation Maker wrapper patch point missing:', needle);
      continue;
    }
    html = html.replace(needle, replacement);
  }

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
