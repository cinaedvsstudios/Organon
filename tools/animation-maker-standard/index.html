<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organon - Animation Maker</title>
</head>
<body>
<script>
(() => {
  'use strict';
  const request = new XMLHttpRequest();
  request.open('GET', './legacy.html?build=20260720-frame-actions-4', false);
  request.send(null);
  if ((request.status < 200 || request.status >= 300) && request.status !== 0) {
    document.body.innerHTML = '<p style="color:white;background:#1e201c;padding:20px;font-family:sans-serif">Animation Maker could not be loaded.</p>';
    return;
  }

  let html = request.responseText;
  const patches = [
    [
      '<link rel="stylesheet" href="../animation-maker/enhancements.css">',
      '<link rel="stylesheet" href="../animation-maker/enhancements.css"><link rel="stylesheet" href="../animation-maker/frame-skip-actions.css?build=20260720-3"><link rel="stylesheet" href="../animation-maker/frame-export-controls.css?build=20260720-2"><link rel="stylesheet" href="../animation-maker/video-timing-preview-fix.css?build=20260720-2"><link rel="stylesheet" href="../animation-maker/advanced-background-removal.css?build=20260720-1">'
    ],
    [
      '<div class="sequence-bottom-actions"><button type="button" class="mini-action" id="reorder-clips-btn" hidden>REORDER CLIPS</button></div>',
      '<div class="sequence-bottom-actions"><button type="button" class="mini-action" id="reorder-clips-btn" hidden>REORDER CLIPS</button><button type="button" class="mini-action" id="restore-skipped-frames-btn" hidden disabled>RESTORE ALL FRAMES</button></div>'
    ],
    [
      '<label class="input-group"><span>Output Format</span><select id="opt-format"><option value="gif" selected>GIF (Animated)</option></select></label><p class="help-text">Animated WebP is recommended for smaller files. GIF remains available for compatibility.</p><hr>',
      '<label class="input-group"><span>Output Format</span><select id="opt-format"><option value="gif" selected>GIF (Animated)</option></select></label><p class="help-text">Animated WebP is recommended for smaller files. GIF remains available for compatibility.</p><div class="video-timing-settings"><label class="input-group"><span>Video Capture FPS</span><select id="video-capture-fps"><option value="auto" selected>Auto — Source Frames</option><option value="12">12 FPS cap</option><option value="15">15 FPS cap</option><option value="24">24 FPS cap</option><option value="25">25 FPS cap</option><option value="30">30 FPS cap</option><option value="50">50 FPS cap</option><option value="60">60 FPS cap</option></select></label><p class="help-text">Auto captures presented source frames in order, removes consecutive duplicates and preserves their real timing. Accurate import runs slower than normal playback.</p></div><div class="frame-export-settings"><label class="input-group"><span>Frame Format</span><select id="frame-format"><option value="same" selected>Same as output</option><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option><option value="gif">GIF</option></select></label><label class="input-group"><span>Frame Names</span><input type="text" id="frame-name" value="animation-export" placeholder="frame"></label></div><p class="help-text">Frames are numbered automatically as 01, 02, 03 and so on.</p><hr>'
    ],
    [
      '<div class="frame-skip-box" id="frame-skip-container" hidden><label class="slider-container"><span class="slider-label-row emphasised"><span>Frame Skip (Drop Frames)</span><span id="val-skip">Keep All</span></span><input type="range" id="adj-skip" min="1" max="10" step="1" value="1"></label><p class="help-text">Videos generate many frames. Increase this to drop intermediate frames and reduce final file size.</p></div>',
      '<div class="frame-skip-box" id="frame-skip-container" hidden><label class="slider-container"><span class="slider-label-row emphasised"><span>Frame Skip (Drop Frames)</span><span class="frame-skip-controls"><span id="val-skip">Keep All</span><button type="button" class="frame-skip-delete-btn" id="delete-skipped-frames-btn" disabled>DELETE FRAMES</button></span></span><input type="range" id="adj-skip" min="1" max="10" step="1" value="1"></label><p class="help-text">Videos generate many frames. Choose a keep interval, then delete the intermediate frames. Playback length is preserved automatically.</p></div><div class="frame-calculator-box" id="frame-calculator"><div class="frame-calculator-title">Frame Calculator</div><div class="frame-calculator-grid"><label><span>Total number of frames</span><input type="number" id="calc-total-frames" min="0" step="1" value="0"></label><label><span>Frame Skip</span><input type="number" id="calc-frame-skip" min="1" max="10" step="1" value="1"></label><label><span>Animation length</span><span class="frame-calculator-unit"><input type="number" id="calc-animation-length" min="0.001" step="0.001" value="0.000"><b>seconds</b></span></label><label><span>Frame Duration</span><span class="frame-calculator-unit"><input type="number" id="calc-frame-duration" min="1" max="10000" step="1" value="200"><b>MS</b></span></label><label class="frame-calculator-fps"><span>FPS</span><input type="text" id="calc-fps" value="5.00" readonly aria-readonly="true" tabindex="-1"></label></div><p class="help-text">Change any editable box to scale the verified timeline. FPS is the average rate represented by Frame Duration.</p></div>'
    ],
    [
      '<label class="slider-container"><span class="slider-label-row"><span>Frame Duration (Speed)</span><span id="delay-value">200 ms</span></span><input type="range" id="frame-delay" min="40" max="1000" step="10" value="200"></label>',
      '<label class="slider-container"><span class="slider-label-row"><span>Frame Duration (Speed)</span><span id="delay-value">200 ms</span></span><input type="range" id="frame-delay" min="1" max="10000" step="1" value="200"></label>'
    ],
    [
      '<div class="tool-group"><h4>Mode</h4><div class="segmented wide mode-three" id="target-mode"><button type="button" data-target="cutout" class="active">CUTOUT</button><button type="button" data-target="paint">PAINT</button><button type="button" data-target="moving" title="Choose one stable frame as the background, then mark the area allowed to move. Everything outside that area stays still while the animation plays.">ANIMATE AREA ONLY</button></div></div>',
      '<div class="tool-group"><h4>Mode</h4><div class="segmented wide mode-four" id="target-mode"><button type="button" data-target="cutout" class="active">CUTOUT</button><button type="button" data-target="paint">PAINT</button><button type="button" data-target="moving" title="Choose one stable frame as the background, then mark the area allowed to move. Everything outside that area stays still while the animation plays.">ANIMATE AREA ONLY</button><button type="button" data-target="advanced" title="Remove a painted background, repair matte contamination and clear small edge artefacts across one frame or the full animation.">ADVANCED BACKGROUND REMOVAL</button></div></div>'
    ],
    [
      '<div class="tool-group history-tools"><button type="button" id="undo-edit">↶ UNDO</button><button type="button" id="redo-edit">↷ REDO</button></div>',
      '<div class="tool-group target-panel advanced-background-panel" id="advanced-background-panel" hidden><div class="tool-heading-tip"><h4>Advanced Background Removal</h4><button type="button" class="info-tip" aria-label="How Advanced Background Removal works">i<span>Paint the source background a strong colour, pick that colour here, then process the current frame or every frame. The operation is stored as one reversible editor step.</span></button></div><p class="tool-tip-text">Designed for painted green backgrounds and old black matte contamination. PLAY previews the processed animation; UNDO reverses the last batch.</p><label class="compact-control"><span>Key Colour</span><span class="advanced-color-row"><input type="color" id="advanced-bg-color" value="#00ff00"><button type="button" id="advanced-bg-pick">PICK FROM IMAGE</button></span></label><label class="checkbox-container advanced-checkbox"><input type="checkbox" id="advanced-bg-outside-only" checked><span class="checkmark"></span><span>Outside Background Only<small>Only removes matching colour connected to the canvas boundary.</small></span></label><label class="checkbox-container advanced-checkbox"><input type="checkbox" id="advanced-bg-protect-holes" checked><span class="checkmark"></span><span>Protect Interior Holes<small>Keeps enclosed matching colours inside the sprite.</small></span></label><label class="compact-control"><span>Key Tolerance <b id="advanced-bg-tolerance-label">42</b></span><input type="range" id="advanced-bg-tolerance" min="0" max="180" value="42"></label><label class="compact-control"><span>Key Softness <b id="advanced-bg-softness-label">18</b></span><input type="range" id="advanced-bg-softness" min="0" max="100" value="18"></label><hr><label class="checkbox-container advanced-checkbox"><input type="checkbox" id="advanced-bg-remove-black-matte" checked><span class="checkmark"></span><span>Remove Black Matte<small>Repairs dark contamination only in the narrow transparent edge band.</small></span></label><label class="compact-control"><span>Matte Edge Width <b id="advanced-bg-matte-width-label">3</b></span><input type="range" id="advanced-bg-matte-width" min="0" max="8" value="3"></label><label class="compact-control"><span>Matte Strength <b id="advanced-bg-matte-strength-label">70%</b></span><input type="range" id="advanced-bg-matte-strength" min="0" max="100" value="70"></label><label class="compact-control"><span>Despeckle Size <b id="advanced-bg-despeckle-label">12</b></span><input type="range" id="advanced-bg-despeckle" min="0" max="100" value="12"></label><label class="compact-control"><span>Alpha Contract / Expand <b id="advanced-bg-alpha-adjust-label">-1</b></span><input type="range" id="advanced-bg-alpha-adjust" min="-4" max="4" value="-1"></label><label class="compact-control"><span>Final Edge Feather <b id="advanced-bg-feather-label">1</b></span><input type="range" id="advanced-bg-feather" min="0" max="6" value="1"></label><div class="advanced-action-grid"><button type="button" class="primary-advanced-action" id="advanced-bg-process-current">PROCESS CURRENT FRAME</button><button type="button" class="primary-advanced-action" id="advanced-bg-process-all">PROCESS ALL FRAMES</button></div><div class="advanced-action-grid"><button type="button" class="danger-advanced-action" id="advanced-bg-clear-current">CLEAR CURRENT</button><button type="button" class="danger-advanced-action" id="advanced-bg-clear-all">CLEAR ALL</button></div><p class="advanced-bg-status" id="advanced-bg-status">No Advanced Background Removal has been applied yet.</p></div><div class="tool-group history-tools"><button type="button" id="undo-edit">↶ UNDO</button><button type="button" id="redo-edit">↷ REDO</button></div>'
    ],
    [
      '<footer class="bottom-sticky-panel"><button type="button" class="btn-pill-trigger" id="zip-btn" disabled>DOWNLOAD FRAMES ZIP</button><button type="button" class="btn-pill-trigger primary-trigger" id="compile-btn" disabled>MAKE &amp; SAVE ANIMATION</button></footer>',
      '<footer class="bottom-sticky-panel"><button type="button" class="btn-pill-trigger" id="zip-btn" disabled>DOWNLOAD FRAMES ZIP</button><button type="button" class="btn-pill-trigger" id="download-files-btn" disabled>DOWNLOAD FILES</button><button type="button" class="btn-pill-trigger primary-trigger" id="compile-btn" disabled>MAKE &amp; SAVE ANIMATION</button></footer>'
    ],
    [
      '<script src="../animation-maker/app-v3.js"></' + 'script>',
      '<script src="../animation-maker/advanced-background-removal-core.js?build=20260720-1"></' + 'script><script src="../animation-maker/advanced-background-removal-loader.js?build=20260720-1"></' + 'script><script src="../animation-maker/frame-calculator.js?build=20260720-5"></' + 'script><script src="../animation-maker/frame-export-controls.js?build=20260720-3"></' + 'script><script src="../animation-maker/video-timing-preview-fix.js?build=20260720-2"></' + 'script><script src="../animation-maker/advanced-background-removal-ui.js?build=20260720-1"></' + 'script><script src="../animation-maker/animation-maker-settings-memory.js?build=20260720-1"></' + 'script>'
    ]
  ];

  for (const [needle, replacement] of patches) {
    if (!html.includes(needle)) {
      console.error('Animation Maker wrapper patch point missing:', needle);
      continue;
    }
    html = html.replace(needle, replacement);
  }

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
