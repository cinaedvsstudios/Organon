<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organon — FileScan</title>
  <script>if (window.self === window.top) window.location.href='../../index.html';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./filescan.css">
  <script defer src="./filescan.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title">
        <select id="moduleSelect" class="module-select" aria-label="Choose FileScan module">
          <option value="filescan" selected>FILESCAN</option>
          <option value="file-rename">FILE RENAME</option>
        </select>
        <span id="fileStatus" class="folder">No files listed</span>
      </div>
      <div class="picker single-picker">
        <button id="addFiles" class="browse" type="button">Add files to list</button>
      </div>
      <input id="filePicker" type="file" multiple hidden>
    </header>

    <main>
      <section class="card" aria-label="File selection">
        <div class="summary">
          <div class="summary-row">
            <h1>File list</h1>
            <span id="selectionCount" class="count">0 selected</span>
          </div>
          <p id="summaryText" class="note">Choose individual files to build a selectable filename list.</p>
          <div id="postControls" class="post-controls">
            <div class="filter-row">
              <input id="filterInput" class="filter-input" type="search" autocomplete="off" placeholder="Filter filenames">
              <select id="sortSelect" class="sort-select" aria-label="Sort files">
                <option value="original">Sort: Selection order</option>
                <option value="name-asc">Sort: Name A–Z</option>
                <option value="name-desc">Sort: Name Z–A</option>
                <option value="type-asc">Sort: File type A–Z</option>
                <option value="type-desc">Sort: File type Z–A</option>
              </select>
            </div>
            <div class="control-row">
              <button class="button" id="selectAll" disabled>Select all</button>
              <button class="button danger" id="clearAll" disabled>Clear all</button>
              <button class="button" id="invert" disabled>Invert</button>
              <button class="group-button" id="group" disabled>Group: off</button>
            </div>
          </div>
        </div>
        <div class="list-head">
          <span id="listLabel">Files</span>
          <span id="totalLabel">0 shown</span>
        </div>
        <div id="fileList" class="list">
          <div class="empty">Choose files above.<br>Selected files will be checked by default.</div>
        </div>
      </section>
    </main>

    <footer class="bottom">
      <button class="button" id="copy" disabled>Copy filenames</button>
      <button class="button txt" id="txt" disabled>Export TXT</button>
      <button class="button csv" id="csv" disabled>Export CSV</button>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
