<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organon — FileScan</title>
  <script>if (window.self === window.top) window.location.href='../../index.html';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--ochre:#e5a862;--bronze:#896b49;--blue:#4b84bf;--spray:#79b4e3;--paper:#f2ece0;--night:#181919;--card:#292a24;--input:rgba(24,25,25,.95);--red:#9a2f4f;--teal:#26615c;--head:'Cinzel',Georgia,serif;--body:'Inter',system-ui,sans-serif;--mono:'Geist Mono',Consolas,monospace}
    *{box-sizing:border-box} body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body)} button,input{font:inherit} button:focus-visible,input:focus-visible{outline:2px solid var(--spray);outline-offset:2px}
    .app{width:100%;max-width:540px;min-height:100vh;margin:auto;display:flex;flex-direction:column;background:var(--night)}
    .top{position:sticky;top:0;z-index:5;padding:20px 16px 16px;border-bottom:1px solid var(--bronze);border-radius:0 0 28px 28px;background:#d79e5c linear-gradient(rgba(224,163,96,.8),rgba(224,163,96,.8)),url('../../images/stonetext.jpg');background-size:cover;box-shadow:0 8px 20px rgba(0,0,0,.28)}
    .title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;border:1px solid var(--bronze);border-radius:999px;background:rgba(24,25,25,.93);color:var(--spray);font-family:var(--head);font-size:.85rem;font-weight:700;letter-spacing:.05em}.folder{max-width:53%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(242,236,224,.72);font:500 .63rem var(--mono)}
    .picker{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}.browse,.toggle,.button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--bronze);border-radius:999px;cursor:pointer;font-weight:700;letter-spacing:.035em;text-transform:uppercase;transition:.2s}.browse{padding:10px 16px;background:rgba(24,25,25,.92);color:var(--spray);font-size:.74rem}.browse:hover,.button:hover:not(:disabled){border-color:var(--spray);box-shadow:0 0 12px rgba(121,180,227,.34);background:rgba(41,42,36,.96)}.toggle{padding:7px 11px;background:rgba(24,25,25,.78);font-size:.68rem;white-space:nowrap}.toggle input{width:16px;height:16px;margin:0;accent-color:var(--blue)}
    main{flex:1;padding:16px 16px 150px;background:#000}.card{overflow:hidden;border:1px solid var(--bronze);border-radius:22px;background:var(--card)}.summary{padding:15px 16px;border-bottom:1px solid rgba(137,107,73,.7)}.summary-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{margin:0;color:var(--ochre);font:700 1rem var(--head);letter-spacing:.045em}.count{flex:0 0 auto;padding:4px 8px;border:1px solid rgba(121,180,227,.58);border-radius:999px;color:var(--spray);font:700 .65rem var(--mono)}.note{min-height:19px;margin:7px 0 0;color:rgba(242,236,224,.74);font-size:.75rem;line-height:1.45}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.button{padding:9px 8px;background:var(--input);color:var(--paper);font-size:.63rem}.button:disabled{cursor:not-allowed;opacity:.42}.button.danger{color:#ffb0c1}.list-head{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(137,107,73,.55);color:var(--spray);font:700 .67rem var(--mono);letter-spacing:.05em;text-transform:uppercase}.list{max-height:calc(100vh - 400px);min-height:190px;overflow:auto;background:rgba(0,0,0,.22)}.list::-webkit-scrollbar{width:9px}.list::-webkit-scrollbar-thumb{border:2px solid var(--card);border-radius:999px;background:var(--bronze)}.empty{display:grid;min-height:190px;place-items:center;padding:25px;color:rgba(242,236,224,.55);font-size:.8rem;text-align:center;line-height:1.5}.file{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(137,107,73,.25);cursor:pointer;transition:background .16s}.file:hover{background:rgba(75,132,191,.1)}.file input{width:17px;height:17px;flex:0 0 auto;margin:0;accent-color:var(--blue);cursor:pointer}.file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper);font:.74rem var(--mono)}.file.nested .file-name{color:#d1e7ff}.bottom{position:fixed;z-index:4;bottom:0;left:50%;width:100%;max-width:540px;transform:translateX(-50%);display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px;padding:14px 16px 18px;border-top:1px solid var(--bronze);border-radius:28px 28px 0 0;background:#d79e5c linear-gradient(rgba(224,163,96,.8),rgba(224,163,96,.8)),url('../../images/stonetext.jpg');background-size:cover}.bottom .button{min-height:43px;background:rgba(24,25,25,.92);color:var(--spray);font-size:.66rem}.bottom .button.txt{color:var(--paper)}.bottom .button.csv{color:#caecff}.toast{position:fixed;z-index:20;right:18px;bottom:84px;max-width:calc(100vw - 36px);padding:10px 14px;border:1px solid var(--bronze);border-radius:999px;background:rgba(24,25,25,.97);color:var(--spray);font-size:.74rem;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:400px){.picker{grid-template-columns:1fr}.toggle{justify-content:center}.tools{grid-template-columns:1fr}.list{max-height:calc(100vh - 475px)}.bottom{grid-template-columns:1fr 1fr}.bottom .button:first-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title"><span>FILESCAN</span><span id="folderName" class="folder">No folder selected</span></div>
      <div class="picker">
        <label class="browse" for="folderPicker">Browse folder</label>
        <label class="toggle"><input id="subfolders" type="checkbox"> Include subfolders</label>
      </div>
      <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>
    </header>
    <main>
      <section class="card" aria-label="File selection">
        <div class="summary"><div class="summary-row"><h1>Folder file list</h1><span id="selectionCount" class="count">0 selected</span></div><p id="summaryText" class="note">Choose a folder to build a selectable filename list.</p><div class="tools"><button class="button" id="selectAll" disabled>Select all</button><button class="button danger" id="clearAll" disabled>Clear all</button><button class="button" id="invert" disabled>Invert</button></div></div>
        <div class="list-head"><span id="listLabel">Files</span><span id="totalLabel">0 shown</span></div><div id="fileList" class="list"><div class="empty">Choose a folder above.<br>Files will be selected by default.</div></div>
      </section>
    </main>
    <footer class="bottom"><button class="button" id="copy" disabled>Copy filenames</button><button class="button txt" id="txt" disabled>Export TXT</button><button class="button csv" id="csv" disabled>Export CSV</button></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const picker=document.getElementById('folderPicker'), nestedToggle=document.getElementById('subfolders');
    const folderName=document.getElementById('folderName'), fileList=document.getElementById('fileList'), selectionCount=document.getElementById('selectionCount'), summaryText=document.getElementById('summaryText'), listLabel=document.getElementById('listLabel'), totalLabel=document.getElementById('totalLabel'), toast=document.getElementById('toast');
    const actions=[document.getElementById('selectAll'),document.getElementById('clearAll'),document.getElementById('invert'),document.getElementById('copy'),document.getElementById('txt'),document.getElementById('csv')];
    let files=[];
    function setHubStatus(text){window.parent?.postMessage?.({type:'set-status',text},'*')}function clearHubStatus(){window.parent?.postMessage?.({type:'clear-status'},'*')}
    function flash(text){toast.textContent=text;toast.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>toast.classList.remove('show'),2400)}
    function normalise(file){const raw=(file.webkitRelativePath||file.name).replaceAll('\\','/');const bits=raw.split('/').filter(Boolean);const path=bits.length>1?bits.slice(1).join('/'):file.name;return {path,file,selected:true,nested:path.includes('/')};}
    function shown(){return nestedToggle.checked?files:files.filter(item=>!item.nested)}
    function selected(){return shown().filter(item=>item.selected)}
    function update(){const visible=shown(), chosen=selected();selectionCount.textContent=`${chosen.length} selected`;totalLabel.textContent=`${visible.length} shown`;listLabel.textContent=nestedToggle.checked?'Files and relative paths':'Files in selected folder';summaryText.textContent=files.length?`${files.length} file${files.length===1?'':'s'} found. ${nestedToggle.checked?'Including subfolders.':'Only direct folder files are shown.'}`:'Choose a folder to build a selectable filename list.';actions.forEach(button=>button.disabled=!files.length);render(visible)}
    function render(visible){fileList.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=files.length?'No direct files were found in this folder. Turn on Include subfolders to see nested files.':'Choose a folder above. Files will be selected by default.';fileList.append(empty);return}const fragment=document.createDocumentFragment();visible.forEach(item=>{const label=document.createElement('label');label.className=`file${item.nested?' nested':''}`;const check=document.createElement('input');check.type='checkbox';check.checked=item.selected;check.addEventListener('change',()=>{item.selected=check.checked;update()});const name=document.createElement('span');name.className='file-name';name.title=item.path;name.textContent=item.path;label.append(check,name);fragment.append(label)});fileList.append(fragment)}
    function chosenText(){return selected().map(item=>item.path).join('\n')}
    async function copyNames(){const text=chosenText();if(!text){flash('Select at least one file first.');return}try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();document.execCommand('copy');area.remove()}flash(`${selected().length} filename${selected().length===1?'':'s'} copied.`)}
    function download(name,text,type){const blob=new Blob([text],{type});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
    function stamp(){return new Date().toISOString().slice(0,10)}
    picker.addEventListener('change',event=>{const list=Array.from(event.target.files||[]);files=list.map(normalise).sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true,sensitivity:'base'}));const raw=list[0]?.webkitRelativePath||'';folderName.textContent=raw.split('/').filter(Boolean)[0]||'Selected folder';update();setHubStatus(`FileScan loaded ${files.length} local files.`);setTimeout(clearHubStatus,2200)});
    nestedToggle.addEventListener('change',update);
    document.getElementById('selectAll').addEventListener('click',()=>{shown().forEach(item=>item.selected=true);update()});document.getElementById('clearAll').addEventListener('click',()=>{shown().forEach(item=>item.selected=false);update()});document.getElementById('invert').addEventListener('click',()=>{shown().forEach(item=>item.selected=!item.selected);update()});document.getElementById('copy').addEventListener('click',copyNames);
    document.getElementById('txt').addEventListener('click',()=>{const lines=chosenText();if(!lines){flash('Select at least one file first.');return}download(`filescan-${stamp()}.txt`,lines+'\n','text/plain;charset=utf-8');flash('TXT exported.')});
    document.getElementById('csv').addEventListener('click',()=>{const items=selected();if(!items.length){flash('Select at least one file first.');return}const csv=['filename',...items.map(item=>'"'+item.path.replaceAll('"','""')+'"')].join('\r\n')+'\r\n';download(`filescan-${stamp()}.csv`,csv,'text/csv;charset=utf-8');flash('CSV exported.')});
    document.querySelectorAll('button,label').forEach(el=>{el.addEventListener('mouseenter',()=>{if(el.id==='copy')setHubStatus('Copy the currently selected filenames to the clipboard.');else if(el.id==='txt'||el.id==='csv')setHubStatus('Export the currently selected filenames.');else if(el.htmlFor==='folderPicker')setHubStatus('Choose a local folder.');else if(el.classList.contains('toggle'))setHubStatus('Show nested files and relative paths.');});el.addEventListener('mouseleave',clearHubStatus)});
  </script>
</body>
</html>
