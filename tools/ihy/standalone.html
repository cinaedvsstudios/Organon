<!doctype html>
<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Ihy v0.56
  </title>
  <link href="./standalone.css?v=0.57" rel="stylesheet"/>
  <link href="./feedback.css?v=0.57" rel="stylesheet"/>
  <link href="./bass-generator.css?v=0.57" rel="stylesheet"/>
 </head>
 <body>
  <header class="app-header">
   <div class="brand">
    <img alt="Ihy" class="brand-icon" src="./icon.png"/>
    <strong>
     Ihy
    </strong>
    <span class="version-pill">
     v0.56
    </span>
   </div>
   <div class="project-meta">
    <label class="field composition-field">
     <span>
      Filename
     </span>
     <input id="projectTitle" value="Untitled cue"/>
    </label>
    <div class="header-transport">
     <div class="tool-set">
      <button id="toolAdd">
       🎶
      </button>
      <button id="undo">
       ↶
      </button>
      <button id="redo">
       ↷
      </button>
      <button id="toolSelect">
       👆
      </button>
      <button id="groupSelection">
       🫱🏻‍🫲🏽
      </button>
      <button id="deleteSelection">
       🗑️
      </button>
     </div>
     <button id="playPause">
      ▶ Play
     </button>
     <button id="stopPlayback">
      ⏹ Stop
     </button>
     <output id="transportTime">
      0:00 / 0:42
     </output>
     <button id="addSection">
      ＋ Section
     </button>
     <label class="zoom">
      <span>
       Zoom
      </span>
      <input id="zoomRange" max="150" min="70" type="range" value="100"/>
      <output id="zoomValue">
       100%
      </output>
     </label>
     <button id="dragMute">
      🔊
     </button>
    </div>
   </div>
  </header>
  <main class="workspace">
   <aside class="sidebar">
    <section class="panel">
     <div class="button-row">
      <button id="createNew">
       Create
      </button>
      <button id="saveProject">
       Save
      </button>
      <button id="clearTrack">
       Clear
      </button>
     </div>
     <div class="button-row">
      <button id="importProject">
       Import
      </button>
      <button id="exportProject">
       Export
      </button>
      <button id="analyseProject">
       Analyse
      </button>
     </div>
     <input hidden="" id="fileInput" type="file"/>
     <div class="button-row">
      <button id="quickBass">
       ＋ Bass
      </button>
      <button id="quickMotif">
       ＋ Motif
      </button>
     </div>
     <div class="control-settings-grid">
      <select id="instrument">
      </select>
      <input id="bpm" type="number" value="92"/>
      <select id="projectKey">
       <option>
        D minor
       </option>
       <option>
        C major
       </option>
       <option>
        A minor
       </option>
      </select>
      <button id="chordMode">
       Chord
      </button>
      <select id="armedTrack">
      </select>
      <select id="quantise">
       <option value=".25">
        1/4
       </option>
      </select>
      <input id="transpose" type="number" value="0"/>
     </div>
     <p id="status">
     </p>
    </section>
    <section class="panel">
     <button id="addTrack">
      ＋ Track
     </button>
     <div id="tracks">
     </div>
    </section>
   </aside>
   <section class="editor">
    <section class="panel piano-panel">
     <div id="timelineViewport">
      <div id="timeline">
      </div>
     </div>
     <div id="rollResizeShell">
      <div id="rollScroll">
       <div id="pitchLabels">
       </div>
       <div id="roll">
       </div>
      </div>
      <div id="rollResizeGrip">
      </div>
     </div>
    </section>
    <section class="panel">
     <div id="keyboardResizeShell">
      <div id="keyboardWrap">
       <div id="piano">
       </div>
      </div>
      <div id="keyboardResizeGrip">
      </div>
     </div>
    </section>
   </section>
  </main>
  <menu hidden="" id="noteMenu">
   <button data-note-action="copy">
    Copy
   </button>
   <button data-note-action="cut">
    Cut
   </button>
   <button data-note-action="paste">
    Paste
   </button>
   <button data-note-action="duplicate">
    Duplicate
   </button>
   <button data-note-action="make-chord">
    Chord
   </button>
   <button data-note-action="delete">
    Delete
   </button>
  </menu>
  <menu hidden="" id="trackMenu">
   <button data-track-action="rename">
    Rename
   </button>
   <button data-track-action="duplicate">
    Duplicate
   </button>
   <button data-track-action="delete">
    Delete
   </button>
   <button id="trackInstrumentToggle">
    Instrument
   </button>
   <div id="trackInstrumentChoices">
   </div>
  </menu>
  <menu hidden="" id="sectionMenu">
   <button data-section-action="rename">
    Rename
   </button>
   <button data-section-action="duplicate">
    Duplicate
   </button>
   <button data-section-action="delete">
    Delete
   </button>
  </menu>
  <div hidden="" id="quickModal">
   <h3 id="quickTitle">
   </h3>
   <p id="quickText">
   </p>
   <button data-close="quickModal">
    Close
   </button>
  </div>
  <div class="modal-layer" hidden="" id="bassModal">
   <section class="modal bass-modal" id="bassModalCard">
    <header class="bass-modal-header" id="bassModalHeader">
     <h3>
      Bass Generator
     </h3>
     <div class="bass-header-actions">
      <div class="bass-header-tabs" id="bassModeTabs">
       <button class="bass-mode-tab selected" data-mode="genre">
        Genre
       </button>
       <button class="bass-mode-tab" data-mode="emotion">
        Emotion
       </button>
       <button class="bass-mode-tab" data-mode="custom">
        Custom
       </button>
      </div>
      <button class="button create" id="bassPreview">
       Preview
      </button>
      <button class="button primary" id="bassAdd">
       Add to Timeline
      </button>
      <button class="button" id="bassClose">
       Close
      </button>
     </div>
    </header>
    <div class="modal-body">
     <div class="bass-generator-layout">
      <div class="bass-top-grid">
       <section class="bass-card">
        <h4>
         Preset
        </h4>
        <label class="bass-form-field">
         Instrument
         <select id="bassInstrument">
          <option value="contrabass_arco">
           Contrabass (Arco)
          </option>
          <option value="contrabass_pizz">
           Contrabass (Pizzicato)
          </option>
          <option value="tuba">
           Tuba
          </option>
          <option value="contrabassoon">
           Contrabassoon
          </option>
          <option value="cello_bass">
           Cello Bass
          </option>
          <option value="grand_piano">
           Grand Piano
          </option>
          <option value="strings">
           Strings
          </option>
          <option value="violin">
           Violin
          </option>
          <option value="church_organ">
           Church Organ
          </option>
          <option value="clarinet">
           Clarinet
          </option>
          <option value="oboe">
           Oboe
          </option>
         </select>
        </label>
        <label class="bass-form-field">
         Register
         <select id="bassRegister">
          <option value="24">
           Low
          </option>
          <option selected="" value="36">
           Standard
          </option>
          <option value="48">
           High
          </option>
         </select>
        </label>
        <div class="bass-parser">
         <span>
          Paste note pattern
         </span>
         <textarea id="bassTextInput"></textarea>
         <button class="button" id="bassProcess">
          Process
         </button>
        </div>
       </section>
       <section class="bass-card">
        <h4>
         Structure
        </h4>
        <div class="bass-choice-row" id="bassPhraseChoices">
         <button class="bass-phrase selected bass-choice" data-b="8">
          8 beats
         </button>
         <button class="bass-phrase bass-choice" data-b="16">
          16 beats
         </button>
         <button class="bass-phrase bass-choice" data-b="32">
          32 beats
         </button>
        </div>
        <div class="bass-transform-row">
         <button class="bass-transform" id="bassSustain">
          Sustain
         </button>
         <button class="bass-transform" id="bassEcho">
          Echo
         </button>
         <button class="bass-transform" id="bassChords">
          Chords
         </button>
        </div>
        <input id="bassLength" max="10" min="1" type="range" value="1"/>
        <output id="bassLengthValue">
         1 × 32 beats = 32 beats
        </output>
       </section>
       <section class="bass-card">
        <div class="bass-card-section" id="bassProfileCard">
         <h4 id="bassProfileHeading">
          Genre profile
         </h4>
         <select id="bassProfileSelect">
         </select>
         <button class="button" id="bassLoadProfile">
          Load
         </button>
         <p hidden="" id="bassEmotionDetail">
         </p>
         <button class="button" id="bassRandomProfile">
          Random
         </button>
         <button class="button" id="bassMutate">
          Variant
         </button>
         <input id="bassMutationRate" max="50" min="0" type="range" value="25"/>
         <output id="bassMutationOutput">
          25% mutation
         </output>
        </div>
        <div class="bass-card-section" hidden="" id="bassCustomCard">
         <select id="bassCustomMotion">
          <option value="pedal">
           Pedal
          </option>
          <option value="arpeggio">
           Arpeggio
          </option>
          <option value="stepwise">
           Stepwise
          </option>
         </select>
         <select id="bassPedalTarget">
          <option value="root">
           Root
          </option>
          <option value="fifth">
           Fifth
          </option>
         </select>
         <input id="bassArticulation" max="100" min="0" type="range" value="82"/>
         <output id="bassArticulationOutput">
          Legato
         </output>
         <select id="bassDynamics">
          <option value="flat">
           Flat
          </option>
          <option value="crescendo">
           Crescendo
          </option>
          <option value="decrescendo">
           Decrescendo
          </option>
          <option value="swell">
           Swell
          </option>
         </select>
         <input id="bassInversions" type="checkbox"/>
         <button class="button" id="bassGenerateCustom">
          Generate
         </button>
        </div>
        <select id="bassHarmonySource">
        </select>
       </section>
      </div>
      <div class="bass-summary" id="bassSummary">
      </div>
      <section class="bass-editor">
       <h4 id="bassEditorTitle">
        Editable bass tune
       </h4>
       <span hidden="" id="bassEditorText">
       </span>
       <div class="bass-editor-options">
        <div class="dna-interval-palette" id="bassIntervalPalette">
        </div>
        <div class="dna-tie-palette" id="bassTiePalette">
        </div>
       </div>
       <div class="bass-step-scroll" id="bassStepGrid">
       </div>
       <div class="dna-bar-labels" id="bassBarLabels">
       </div>
      </section>
     </div>
    </div>
    <div class="bass-modal-resize-grip" id="bassResizeGrip">
    </div>
   </section>
  </div>
  <div hidden="" id="renameModal">
   <input id="renameInput"/>
   <button id="renameConfirm">
    OK
   </button>
  </div>
  <div hidden="" id="analysisModal">
   <textarea id="analysisText"></textarea>
   <button id="copyAnalysis">
    Copy
   </button>
  </div>
  <div hidden="" id="exportModal">
   <div id="exportFormats">
    <input checked="" name="exportFormat" type="radio" value="json"/>
    <input name="exportFormat" type="radio" value="midi"/>
    <input name="exportFormat" type="radio" value="wav"/>
    <input name="exportFormat" type="radio" value="mp3"/>
   </div>
   <p id="exportDescription">
   </p>
   <input id="includeMuted" type="checkbox"/>
   <p id="exportStatus">
   </p>
   <button id="doExport">
    Export
   </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js">
  </script>
  <script src="./standalone.js?v=0.57">
  </script>
  <script src="./clear-all.js?v=0.57">
  </script>
  <script src="./bass-generator.js?v=0.57">
  </script>
 </body>
</html>
