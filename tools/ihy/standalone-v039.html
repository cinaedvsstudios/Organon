<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171817">
  <title>Ihy v0.39</title>
  <style>
    html,body{height:100%;margin:0;background:#171817;color:#f4eddf;font-family:system-ui,sans-serif}
    #recovery{display:grid;height:100%;place-items:center;text-align:center;padding:24px}
    .card{max-width:520px;padding:22px;border:1px solid #80643f;border-radius:16px;background:linear-gradient(145deg,#37382f,#20221d);box-shadow:0 10px 25px #0009}
    h1{margin:0 0 8px;color:#e3ab63;font:800 1.3rem Georgia,serif}
    p{margin:0;color:#c2bdb3;font-size:.9rem;line-height:1.5}
  </style>
</head>
<body>
  <div id="recovery"><div class="card"><h1>Ihy v0.39</h1><p>Loading the repaired editor…</p></div></div>
  <script>
  (async () => {
    const fail = message => {
      document.getElementById('recovery').innerHTML = `<div class="card"><h1>Ihy could not start</h1><p>${message}</p></div>`;
    };
    try {
      const response = await fetch('./standalone-v038.html?v=0.39', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Source file returned ${response.status}.`);
      let source = await response.text();

      source = source.replace(
        /safe=\(r,f\)=>\{try\{return JSON\.parse\(r\)\}catch\{return f\}\}/,
        'safe=(r,f)=>{try{const value=JSON.parse(r);return value??f}catch{return f}}'
      );
      source = source.replace(
        /history=safe\(localStorage\.getItem\(HSTORE\),\{undo:\[\],redo:\[\]\}\);/,
        'history=safe(localStorage.getItem(HSTORE),{undo:[],redo:[]});history={undo:Array.isArray(history?.undo)?history.undo:[],redo:Array.isArray(history?.redo)?history.redo:[]};'
      );
      source = source.replace(
        /const p=safe\(localStorage\.getItem\(WSTORE\),\{\}\)\[id\]/,
        'const p=(safe(localStorage.getItem(WSTORE),{})||{})[id]'
      );
      source = source.replace(
        /const p=safe\(localStorage\.getItem\(WSTORE\),\{\}\);p\[d\.id\]/,
        'const p=(safe(localStorage.getItem(WSTORE),{})||{});p[d.id]'
      );
      source = source.replace('<div class="version">v0.38</div>', '<div class="version">v0.39</div>');
      source = source.replace('v0.38 — piano-roll editor.', 'v0.39 — repaired piano-roll editor.');

      document.open();
      document.write(source);
      document.close();
    } catch (error) {
      fail(error.message || 'Unknown startup error.');
    }
  })();
  </script>
</body>
</html>
